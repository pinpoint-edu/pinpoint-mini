<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Classes</title>
  <link rel="icon" type="image/png" href="../favicons/google-classroom.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      warnOnUnsupportedContent: false,
      publicPath: "https://cdn.jsdelivr.net/gh/pinpoint-edu/pinpoint-mini@main/textbooks/ruffle/"
    };
  </script>
  <script src="./ruffle/ruffle.js"></script>
</head>
<body>
  <div id="player-container"></div>
  <script>
    async function initHappyWheels() {
      try {
        let ruffle = null;
        if (window.RufflePlayer && typeof window.RufflePlayer.newest === 'function') {
          ruffle = window.RufflePlayer.newest();
        } else {
          for (let i = 0; i < 30; i++) {
            await new Promise(r => setTimeout(r, 100));
            if (window.RufflePlayer && typeof window.RufflePlayer.newest === 'function') {
              ruffle = window.RufflePlayer.newest();
              break;
            }
          }
        }

        if (!ruffle) {
          throw new Error("Ruffle failed to initialize");
        }

        const player = ruffle.createPlayer();
        const container = document.getElementById("player-container");
        container.appendChild(player);

        const swfUrls = [
          "./happy-wheels.swf",
          "happy-wheels.swf",
          "https://cdn.jsdelivr.net/gh/pinpoint-edu/pinpoint-mini@main/textbooks/happy-wheels.swf",
          "https://raw.githubusercontent.com/pinpoint-edu/pinpoint-mini/main/textbooks/happy-wheels.swf",
          "https://cdn.jsdelivr.net/gh/pinpoint-edu/assets@main/textbooks/happy-wheels.swf",
          "https://raw.githubusercontent.com/pinpoint-edu/assets/main/textbooks/happy-wheels.swf"
        ];
        
        let loaded = false;
        for (const url of swfUrls) {
          try {
            const res = await fetch(url);
            if (res.ok) {
              const buffer = await res.arrayBuffer();
              if (buffer && buffer.byteLength > 1000) {
                const header = new Uint8Array(buffer.slice(0, 3));
                const magic = String.fromCharCode(header[0], header[1], header[2]);
                if (magic === 'FWS' || magic === 'CWS' || magic === 'ZWS') {
                  player.load({ data: buffer });
                  loaded = true;
                  break;
                }
              }
            }
          } catch(e) {}
        }
        if (!loaded) {
          player.load({ url: swfUrls[0] });
        }
      } catch (err) {
        console.error("Error loading Happy Wheels:", err);
      }
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", initHappyWheels);
    } else {
      initHappyWheels();
    }
  </script>
</body>
</html>
