<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Classes</title>
  <link rel="icon" type="image/png" href="../favicons/google-classroom.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      warnOnUnsupportedContent: false,
      publicPath: "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/"
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"></script>
</head>
<body>
  <div id="player-container"></div>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player-container");
        container.appendChild(player);

        const swfUrls = [
          "https://cdn.jsdelivr.net/gh/pinpoint-edu/assets@main/textbooks/happy-wheels.swf",
          "https://raw.githubusercontent.com/pinpoint-edu/assets/main/textbooks/happy-wheels.swf"
        ];
        
        let loaded = false;
        for (const url of swfUrls) {
          try {
            const res = await fetch(url);
            if (res.ok) {
              const buffer = await res.arrayBuffer();
              if (buffer && buffer.byteLength > 1000) {
                player.load({ data: buffer });
                loaded = true;
                break;
              }
            }
          } catch(e) {}
        }
        if (!loaded) {
          player.load({ url: swfUrls[0] });
        }
      } catch (err) {
        console.error("Error loading Happy Wheels:", err);
      }
    });
  </script>
</body>
</html>
