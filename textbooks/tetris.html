<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tetris</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      user-select: none;
      -webkit-user-select: none;
    }

    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }

    /* 4:3 Viewport Container with Navy Blue Pillarbox Bars on Left & Right */
    body {
      background: #040915; /* navy blue bars on sides */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 4:3 Aspect Ratio Shell, Scaled to Maximize Viewport */
    .tetris-app {
      aspect-ratio: 4 / 3;
      height: 96vh;
      max-height: calc(98vw * 3 / 4);
      width: calc(96vh * 4 / 3);
      max-width: 98vw;
      background: #0d2347;
      border: 4px solid #000000;
      display: flex;
      gap: 24px;
      padding: 18px 24px;
      box-sizing: border-box;
      position: relative;
    }

    /* Left Side: Game Board & Stats */
    .game-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      height: 100%;
      flex-shrink: 0;
    }

    .board-container {
      position: relative;
      border: 4px solid #000000;
      background: #d4d4d8;
      overflow: hidden;
      flex: 1;
      display: flex;
    }

    #tetris-canvas {
      display: block;
      background: #d4d4d8;
      height: 100%;
      width: auto;
      aspect-ratio: 10 / 20;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .stat-card {
      background: #123060;
      border: 3px solid #000000;
      padding: 8px 6px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #93c5fd;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
    }

    /* Right Side: Sidebar */
    .sidebar-side {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 16px;
      height: 100%;
      min-width: 0;
    }

    .panel {
      background: #123060;
      border: 3px solid #000000;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #bfdbfe;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .panel-title .material-symbols-sharp {
      font-size: 20px;
    }

    /* Top Right: Next piece preview */
    .next-preview-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 160px;
      background: #d4d4d8;
      border: 3px solid #000000;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    /* NEVER stretch canvas pixels with CSS percentage widths */
    #next-canvas {
      display: block;
      background: #d4d4d8;
      margin: auto;
    }

    /* Keyboard Inverted-T Arrow Cluster Setup (No Controls Box) */
    .keyboard-arrow-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex: 1;
      margin-top: auto;
      margin-bottom: auto;
    }

    .arrow-row-top {
      display: flex;
      justify-content: center;
    }

    .arrow-row-bottom {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    /* Universal Buttons */
    .btn-key {
      width: 74px;
      height: 74px;
      background: #1d4ed8;
      color: #ffffff;
      border: 3px solid #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background 0.1s, transform 0.05s;
      position: relative;
    }

    .btn-key:hover {
      background: #2563eb;
    }

    .btn-key:active {
      transform: translateY(2px);
      background: #1e40af;
    }

    .btn-key .material-symbols-sharp {
      font-size: 44px;
    }

    /* Bottom Actions Row: Big Square Pause & Music Buttons */
    .bottom-actions-row {
      display: flex;
      gap: 14px;
      justify-content: center;
      align-items: center;
      margin-top: auto;
      padding-top: 4px;
    }

    .btn-action-square {
      width: 68px;
      height: 68px;
      background: #123060;
      color: #ffffff;
      border: 3px solid #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background 0.1s, transform 0.05s;
      position: relative;
    }

    .btn-action-square:hover {
      background: #1e40af;
    }

    .btn-action-square:active {
      transform: translateY(2px);
    }

    .btn-action-square .material-symbols-sharp {
      font-size: 36px;
    }

    /* Sharp Custom Tooltip System */
    [data-tooltip] {
      position: relative;
    }

    [data-tooltip]::before {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: #040915;
      color: #ffffff;
      border: 2px solid #000000;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      z-index: 100;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    }

    /* Notch arrow pointing down from top tooltip */
    [data-tooltip]::after {
      content: '';
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0 6px;
      border-style: solid;
      border-color: #000000 transparent transparent transparent;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      z-index: 101;
    }

    /* Tooltip positioned below the button */
    [data-tooltip-bottom]::before {
      bottom: auto;
      top: calc(100% + 10px);
    }

    [data-tooltip-bottom]::after {
      bottom: auto;
      top: calc(100% + 4px);
      border-width: 0 6px 6px 6px;
      border-color: transparent transparent #000000 transparent;
    }

    [data-tooltip]:hover::before,
    [data-tooltip]:hover::after {
      opacity: 1;
      visibility: visible;
    }

    /* Overlays */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 19, 38, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #ffffff;
    }

    .overlay-subtitle {
      font-size: 14px;
      color: #93c5fd;
    }

    .overlay-stats {
      background: #123060;
      border: 3px solid #000000;
      padding: 12px 24px;
      display: flex;
      gap: 24px;
    }

    .overlay-stat-item {
      text-align: center;
    }

    .overlay-stat-num {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
    }

    .btn-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background: #1d4ed8;
      color: #ffffff;
      border: 3px solid #000000;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      transition: background 0.1s, transform 0.05s;
    }

    .btn-overlay:hover {
      background: #2563eb;
    }

    .btn-overlay:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="tetris-app">
    <!-- Left: Game Board & Stats -->
    <div class="game-side">
      <div class="board-container">
        <canvas id="tetris-canvas" width="400" height="800"></canvas>

        <!-- Pause Overlay -->
        <div id="pause-overlay" class="overlay">
          <h2 class="overlay-title">PAUSED</h2>
          <p class="overlay-subtitle">Press <kbd style="padding: 2px 6px; background: #1a3f7a; border: 1px solid #000;">Space</kbd> or click to resume</p>
          <button id="resume-btn" class="btn-overlay" data-tooltip="Resume (Space)" title="Resume (Space)">
            <span class="material-symbols-sharp">play_arrow</span>
            <span>Resume</span>
          </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameover-overlay" class="overlay">
          <h2 class="overlay-title" style="color: #ff1744;">GAME OVER</h2>
          <div class="overlay-stats">
            <div class="overlay-stat-item">
              <div class="stat-label">SCORE</div>
              <div id="final-score" class="overlay-stat-num">0</div>
            </div>
            <div class="overlay-stat-item">
              <div class="stat-label">LINES</div>
              <div id="final-lines" class="overlay-stat-num">0</div>
            </div>
          </div>
          <button id="restart-btn" class="btn-overlay" data-tooltip="Restart Game" title="Restart Game">
            <span class="material-symbols-sharp">replay</span>
            <span>Play Again</span>
          </button>
        </div>
      </div>

      <!-- Stats Bar under Game -->
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-label">SCORE</div>
          <div id="score-display" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">LINES</div>
          <div id="lines-display" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">LEVEL</div>
          <div id="level-display" class="stat-value">1</div>
        </div>
      </div>
    </div>

    <!-- Right: Sidebar -->
    <div class="sidebar-side">
      <!-- Top Right: Next piece preview panel -->
      <div class="panel">
        <div class="panel-title">
          <span class="material-symbols-sharp">extension</span>
          NEXT PIECE
        </div>
        <div class="next-preview-box">
          <canvas id="next-canvas" width="280" height="160"></canvas>
        </div>
      </div>

      <!-- Inverted-T Keyboard Arrow Keys Setup with Tooltips -->
      <div class="keyboard-arrow-cluster">
        <!-- Up Row -->
        <div class="arrow-row-top">
          <button class="btn-key" id="btn-up" data-tooltip="Rotate (Up / X)" title="Rotate (Up Arrow / X)">
            <span class="material-symbols-sharp">arrow_upward</span>
          </button>
        </div>
        <!-- Bottom Row: Left, Down, Right -->
        <div class="arrow-row-bottom">
          <button class="btn-key" id="btn-left" data-tooltip="Move Left (←)" data-tooltip-bottom="true" title="Move Left (Left Arrow)">
            <span class="material-symbols-sharp">arrow_back</span>
          </button>
          <button class="btn-key" id="btn-down" data-tooltip="Fast Drop (↓)" data-tooltip-bottom="true" title="Fast Drop (Down Arrow)">
            <span class="material-symbols-sharp">arrow_downward</span>
          </button>
          <button class="btn-key" id="btn-right" data-tooltip="Move Right (→)" data-tooltip-bottom="true" title="Move Right (Right Arrow)">
            <span class="material-symbols-sharp">arrow_forward</span>
          </button>
        </div>
      </div>

      <!-- Bottom Actions: Big Square Pause Button & Calming Music Toggle with Tooltips -->
      <div class="bottom-actions-row">
        <button class="btn-action-square" id="pause-btn" data-tooltip="Pause / Resume (Space)" title="Pause / Resume (Space)">
          <span class="material-symbols-sharp" id="pause-icon">pause</span>
        </button>
        <button class="btn-action-square" id="music-btn" data-tooltip="Mute Music" title="Mute Music">
          <span class="material-symbols-sharp" id="music-icon">music_note</span>
        </button>
      </div>
    </div>
  </div>

    let bgAudio = null;
    let audioCtx = null;
    let webAudioSource = null;
    let musicStarted = false;
    let musicEnabled = true;

    function initAudio() {
      if (!bgAudio) {
        try {
          bgAudio = new Audio(CALM_PIANO_B64);
          bgAudio.loop = true;
          bgAudio.volume = 0.45;
        } catch (e) {
          console.warn("HTMLAudioElement init error:", e);
        }
      }
    }

    function playMusic() {
      if (!musicEnabled) return;
      initAudio();

      if (bgAudio) {
        const p = bgAudio.play();
        if (p !== undefined) {
          p.then(() => {
            musicStarted = true;
          }).catch(err => {
            console.warn("bgAudio.play() pending or failed:", err);
            playWebAudioFallback();
          });
          return;
        }
      }
      playWebAudioFallback();
    }

    function playWebAudioFallback() {
      if (!musicEnabled || musicStarted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        if (!window.__tetrisDecodedBuffer) {
          const rawB64 = CALM_PIANO_B64.split(",")[1];
          const bin = window.atob(rawB64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
            window.__tetrisDecodedBuffer = buffer;
            startWebAudioLoop(buffer);
          }, (err) => console.warn("decodeAudioData err", err));
        } else {
          startWebAudioLoop(window.__tetrisDecodedBuffer);
        }
      } catch (err) {
        console.warn("Web Audio fallback error:", err);
      }
    }

    function startWebAudioLoop(buffer) {
      if (!audioCtx || !musicEnabled) return;
      try {
        if (webAudioSource) {
          try { webAudioSource.stop(); } catch(e){}
        }
        webAudioSource = audioCtx.createBufferSource();
        webAudioSource.buffer = buffer;
        webAudioSource.loop = true;
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.45;
        webAudioSource.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        webAudioSource.start(0);
        musicStarted = true;
      } catch (e) {
        console.warn("startWebAudioLoop error:", e);
      }
    }

    function pauseMusic() {
      if (bgAudio) {
        try { bgAudio.pause(); } catch(e){}
      }
      if (audioCtx && audioCtx.state === "running") {
        try { audioCtx.suspend(); } catch(e){}
      }
      musicStarted = false;
    }

    function resumeMusic() {
      if (!musicEnabled) return;
      if (bgAudio) {
        bgAudio.play().then(() => { musicStarted = true; }).catch(() => playWebAudioFallback());
      } else if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().then(() => { musicStarted = true; }).catch(() => {});
      } else {
        playMusic();
      }
    }

    function toggleMusic() {
      musicEnabled = !musicEnabled;
      const musicIcon = document.getElementById("music-icon");
      if (musicEnabled) {
        musicIcon.textContent = "music_note";
        musicBtn.setAttribute("data-tooltip", "Mute Music");
        musicBtn.setAttribute("title", "Mute Music");
        resumeMusic();
      } else {
        musicIcon.textContent = "music_off";
        musicBtn.setAttribute("data-tooltip", "Play Music");
        musicBtn.setAttribute("title", "Play Music");
        pauseMusic();
      }
    }

    const pauseIcon = document.getElementById('pause-icon');
    const musicBtn = document.getElementById('music-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const restartBtn = document.getElementById('restart-btn');

    const btnUp = document.getElementById('btn-up');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnDown = document.getElementById('btn-down');

    function createMatrix(rows, cols) {
      const matrix = [];
      for (let r = 0; r < rows; r++) {
        matrix.push(new Array(cols).fill(0));
      }
      return matrix;
    }

    // 7-Bag Randomizer
    function getNextPieceFromBag() {
      if (bag.length === 0) {
        bag = [...PIECE_KEYS];
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bag[i], bag[j]] = [bag[j], bag[i]];
        }
      }
      const type = bag.pop();
      const proto = PIECES[type];
      return {
        type: type,
        matrix: proto.shape.map(row => [...row]),
        color: proto.color,
        x: Math.floor(COLS / 2) - Math.ceil(proto.shape[0].length / 2),
        y: 0
      };
    }

    function rotateMatrix(matrix, dir = 1) {
      const N = matrix.length;
      const res = createMatrix(N, N);
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (dir > 0) {
            res[c][N - 1 - r] = matrix[r][c];
          } else {
            res[N - 1 - c][r] = matrix[r][c];
          }
        }
      }
      return res;
    }

    function collide(b, piece) {
      const m = piece.matrix;
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (m[r][c]) {
            const bx = piece.x + c;
            const by = piece.y + r;
            if (bx < 0 || bx >= COLS || by >= ROWS) return true;
            if (by >= 0 && b[by][bx]) return true;
          }
        }
      }
      return false;
    }

    function merge(b, piece) {
      piece.matrix.forEach((row, r) => {
        row.forEach((value, c) => {
          if (value) {
            const by = piece.y + r;
            const bx = piece.x + c;
            if (by >= 0 && by < ROWS && bx >= 0 && bx < COLS) {
              b[by][bx] = piece.color;
            }
          }
        });
      });
    }

    function getGhostPiece() {
      if (!currentPiece) return null;
      const ghost = {
        ...currentPiece,
        matrix: currentPiece.matrix,
        x: currentPiece.x,
        y: currentPiece.y
      };
      while (!collide(board, ghost)) {
        ghost.y++;
      }
      ghost.y--;
      return ghost;
    }

    function playerMove(dir) {
      if (isPaused || isGameOver) return;
      playMusic();
      currentPiece.x += dir;
      if (collide(board, currentPiece)) {
        currentPiece.x -= dir;
      }
    }

    // Only clockwise rotation
    function playerRotate(dir = 1) {
      if (isPaused || isGameOver) return;
      playMusic();
      const origX = currentPiece.x;
      const origMatrix = currentPiece.matrix;
      currentPiece.matrix = rotateMatrix(currentPiece.matrix, 1);

      let offset = 1;
      while (collide(board, currentPiece)) {
        currentPiece.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (Math.abs(offset) > currentPiece.matrix[0].length) {
          currentPiece.matrix = origMatrix;
          currentPiece.x = origX;
          return;
        }
      }
    }

    function playerDrop() {
      if (isPaused || isGameOver) return;
      playMusic();
      currentPiece.y++;
      if (collide(board, currentPiece)) {
        currentPiece.y--;
        lockPiece();
      } else {
        dropCounter = 0;
        score += 1;
        updateScoreDisplays();
      }
    }

    function lockPiece() {
      merge(board, currentPiece);
      checkLines();
      spawnNextPiece();
    }

    function checkLines() {
      let linesCleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== 0)) {
          board.splice(r, 1);
          board.unshift(new Array(COLS).fill(0));
          linesCleared++;
          r++;
        }
      }

      if (linesCleared > 0) {
        const basePoints = [0, 100, 300, 500, 800];
        score += (basePoints[linesCleared] || linesCleared * 200) * level;
        lines += linesCleared;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 800 - (level - 1) * 65);

        updateScoreDisplays();
      }
    }

    function spawnNextPiece() {
      currentPiece = nextPiece || getNextPieceFromBag();
      nextPiece = getNextPieceFromBag();
      drawNextPreview();

      if (collide(board, currentPiece)) {
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      isFastDropping = false;
      pauseMusic();
      finalScore.textContent = score.toLocaleString();
      finalLines.textContent = lines;
      gameoverOverlay.classList.add('active');
    }

    function updateScoreDisplays() {
      scoreDisplay.textContent = score.toLocaleString();
      linesDisplay.textContent = lines;
      levelDisplay.textContent = level;
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      isFastDropping = false;

      if (isPaused) {
        pauseOverlay.classList.add('active');
        pauseIcon.textContent = "play_arrow";
        pauseBtn.setAttribute('data-tooltip', 'Resume (Space)');
        pauseBtn.setAttribute('title', 'Resume (Space)');
        pauseMusic();
      } else {
        pauseOverlay.classList.remove('active');
        pauseIcon.textContent = "pause";
        pauseBtn.setAttribute('data-tooltip', 'Pause (Space)');
        pauseBtn.setAttribute('title', 'Pause (Space)');
        if (musicEnabled) resumeMusic();
        lastTime = performance.now();
      }
    }

    function resetGame() {
      board = createMatrix(ROWS, COLS);
      bag = [];
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 800;
      dropCounter = 0;
      isPaused = false;
      isGameOver = false;
      isFastDropping = false;
      pauseOverlay.classList.remove('active');
      gameoverOverlay.classList.remove('active');
      pauseIcon.textContent = "pause";
      pauseBtn.setAttribute('data-tooltip', 'Pause (Space)');
      pauseBtn.setAttribute('title', 'Pause (Space)');
      if (musicEnabled) resumeMusic();
      updateScoreDisplays();
      nextPiece = getNextPieceFromBag();
      spawnNextPiece();
      lastTime = performance.now();
    }

    // --- Rendering: Bland saturated colors with thick black sharp outlines ---
    function drawBlock(ctxTarget, x, y, size, color, alpha = 1, outlineWidth = 3) {
      ctxTarget.save();
      ctxTarget.globalAlpha = alpha;

      // Solid flat saturated fill
      ctxTarget.fillStyle = color;
      ctxTarget.fillRect(x, y, size, size);

      // Black sharp outline (scalable thickness)
      ctxTarget.lineWidth = outlineWidth;
      ctxTarget.strokeStyle = '#000000';
      ctxTarget.strokeRect(
        x + outlineWidth / 2,
        y + outlineWidth / 2,
        size - outlineWidth,
        size - outlineWidth
      );

      ctxTarget.restore();
    }

    // NEVER stretch next piece: syncs canvas resolution 1:1 with container pixels
    function drawNextPreview() {
      const parent = nextCanvas.parentElement;
      const boxW = (parent && parent.clientWidth) ? parent.clientWidth : 280;
      const boxH = (parent && parent.clientHeight) ? parent.clientHeight : 160;

      if (nextCanvas.width !== boxW || nextCanvas.height !== boxH) {
        nextCanvas.width = boxW;
        nextCanvas.height = boxH;
      }

      nextCtx.fillStyle = '#d4d4d8';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!nextPiece) return;

      const m = nextPiece.matrix;
      const pieceW = m[0].length;
      const pieceH = m.length;

      let minX = pieceW, maxX = 0, minY = pieceH, maxY = 0;
      for (let r = 0; r < pieceH; r++) {
        for (let c = 0; c < pieceW; c++) {
          if (m[r][c]) {
            minX = Math.min(minX, c);
            maxX = Math.max(maxX, c);
            minY = Math.min(minY, r);
            maxY = Math.max(maxY, r);
          }
        }
      }

      const cols = maxX - minX + 1;
      const rows = maxY - minY + 1;

      // Extend to max size before height or width touch edge (24px padding)
      const paddingX = 24;
      const paddingY = 24;
      const maxCellW = (nextCanvas.width - paddingX * 2) / cols;
      const maxCellH = (nextCanvas.height - paddingY * 2) / rows;
      const size = Math.floor(Math.min(maxCellW, maxCellH));

      // Outline thickness scales proportionally with block size
      const outlineWidth = Math.max(3, Math.round(size * 0.09));

      const activeW = cols * size;
      const activeH = rows * size;
      const startX = Math.floor((nextCanvas.width - activeW) / 2) - minX * size;
      const startY = Math.floor((nextCanvas.height - activeH) / 2) - minY * size;

      for (let r = 0; r < pieceH; r++) {
        for (let c = 0; c < pieceW; c++) {
          if (m[r][c]) {
            drawBlock(nextCtx, startX + c * size, startY + r * size, size, nextPiece.color, 1, outlineWidth);
          }
        }
      }
    }

    function checkRedrawNextPreview() {
      const parent = nextCanvas.parentElement;
      const boxW = (parent && parent.clientWidth) ? parent.clientWidth : 280;
      const boxH = (parent && parent.clientHeight) ? parent.clientHeight : 160;
      if (nextPiece !== lastNextPiece || boxW !== lastNextBoxW || boxH !== lastNextBoxH) {
        lastNextPiece = nextPiece;
        lastNextBoxW = boxW;
        lastNextBoxH = boxH;
        drawNextPreview();
      }
    }

    function draw() {
      checkRedrawNextPreview();
      // Light grey board background
      ctx.fillStyle = '#d4d4d8';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clean grid lines on light grey
      ctx.strokeStyle = '#b8b8be';
      ctx.lineWidth = 1;
      for (let c = 1; c < COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * BLOCK_SIZE, 0);
        ctx.lineTo(c * BLOCK_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let r = 1; r < ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * BLOCK_SIZE);
        ctx.lineTo(canvas.width, r * BLOCK_SIZE);
        ctx.stroke();
      }

      // Draw locked board blocks
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const color = board[r][c];
          if (color) {
            drawBlock(ctx, c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, color, 1, 3.5);
          }
        }
      }

      // Draw Ghost Piece
      const ghost = getGhostPiece();
      if (ghost && currentPiece && !isPaused && !isGameOver) {
        ghost.matrix.forEach((row, r) => {
          row.forEach((value, c) => {
            if (value) {
              const gx = (ghost.x + c) * BLOCK_SIZE;
              const gy = (ghost.y + r) * BLOCK_SIZE;
              drawBlock(ctx, gx, gy, BLOCK_SIZE, currentPiece.color, 0.35, 3);
            }
          });
        });
      }

      // Draw Active Piece
      if (currentPiece && !isPaused && !isGameOver) {
        currentPiece.matrix.forEach((row, r) => {
          row.forEach((value, c) => {
            if (value) {
              const px = (currentPiece.x + c) * BLOCK_SIZE;
              const py = (currentPiece.y + r) * BLOCK_SIZE;
              if (py >= 0) {
                drawBlock(ctx, px, py, BLOCK_SIZE, currentPiece.color, 1, 3.5);
              }
            }
          });
        });
      }
    }

    // --- Game Loop ---
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      if (!isPaused && !isGameOver) {
        dropCounter += deltaTime;
        const currentInterval = isFastDropping ? 45 : dropInterval;
        if (dropCounter > currentInterval) {
          playerDrop();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    // --- Input Handling ---
    window.addEventListener('keydown', (e) => {
      playMusic();

      if (e.code === 'Space' || e.keyCode === 32) {
        e.preventDefault();
        togglePause();
        return;
      }

      if (isPaused || isGameOver) return;

      if (e.code === 'ArrowDown' || e.keyCode === 40) {
        e.preventDefault();
        if (!isFastDropping) {
          isFastDropping = true;
          playerDrop();
          dropCounter = 0;
        }
        return;
      }

      if (e.code === 'ArrowLeft' || e.keyCode === 37) {
        e.preventDefault();
        playerMove(-1);
      } else if (e.code === 'ArrowRight' || e.keyCode === 39) {
        e.preventDefault();
        playerMove(1);
      } else if (e.code === 'ArrowUp' || e.keyCode === 38 || e.code === 'KeyX') {
        e.preventDefault();
        playerRotate(1);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown' || e.keyCode === 40) {
        isFastDropping = false;
      }
    });

    window.addEventListener('blur', () => {
      isFastDropping = false;
    });

    // Inverted-T Keyboard Arrow Button Listeners
    btnUp.addEventListener('click', () => { playerRotate(1); });
    btnLeft.addEventListener('click', () => { playerMove(-1); });
    btnRight.addEventListener('click', () => { playerMove(1); });

    btnDown.addEventListener('mousedown', (e) => {
      e.preventDefault();
      playMusic();
      isFastDropping = true;
      playerDrop();
      dropCounter = 0;
    });
    btnDown.addEventListener('mouseup', () => { isFastDropping = false; });
    btnDown.addEventListener('mouseleave', () => { isFastDropping = false; });
    btnDown.addEventListener('touchstart', (e) => {
      e.preventDefault();
      playMusic();
      isFastDropping = true;
      playerDrop();
      dropCounter = 0;
    });
    btnDown.addEventListener('touchend', (e) => {
      e.preventDefault();
      isFastDropping = false;
    });

    pauseBtn.addEventListener('click', togglePause);
    musicBtn.addEventListener('click', toggleMusic);
    resumeBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', resetGame);

    window.addEventListener('resize', () => {
      drawNextPreview();
    });

    // Initial start
    resetGame();
    requestAnimationFrame(update);
  </script>
</body>
</html>
