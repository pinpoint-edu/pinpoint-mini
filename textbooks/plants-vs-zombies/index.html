    function getRuffle() {
      return new Promise((resolve) => {
        if (window.RufflePlayer && (window.RufflePlayer.newest || window.RufflePlayer.createPlayer)) {
          return resolve(window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.RufflePlayer);
        }
        let count = 0;
        const iv = setInterval(() => {
          count++;
          if (window.RufflePlayer && (window.RufflePlayer.newest || window.RufflePlayer.createPlayer)) {
            clearInterval(iv);
            resolve(window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.RufflePlayer);
          } else if (count > 100) {
            clearInterval(iv);
            resolve(null);
          }
        }, 100);
      });
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const ruffle = await getRuffle();
        if (!ruffle) throw new Error("Ruffle not loaded");
        const player = ruffle.createPlayer();
        const container = document.getElementById("player-container");
        container.appendChild(player);

        let buf = null;
        try {
          const res = await fetch("pvz_9_15.swf");
          if (res.ok) buf = await res.arrayBuffer();
        } catch(e) {}

        if (!buf) {
          try {
            const res = await fetch("https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@95d1d98dc38a920d02e6bbcf61620501b2bacfcb/tables/pvz_9_15.swf");
            if (res.ok) buf = await res.arrayBuffer();
          } catch(e) {}
        }

        if (buf) {
          player.load({ data: buf });
          return;
        }

        if (EMBEDDED_SWF_BASE64) {
          const binary = atob(EMBEDDED_SWF_BASE64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          player.load({ data: bytes.buffer });
          return;
        }

        player.load({ url: "pvz_9_15.swf" });
      } catch (err) {
        console.error("Error loading Plants vs Zombies:", err);
      }
    });
