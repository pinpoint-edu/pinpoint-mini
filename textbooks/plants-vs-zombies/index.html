<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Classes</title>
  <link rel="icon" type="image/png" href="../../favicons/google-classroom.png"/>
  <link rel="shortcut icon" type="image/png" href="../../favicons/google-classroom.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ruffle-player {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
  <script>
    let baseOrigin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.startsWith("blob")) ? window.location.origin : "";
    try {
      if ((!baseOrigin || baseOrigin.startsWith("blob")) && window.parent && window.parent.location && window.parent.location.origin && window.parent.location.origin !== "null" && !window.parent.location.origin.startsWith("blob")) {
        baseOrigin = window.parent.location.origin;
      }
    } catch(e) {}
    if (!baseOrigin || baseOrigin.startsWith("blob")) {
      try {
        baseOrigin = localStorage.getItem('pinpoint_entry_origin') || "";
      } catch(e) {}
    }
    if (!baseOrigin || baseOrigin.startsWith("blob")) {
      baseOrigin = window.location.protocol.startsWith("http") ? (window.location.protocol + "//" + window.location.host) : "https://notebook.broshan.com.np";
    }
    if (baseOrigin.endsWith("/")) baseOrigin = baseOrigin.slice(0, -1);

    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      contextMenu: false,
      warnOnUnsupportedContent: false,
      publicPath: baseOrigin + "/textbooks/ruffle/"
    };
  </script>
  <script src="/textbooks/ruffle/ruffle.js"></script>
  <script>
    if (!window.RufflePlayer || !window.RufflePlayer.newest) {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/@ruffle-rs/ruffle';
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="player-container">
    <ruffle-player id="player"></ruffle-player>
  </div>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const ruffle = window.RufflePlayer ? (window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.RufflePlayer) : null;
        if (!ruffle) throw new Error("Ruffle not loaded");
        const player = ruffle.createPlayer();
        const placeholder = document.getElementById("player");
        if (placeholder) {
          placeholder.replaceWith(player);
        } else {
          document.getElementById("player-container").appendChild(player);
        }

        const localUrl = "pvz_9_15.swf";
        const cdnUrl = "https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@95d1d98dc38a920d02e6bbcf61620501b2bacfcb/tables/pvz_9_15.swf";

        let buf = null;
        try {
          const res = await fetch(localUrl);
          if (res.ok) buf = await res.arrayBuffer();
        } catch(e) {}

        if (!buf) {
          try {
            const res = await fetch((baseOrigin || "") + "/textbooks/plants-vs-zombies/pvz_9_15.swf");
            if (res.ok) buf = await res.arrayBuffer();
          } catch(e) {}
        }

        if (!buf) {
          try {
            const res = await fetch(cdnUrl);
            if (res.ok) buf = await res.arrayBuffer();
          } catch(e) {}
        }

        if (buf) {
          player.load({ data: buf });
          return;
        }

        player.load({ url: localUrl });
      } catch (err) {
        console.error("Error loading Plants vs Zombies:", err);
      }
    });
  </script>
  <script src="../../tab-disguiser.js"></script>
</body>
</html>
