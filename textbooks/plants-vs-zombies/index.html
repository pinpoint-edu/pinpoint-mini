<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/textbooks/plants-vs-zombies/">
  <meta charset="utf-8">
  <title>Classes</title>
  <link rel="icon" type="image/png" href="../../favicons/google-classroom.png"/>
  <link rel="shortcut icon" type="image/png" href="../../favicons/google-classroom.png"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ruffle-player {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
  <script>
    // 1. Hardware fill-rate optimization: Cap devicePixelRatio on high-DPI / Chromebook screens
    try {
      if (window.devicePixelRatio > 1) {
        Object.defineProperty(window, 'devicePixelRatio', {
          get: function() { return 1; },
          configurable: true
        });
      }
    } catch(e) {}

    // Resolve canonical base origin
    let baseOrigin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.startsWith("blob") && !window.location.origin.startsWith("about")) ? window.location.origin : "";
    try {
      if ((!baseOrigin || baseOrigin.startsWith("blob") || baseOrigin.startsWith("about")) && window.parent && window.parent.location && window.parent.location.origin && window.parent.location.origin !== "null" && !window.parent.location.origin.startsWith("blob") && !window.parent.location.origin.startsWith("about")) {
        baseOrigin = window.parent.location.origin;
      }
    } catch(e) {}
    if (!baseOrigin || baseOrigin.startsWith("blob") || baseOrigin.startsWith("about")) {
      try {
        baseOrigin = localStorage.getItem('pinpoint_entry_origin') || "";
      } catch(e) {}
    }
    if (!baseOrigin || baseOrigin.startsWith("blob") || baseOrigin.startsWith("about")) {
      baseOrigin = window.location.protocol.startsWith("http") ? (window.location.protocol + "//" + window.location.host) : "https://notebook.broshan.com.np";
    }
    if (baseOrigin.endsWith("/")) baseOrigin = baseOrigin.slice(0, -1);

    const PVZ_BASE = baseOrigin + "/textbooks/plants-vs-zombies/";
    const RUFFLE_BASE = baseOrigin + "/textbooks/ruffle/";

    // 2. High-performance offline asset interceptor:
    // Intercepts all remote CDN and ActionScript requests and routes them directly
    // to canonical absolute URLs under /textbooks/plants-vs-zombies/, with instant memory caching.
    const localMusicFiles = [
      'cerebrawl', 'chooseyourseeds', 'conveyor', 'crazydave',
      'grasswalk', 'loonboon', 'losemusic', 'moongrains',
      'winmusic', 'zengarden'
    ];

    function mapPvzAssetUrl(url) {
      if (!url || typeof url !== 'string') return null;
      if (url.includes('resources.swf')) return PVZ_BASE + 'resources.swf';
      if (url.includes('data.xml')) return PVZ_BASE + 'data.xml';
      if (url.includes('externalStrings.txt')) return PVZ_BASE + 'properties/externalStrings.txt';
      for (const m of localMusicFiles) {
        if (url.includes(m + '.mp3')) return PVZ_BASE + 'music/' + m + '.mp3';
      }
      return null;
    }

    const preloadedBuffers = {};
    const origFetch = window.fetch;
    window.fetch = function(input, init) {
      let url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
      const localTarget = mapPvzAssetUrl(url);
      if (localTarget) {
        if (preloadedBuffers[localTarget]) {
          const mime = localTarget.endsWith('.xml') ? 'application/xml' :
                       localTarget.endsWith('.swf') ? 'application/x-shockwave-flash' :
                       localTarget.endsWith('.mp3') ? 'audio/mpeg' : 'text/plain';
          return Promise.resolve(new Response(preloadedBuffers[localTarget].slice(0), {
            status: 200,
            headers: { 'Content-Type': mime }
          }));
        }
        const fetchTarget = (input instanceof Request) ? new Request(localTarget, input) : localTarget;
        return origFetch(fetchTarget, init).then(res => {
          if (res.ok) {
            res.clone().arrayBuffer().then(buf => {
              preloadedBuffers[localTarget] = buf;
            }).catch(() => {});
          }
          return res;
        });
      }
      return origFetch.apply(this, arguments);
    };

    const origXhrOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, async, user, password) {
      const urlStr = (url && typeof url === 'object' && url.href) ? url.href : String(url || '');
      const localTarget = mapPvzAssetUrl(urlStr);
      if (localTarget) {
        url = localTarget;
      }
      return origXhrOpen.call(this, method, url, async, user, password);
    };

    // Preload key SWF data & resources in parallel immediately
    (async function preloadPvzAssets() {
      const files = [
        { key: PVZ_BASE + 'resources.swf', path: PVZ_BASE + 'resources.swf' },
        { key: PVZ_BASE + 'data.xml', path: PVZ_BASE + 'data.xml' },
        { key: PVZ_BASE + 'properties/externalStrings.txt', path: PVZ_BASE + 'properties/externalStrings.txt' }
      ];
      await Promise.all(files.map(async (item) => {
        try {
          const res = await origFetch(item.path);
          if (res.ok) {
            preloadedBuffers[item.key] = await res.arrayBuffer();
          }
        } catch(e) {}
      }));
    })();

    // 3. Ruffle configuration for smooth performance
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      contextMenu: "off",
      warnOnUnsupportedContent: false,
      quality: "low",
      powerPreference: "high-performance",
      wmode: "opaque",
      base: PVZ_BASE,
      publicPath: RUFFLE_BASE
    };
  </script>
  <script src="/textbooks/ruffle/ruffle.js"></script>
  <script>
    if (!window.RufflePlayer || (!window.RufflePlayer.newest && !window.RufflePlayer.createPlayer)) {
      document.write('<script src="' + RUFFLE_BASE + 'ruffle.js"><\/script>');
    }
  </script>
  <script>
    if (!window.RufflePlayer || (!window.RufflePlayer.newest && !window.RufflePlayer.createPlayer)) {
      document.write('<script src="https://unpkg.com/@ruffle-rs/ruffle"><\/script>');
    }
  </script>
</head>
<body>
  <div id="player-container"></div>
  <script>
    function getRuffle() {
      return new Promise((resolve) => {
        if (window.RufflePlayer && (window.RufflePlayer.newest || window.RufflePlayer.createPlayer)) {
          return resolve(window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.RufflePlayer);
        }
        let count = 0;
        const iv = setInterval(() => {
          count++;
          if (window.RufflePlayer && (window.RufflePlayer.newest || window.RufflePlayer.createPlayer)) {
            clearInterval(iv);
            resolve(window.RufflePlayer.newest ? window.RufflePlayer.newest() : window.RufflePlayer);
          } else if (count > 100) {
            clearInterval(iv);
            resolve(null);
          }
        }, 100);
      });
    }

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const ruffle = await getRuffle();
        if (!ruffle) throw new Error("Ruffle not loaded");
        const player = ruffle.createPlayer();
        const container = document.getElementById("player-container");
        container.appendChild(player);

        const localUrl = PVZ_BASE + "pvz_9_15.swf";
        const cdnUrl = "https://cdn.jsdelivr.net/gh/sasa24s/Sphere-compile@95d1d98dc38a920d02e6bbcf61620501b2bacfcb/tables/pvz_9_15.swf";

        let buf = null;
        try {
          const res = await origFetch(localUrl);
          if (res.ok) buf = await res.arrayBuffer();
        } catch(e) {}

        if (!buf && typeof caches !== 'undefined') {
          try {
            const cacheRes = (await caches.match("/textbooks/plants-vs-zombies/pvz_9_15.swf")) || (await caches.match(localUrl));
            if (cacheRes && cacheRes.ok) buf = await cacheRes.arrayBuffer();
          } catch(e) {}
        }

        if (!buf) {
          try {
            const res = await origFetch(cdnUrl);
            if (res.ok) buf = await res.arrayBuffer();
          } catch(e) {}
        }

        if (buf) {
          player.load({ data: buf });
          return;
        }

        player.load({ url: localUrl });
      } catch (err) {
        console.error("Error loading Plants vs Zombies:", err);
      }
    });
  </script>
  <script src="../../tab-disguiser.js"></script>
</body>
</html>
