<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Superhot</title>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matheveryday25/math@main/swat/style.css">
  <style>
    html, body, #unity-container, #loading-cover {
      background-color: #111111 !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body class="dark" style="background-color: #111111 !important; overflow: hidden !important; margin: 0 !important;">
  <div id="unity-container" class="unity-desktop" style="background-color: #111111 !important; overflow: hidden !important;">
    <canvas id="unity-canvas" style="background: #111111 url('https://cdn.jsdelivr.net/gh/matheveryday25/math@main/swat/ts3.png') center center / cover; cursor: default;" width="2004" height="1744"></canvas>
  </div>
  <div id="loading-cover" style="display: none; background-color: #111111 !important; overflow: hidden !important;">
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty" style="">
        <div id="unity-progress-bar-full" style="width: 100%;"></div>
      </div>
      <div class="spinner" style="display: none;"></div>
    </div>
  </div>
  <div id="unity-fullscreen-button" style="display: none;"></div>
  <script src="https://cdn.jsdelivr.net/gh/matheveryday25/math@main/swat/ts3.loader.js"></script>
  <script>
    const hideFullScreenButton = "1";
    const buildUrl = "https://cdn.jsdelivr.net/gh/matheveryday25/math@main/swat";
    const loaderUrl = buildUrl + "/ts3.loader.js";
    const config = {
      dataUrl: buildUrl + "/ts3.data",
      frameworkUrl: buildUrl + "/ts3.framework.js",
      codeUrl: buildUrl + "/ts3.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "GoGoMan",
      productName: "Time Shooter SWAT",
      productVersion: "0.03",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");
    const spinner = document.querySelector('.spinner');

    const canFullscreen = (function() {
      for (const key of [
          'exitFullscreen',
          'webkitExitFullscreen',
          'webkitCancelFullScreen',
          'mozCancelFullScreen',
          'msExitFullscreen',
        ]) {
        if (key in document) {
          return true;
        }
      }
      return false;
    }());

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }
    canvas.style.background = "#111111 url('" + buildUrl + "/ts3.png') center / cover";
    loadingCover.style.display = "";

    function startGame() {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        loadingCover.style.display = "none";
        if (canFullscreen) {
          if (!hideFullScreenButton) {
            fullscreenButton.style.display = "";
          }
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }
      }).catch((message) => {
        alert(message);
      });
    }

    if (typeof createUnityInstance === "function") {
      startGame();
    } else {
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = startGame;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
