<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <title>Basket Random Online</title>
  <script src="../lib/Photon-Javascript_SDK.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #game-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ─── ONLINE BUTTON OVERLAY ─── */
    #online-btn-overlay {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 9000;
    }

    #btn-online-placeholder {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 22px;
      background: #1a1a2e;
      border: 2px solid #38bdf8;
      border-radius: 6px;
      color: #38bdf8;
      font-family: 'Courier New', monospace;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
      transition: background 0.15s, box-shadow 0.15s;
      image-rendering: pixelated;
    }
    #btn-online-placeholder:hover {
      background: rgba(56, 189, 248, 0.12);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.7);
    }

    /* ─── MODAL BASE ─── */
    .bro-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 99000;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .bro-modal {
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 14px;
      width: min(540px, 96vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 28px 24px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      color: #f1f5f9;
    }
    .bro-modal-close {
      position: absolute;
      top: 14px; right: 18px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }
    .bro-modal-close:hover { color: #f1f5f9; }

    .bro-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .bro-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 18px;
    }

    /* Status */
    #bro-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    #bro-status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
    }

    /* Tabs */
    .bro-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .bro-tab {
      flex: 1;
      padding: 9px 12px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .bro-tab.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #fff;
    }

    /* Input / Select shared */
    .bro-input {
      width: 100%;
      padding: 9px 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 15px;
      outline: none;
      margin-bottom: 10px;
    }
    .bro-input:focus { border-color: #38bdf8; }

    /* Buttons */
    .bro-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .bro-btn:hover { opacity: 0.88; }
    .bro-btn-blue  { background: #0284c7; color: #fff; }
    .bro-btn-gray  { background: rgba(255,255,255,0.08); color: #94a3b8; border: 1px solid rgba(255,255,255,0.12); }
    .bro-btn-green { background: #15803d; color: #fff; }
    .bro-btn-red   { background: #991b1b; color: #fff; }

    /* Label */
    .bro-label {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .bro-field { margin-bottom: 12px; }

    /* Room list */
    #bro-room-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .bro-room-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.06);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .bro-empty-msg { color: #64748b; text-align: center; padding: 28px 0; font-size: 15px; }

    /* Lobby slots */
    #bro-lobby-slots { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .bro-slot {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.06); padding: 9px 14px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .bro-slot.open { background: rgba(255,255,255,0.02); border-style: dashed; }
    .bro-slot-name { font-size: 16px; font-weight: 700; color: #fff; }
    .bro-slot-you  { font-size: 12px; color: #38bdf8; margin-left: 5px; }
    .bro-slot-ready { font-size: 13px; color: #86efac; font-weight: 700; }
    .bro-slot-open  { font-size: 14px; color: #64748b; font-style: italic; }

    /* Toast */
    #bro-toast {
      display: none;
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: #fca5a5;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 6px;
      white-space: nowrap;
      z-index: 10;
    }

    /* In-game HUD panel */
    #bro-hud {
      display: none;
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8500;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 10px;
      padding: 8px 20px;
      color: #f1f5f9;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      pointer-events: none;
    }
    #bro-hud-scores { font-size: 18px; color: #38bdf8; letter-spacing: 2px; }
    #bro-hud-rule   { font-size: 11px; color: #64748b; margin-top: 2px; }

    /* Leave btn during match */
    #bro-leave-btn {
      display: none;
      position: fixed;
      top: 10px; right: 14px;
      z-index: 8500;
      padding: 6px 14px;
      background: rgba(153, 27, 27, 0.85);
      border: 1.5px solid #ef4444;
      border-radius: 6px;
      color: #fca5a5;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    #bro-leave-btn:hover { background: rgba(239,68,68,0.25); }

    /* Divider */
    .bro-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 14px 0; }

    /* Score limit badge */
    #bro-score-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      background: rgba(56,189,248,0.12);
      color: #38bdf8;
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 4px;
      padding: 2px 8px;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* Views */
    #view-matchmaking { display: flex; flex-direction: column; }
    #view-lobby       { display: none; flex-direction: column; }
  </style>
</head>
<body>

<!-- The original Basket Random game in an iframe -->
<iframe id="game-frame" src="/textbooks/basket-random/index.html" allowfullscreen></iframe>

<!-- Floating ONLINE button (placeholder - replace with pixelated globe design) -->
<div id="online-btn-overlay">
  <button id="btn-online-placeholder" onclick="openBROModal()">
    <!-- Globe placeholder (user will swap this for custom pixelated image) -->
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"
         style="image-rendering:pixelated; flex-shrink:0;">
      <rect x="0" y="0" width="18" height="18" fill="none"/>
      <!-- pixelated globe placeholder -->
      <rect x="3" y="1" width="12" height="2" fill="#38bdf8"/>
      <rect x="1" y="3" width="16" height="2" fill="#38bdf8"/>
      <rect x="0" y="5" width="18" height="8" fill="#38bdf8"/>
      <rect x="1" y="13" width="16" height="2" fill="#38bdf8"/>
      <rect x="3" y="15" width="12" height="2" fill="#38bdf8"/>
      <!-- longitude lines -->
      <rect x="7" y="1" width="2" height="16" fill="#0d1117"/>
      <rect x="3" y="5" width="2" height="8" fill="#0d1117"/>
      <rect x="13" y="5" width="2" height="8" fill="#0d1117"/>
      <!-- equator -->
      <rect x="0" y="8" width="18" height="2" fill="#0d1117"/>
    </svg>
    ONLINE
  </button>
</div>

<!-- In-game HUD (shows during a match) -->
<div id="bro-hud">
  <div id="bro-hud-scores">P1: 0 — P2: 0</div>
  <div id="bro-hud-rule">First to 5 goals</div>
</div>
<button id="bro-leave-btn" onclick="broLeaveMatch()">⛔ Leave Match</button>

<!-- ═══════════════════════════════════════════ -->
<!--         ONLINE MODAL                        -->
<!-- ═══════════════════════════════════════════ -->
<div class="bro-modal-overlay" id="bro-modal">
  <div class="bro-modal">
    <button class="bro-modal-close" onclick="closeBROModal()">✕</button>
    <div id="bro-toast"></div>

    <!-- ── Header ── -->
    <div class="bro-title">🏀 Basket Random Online <span style="font-size:12px;color:#ef4444;font-weight:700;">BETA</span></div>
    <div class="bro-sub">Real-time 1v1 online — powered by Photon</div>

    <!-- ── Connection status ── -->
    <div id="bro-status-row">
      <span id="bro-status-dot"></span>
      <span id="bro-status-text" style="color:#94a3b8;">Connecting...</span>
    </div>

    <!-- ── Score limit selector ── -->
    <div class="bro-field">
      <div class="bro-label">Play Limit <span id="bro-score-badge">First to 5</span></div>
      <select class="bro-input" id="bro-score-select" onchange="broParseRule(this.value)" style="margin-bottom:0;">
        <option value="score-3">First to 3 Goals</option>
        <option value="score-5" selected>First to 5 Goals</option>
        <option value="score-7">First to 7 Goals</option>
        <option value="score-10">First to 10 Goals</option>
        <option value="score-15">First to 15 Goals</option>
        <option value="infinite">Infinite (No Limit)</option>
      </select>
    </div>

    <hr class="bro-divider">

    <!-- ── MATCHMAKING VIEW ── -->
    <div id="view-matchmaking">

      <div class="bro-field">
        <div class="bro-label">Your Name</div>
        <input class="bro-input" id="bro-callsign" type="text" maxlength="14"
               placeholder="Enter your name..." style="margin-bottom:0;"
               oninput="broSaveCallsign(this.value)">
      </div>

      <hr class="bro-divider" style="margin: 10px 0 14px;">

      <!-- Tabs -->
      <div class="bro-tabs">
        <div class="bro-tab active" id="tab-public" onclick="broSwitchTab('public')">Public Games</div>
        <div class="bro-tab" id="tab-private" onclick="broSwitchTab('private')">Private Room</div>
      </div>

      <!-- Public tab content -->
      <div id="tab-content-public">
        <div id="bro-room-list">
          <div class="bro-empty-msg">Connecting to servers...</div>
        </div>
        <div style="display:flex; gap:8px; margin-top:14px;">
          <button class="bro-btn bro-btn-blue" style="flex:1;" id="btn-create-public" onclick="broCreateRoom(false)">+ Create Public Game</button>
        </div>
      </div>

      <!-- Private tab content -->
      <div id="tab-content-private" style="display:none;">
        <div class="bro-field">
          <div class="bro-label">Room Code (4–8 letters/numbers)</div>
          <input class="bro-input" id="bro-private-code" type="text" maxlength="8"
                 placeholder="e.g. ABCD1234" style="text-transform:uppercase; margin-bottom:0;"
                 oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
        </div>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <button class="bro-btn bro-btn-blue" style="flex:1;" id="btn-create-private" onclick="broCreateRoom(true)">Create Private</button>
          <button class="bro-btn bro-btn-gray" style="flex:1;" id="btn-join-private" onclick="broJoinPrivate()">Join by Code</button>
        </div>
      </div>
    </div>

    <!-- ── LOBBY VIEW ── -->
    <div id="view-lobby">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div>
          <div style="font-size:18px; font-weight:800; color:#fff;" id="bro-lobby-title">Your Match</div>
          <div style="font-size:12px; color:#64748b; margin-top:2px;" id="bro-lobby-code-row"></div>
        </div>
        <button class="bro-btn bro-btn-gray" style="padding:6px 14px; font-size:13px;" onclick="broExitRoom()">← Back</button>
      </div>

      <div id="bro-lobby-slots"></div>

      <!-- Lobby score limit selector (host only) -->
      <div class="bro-field" id="bro-lobby-rule-row">
        <div class="bro-label">Match Rule</div>
        <select class="bro-input" id="bro-lobby-score-select" onchange="broLobbyRuleChange(this.value)" style="margin-bottom:0;">
          <option value="score-3">First to 3 Goals</option>
          <option value="score-5" selected>First to 5 Goals</option>
          <option value="score-7">First to 7 Goals</option>
          <option value="score-10">First to 10 Goals</option>
          <option value="score-15">First to 15 Goals</option>
          <option value="infinite">Infinite (No Limit)</option>
        </select>
        <div id="bro-lobby-rule-badge" style="display:none; margin-top:6px; font-size:13px; color:#38bdf8; font-weight:700;"></div>
      </div>

      <div style="display:flex; gap:8px; margin-top:6px;">
        <button class="bro-btn bro-btn-green" style="flex:1; font-size:16px;" id="btn-start-match"
                onclick="broHostStart()">🏀 Start Match</button>
      </div>
      <div style="font-size:12px; color:#64748b; text-align:center; margin-top:8px;" id="bro-wait-msg"></div>
    </div>

  </div>
</div>


<!-- ═══════════════════════════════════════════════ -->
<!--   BASKET RANDOM ONLINE ENGINE (PHOTON)          -->
<!-- ═══════════════════════════════════════════════ -->
<script>
(function () {
  'use strict';

  // ── Photon config (same app id as Bit Planes – both are your app) ──
  const PHOTON_APP_ID      = '94a23c0c-428f-429e-9745-be9d2e68b244';
  const PHOTON_APP_VERSION = 'bro-1.0';   // separate version → own room namespace

  // ── Event codes ──
  const EV_START_GAME    = 1;
  const EV_SCORE_UPDATE  = 2;
  const EV_MATCH_RULE    = 3;
  const EV_GAME_OVER     = 4;

  // ── Match state ──
  let photonClient     = null;
  let localSlot        = 1;    // 1 = host (P1), 2 = guest (P2)
  let matchActive      = false;
  let isBusy           = false;
  let isLeavingRoom    = false;
  let currentRoomCode  = '';
  let isPrivateRoom    = false;
  let reconAttempts    = 0;
  let reconTimer       = null;
  let autoRefreshTimer = null;
  let myName           = '';

  // Score / rule state (synced by host)
  window.__broMatchRule   = 'score';
  window.__broTargetGoals = 5;
  window.__broScores      = { 1: 0, 2: 0 };

  // ── Helpers ──
  function getCallsign() {
    const inp = document.getElementById('bro-callsign');
    let n = inp ? inp.value.trim() : '';
    if (!n) {
      try { n = localStorage.getItem('bro_name') || ''; } catch(e) {}
    }
    if (!n) n = 'Player';
    return n.substring(0, 14);
  }

  function broSaveCallsign(v) {
    try { localStorage.setItem('bro_name', v.trim()); } catch(e) {}
  }
  window.broSaveCallsign = broSaveCallsign;

  function generateCode() {
    const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let r = '';
    for (let i = 0; i < 4; i++) r += c[Math.floor(Math.random() * c.length)];
    return r;
  }

  function sanitizeCode(s) {
    return (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 8);
  }

  // ── Rule parsing ──
  function broParseRule(val) {
    if (!val || val === 'infinite') {
      window.__broMatchRule   = 'infinite';
      window.__broTargetGoals = null;
    } else {
      window.__broMatchRule   = 'score';
      window.__broTargetGoals = parseInt(val.replace('score-', ''), 10) || 5;
    }
    updateScoreBadge();
  }
  window.broParseRule = broParseRule;

  function updateScoreBadge() {
    const badge = document.getElementById('bro-score-badge');
    if (!badge) return;
    badge.textContent = window.__broMatchRule === 'score'
      ? ('First to ' + window.__broTargetGoals)
      : 'No Limit';
  }

  // ── UI tab switch ──
  function broSwitchTab(tab) {
    ['public','private'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      document.getElementById('tab-content-' + t).style.display = (t === tab) ? 'block' : 'none';
    });
  }
  window.broSwitchTab = broSwitchTab;

  // ── Modal open / close ──
  window.openBROModal = function() {
    const modal = document.getElementById('bro-modal');
    modal.style.display = 'flex';
    // Pre-fill callsign
    try {
      const saved = localStorage.getItem('bro_name') || '';
      const inp = document.getElementById('bro-callsign');
      if (inp && saved) inp.value = saved;
    } catch(e) {}
    updateScoreBadge();
    broEnsureConnected();
    broRenderRooms();
    broStartAutoRefresh();
  };

  window.closeBROModal = function() {
    const modal = document.getElementById('bro-modal');
    if (modal) modal.style.display = 'none';
    clearTimeout(reconTimer);
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
    reconTimer = null;
    reconAttempts = 0;
    broCleanupPhoton();
  };

  // ── Status display ──
  function setStatus(type, text) {
    const dot  = document.getElementById('bro-status-dot');
    const txt  = document.getElementById('bro-status-text');
    if (!dot || !txt) return;
    txt.textContent = text;
    const colors = { connected: '#22c55e', connecting: '#f59e0b', error: '#ef4444' };
    dot.style.background = colors[type] || '#f59e0b';
    txt.style.color = type === 'connected' ? '#4ade80' : type === 'error' ? '#f87171' : '#fbbf24';
  }

  // ── Toast ──
  function showToast(msg) {
    const el = document.getElementById('bro-toast');
    if (!el) return;
    el.textContent = msg;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 5000);
  }

  // ── Photon init ──
  function broCleanupPhoton() {
    if (!photonClient) return;
    try {
      photonClient.onStateChange = () => {};
      photonClient.onError = () => {};
      photonClient.onEvent = () => {};
      photonClient.onRoomList = () => {};
      photonClient.onRoomListUpdate = () => {};
      photonClient.onJoinRoom = () => {};
      photonClient.onActorJoin = () => {};
      photonClient.onActorLeave = () => {};
      ['nameServerPeer','masterPeer','gamePeer'].forEach(pName => {
        const p = photonClient[pName];
        if (p && p._socket) {
          p._socket.onopen = p._socket.onmessage = p._socket.onerror = p._socket.onclose = null;
        }
      });
      photonClient.disconnect();
    } catch(e) {}
    photonClient = null;
  }

  function isModalOpen() {
    const m = document.getElementById('bro-modal');
    return !!(m && (m.style.display === 'flex' || m.style.display === 'block'));
  }

  function isConnectedToMaster() {
    if (!photonClient) return false;
    const S = Photon.LoadBalancing.LoadBalancingClient.State;
    const s = photonClient.state;
    return s === S.ConnectedToMaster || s === S.JoinedLobby;
  }

  function isConnectingOrConnected() {
    if (!photonClient) return false;
    const S = Photon.LoadBalancing.LoadBalancingClient.State;
    const s = photonClient.state;
    return [S.ConnectingToNameServer, S.ConnectedToNameServer,
            S.ConnectingToMasterserver, S.ConnectedToMaster, S.JoinedLobby,
            S.ConnectingToGameserver, S.ConnectedToGameserver, S.Joined].includes(s);
  }

  function broInitPhoton() {
    if (typeof Photon === 'undefined' || !Photon.LoadBalancing) {
      setTimeout(broInitPhoton, 300);
      return;
    }
    try {
      // Apply keep-alive patch
      if (!Photon.LoadBalancing._broPatchApplied) {
        Photon.LoadBalancing._broPatchApplied = true;
        const origMaster = Photon.LoadBalancing.LoadBalancingClient.prototype.initMasterPeer;
        Photon.LoadBalancing.LoadBalancingClient.prototype.initMasterPeer = function(p) {
          origMaster.call(this, p);
          if (p) p.keepAliveTimeoutMs = 8000;
        };
        const origGame = Photon.LoadBalancing.LoadBalancingClient.prototype.initGamePeer;
        Photon.LoadBalancing.LoadBalancingClient.prototype.initGamePeer = function(p, op) {
          origGame.call(this, p, op);
          if (p) p.keepAliveTimeoutMs = 8000;
        };
      }

      photonClient = new Photon.LoadBalancing.LoadBalancingClient(
        Photon.ConnectionProtocol.Wss, PHOTON_APP_ID, PHOTON_APP_VERSION
      );
      photonClient.autoJoinLobby = true;
      photonClient.keepAliveTimeoutMs = 8000;
      photonClient.onStateChange = onStateChange;
      photonClient.onError = onError;
      photonClient.onOperationResponse = onOpResponse;
      photonClient.onJoinRoom = onJoinRoom;
      photonClient.onActorJoin = () => { broRenderLobbySlots(); };
      photonClient.onActorLeave = onActorLeave;
      photonClient.onActorSuspend = onActorLeave;
      photonClient.onEvent = onEvent;
      photonClient.onRoomList = broRenderRooms;
      photonClient.onRoomListUpdate = broRenderRooms;

      setStatus('connecting', 'Connecting to cloud...');
      photonClient.connectToRegionMaster('us');
    } catch(e) {
      setStatus('error', 'Init error: ' + e.message);
    }
  }

  function broEnsureConnected() {
    if (!photonClient) { broInitPhoton(); return; }
    if (!isConnectingOrConnected()) {
      broCleanupPhoton();
      setTimeout(broInitPhoton, 100);
    }
  }

  function broScheduleRecon() {
    if (!isModalOpen()) return;
    if (reconTimer) clearTimeout(reconTimer);
    reconAttempts++;
    if (reconAttempts > 4) { setStatus('error', 'Server unreachable. Reopen to retry.'); return; }
    const delay = Math.min(1000 + reconAttempts * 1200, 7000);
    reconTimer = setTimeout(() => {
      reconTimer = null;
      if (isModalOpen()) broEnsureConnected();
    }, delay);
  }

  function broStartAutoRefresh() {
    if (autoRefreshTimer) return;
    autoRefreshTimer = setInterval(() => {
      const view = document.getElementById('view-matchmaking');
      if (isModalOpen() && view && view.style.display !== 'none') {
        broRenderRooms();
      }
    }, 2500);
  }

  // ── Photon callbacks ──
  function onStateChange(state) {
    const S = Photon.LoadBalancing.LoadBalancingClient.State;
    if (state === S.ConnectedToMaster || state === S.JoinedLobby) {
      reconAttempts = 0; isBusy = false;
      setStatus('connected', 'Connected (US)');
      broRenderRooms();
    } else if (state === S.ConnectedToGameserver || state === S.Joined) {
      reconAttempts = 0; isBusy = false;
      setStatus('connected', 'In Room');
    } else if ([S.ConnectingToNameServer, S.ConnectingToMasterserver, S.ConnectingToGameserver].includes(state)) {
      setStatus('connecting', 'Connecting...');
    } else if (state === S.Disconnected || state === S.Error) {
      isBusy = false;
      setStatus('error', 'Disconnected.');
      if (isModalOpen()) broScheduleRecon();
    }
  }

  function onError(code, msg) {
    if ([1004, 1003, 2004, 2003].includes(code)) return;
    isBusy = false;
    resetActionBtns();
    if ([1101, 2101].includes(code)) showToast('Authentication error. Reconnecting...');
    else if ([3001, 1002, 2002].includes(code)) showToast('Server unreachable. Reconnecting...');
  }

  function onOpResponse(code, msg, opCode) {
    if (code !== 0) {
      isBusy = false;
      resetActionBtns();
      if (code === 32737 || code === 32758) showToast('Room closed or unavailable.');
      else if (code === 32765) showToast('Room is full (max 2 players).');
      else if (code === 32766) showToast('A room with that code already exists.');
    }
  }

  function resetActionBtns() {
    ['btn-create-public','btn-create-private','btn-join-private'].forEach(id => {
      const b = document.getElementById(id);
      if (b) { b.style.pointerEvents = 'auto'; b.style.opacity = '1'; }
    });
  }

  // ── Public room list ──
  function broRenderRooms() {
    const container = document.getElementById('bro-room-list');
    if (!container) return;

    if (!photonClient || !isConnectedToMaster()) {
      container.innerHTML = '<div class="bro-empty-msg">Connecting to servers...</div>';
      return;
    }

    const rooms = (photonClient.availableRooms() || []).filter(r => {
      const props = getProps(r);
      return r.isOpen && !props.isPriv && r.playerCount < r.maxPlayers;
    });

    if (rooms.length === 0) {
      container.innerHTML = '<div class="bro-empty-msg">No open games. Create one!</div>';
      return;
    }

    container.innerHTML = rooms.map(room => {
      const props = getProps(room);
      const host = props.host || 'Player';
      return `
        <div class="bro-room-row">
          <div>
            <div style="font-size:16px;font-weight:700;color:#fff;">${host}'s Game</div>
            <div style="font-size:12px;color:#94a3b8;margin-top:2px;">
              Host: <strong style="color:#38bdf8;">${host}</strong>
              <span style="margin-left:8px;background:rgba(74,222,128,0.15);color:#86efac;border:1px solid rgba(74,222,128,0.3);font-weight:700;padding:1px 7px;border-radius:4px;font-size:11px;">${room.playerCount}/2</span>
            </div>
          </div>
          <button class="bro-btn bro-btn-blue btn-join-room" data-room="${room.name}" style="padding:7px 16px;font-size:14px;">Join</button>
        </div>`;
    }).join('');

    container.querySelectorAll('.btn-join-room').forEach(btn => {
      btn.onclick = () => broJoinRoom(btn.getAttribute('data-room'), false);
    });
  }

  // ── Create / Join ──
  function broCreateRoom(isPrivate) {
    if (isBusy) return;
    if (!isConnectedToMaster()) { showToast('Connecting... try again in a moment.'); return; }

    myName = getCallsign();
    try { photonClient.myActor().setName(myName); } catch(e) {}
    try { localStorage.setItem('bro_name', myName); } catch(e) {}

    const code = isPrivate
      ? sanitizeCode(document.getElementById('bro-private-code').value || generateCode())
      : ('BRO' + Date.now().toString(36).toUpperCase() + generateCode());

    if (!code) { showToast('Enter a valid room code.'); return; }

    isBusy = true;
    isPrivateRoom = isPrivate;
    currentRoomCode = code;

    photonClient.createRoom(code, {
      maxPlayers: 2,
      isVisible: !isPrivate,
      isOpen: true,
      emptyRoomLiveTime: 0,
      suspendedPlayerLiveTime: 0,
      customGameProperties: {
        host: myName,
        isPriv: isPrivate,
        rule: window.__broMatchRule,
        targetGoals: window.__broTargetGoals
      },
      propsListedInLobby: ['host', 'isPriv']
    });
  }
  window.broCreateRoom = broCreateRoom;

  function broJoinPrivate() {
    const code = sanitizeCode(document.getElementById('bro-private-code').value);
    if (!code) { showToast('Enter a room code first.'); return; }
    broJoinRoom(code, true);
  }
  window.broJoinPrivate = broJoinPrivate;

  function broJoinRoom(code, isPrivate) {
    if (isBusy) return;
    if (!isConnectedToMaster()) { showToast('Connecting... try again in a moment.'); return; }

    myName = getCallsign();
    try { photonClient.myActor().setName(myName); } catch(e) {}
    try { localStorage.setItem('bro_name', myName); } catch(e) {}

    isBusy = true;
    isPrivateRoom = !!isPrivate;
    currentRoomCode = code;
    photonClient.joinRoom(code);
  }

  // ── Room joined ──
  function onJoinRoom(createdByMe) {
    isBusy = false;
    resetActionBtns();

    currentRoomCode = photonClient.myRoom().name;
    const props = getProps(photonClient.myRoom());
    isPrivateRoom = !!props.isPriv;

    // Sync rule from room props if we're the guest
    if (!createdByMe && props.rule) {
      window.__broMatchRule   = props.rule;
      window.__broTargetGoals = props.targetGoals || 5;
      updateScoreBadge();
    }

    // Assign slot
    const actors = photonClient.myRoomActorsArray();
    actors.sort((a, b) => a.actorNr - b.actorNr);
    const myNr  = photonClient.myActor().actorNr;
    const idx   = actors.findIndex(a => a.actorNr === myNr);
    localSlot   = idx >= 0 ? idx + 1 : 1;
    const isHost = (localSlot === 1);

    // Switch to lobby view
    document.getElementById('view-matchmaking').style.display = 'none';
    document.getElementById('view-lobby').style.display = 'flex';

    // Lobby title / code
    const title = document.getElementById('bro-lobby-title');
    if (title) title.textContent = isHost ? myName + "'s Game" : getProps(photonClient.myRoom()).host + "'s Game";

    const codeRow = document.getElementById('bro-lobby-code-row');
    if (codeRow) {
      codeRow.textContent = isPrivateRoom
        ? 'Private • Code: ' + currentRoomCode
        : 'Public Match';
    }

    // Show lobby rule selector for host, badge for guest
    const ruleSel = document.getElementById('bro-lobby-rule-row');
    const ruleBadge = document.getElementById('bro-lobby-rule-badge');
    const sel = document.getElementById('bro-lobby-score-select');
    if (isHost) {
      if (ruleSel) ruleSel.style.display = 'block';
      if (ruleBadge) ruleBadge.style.display = 'none';
      if (sel) {
        sel.value = window.__broMatchRule === 'score'
          ? ('score-' + window.__broTargetGoals)
          : 'infinite';
      }
    } else {
      if (ruleSel) ruleSel.style.display = 'none';
      if (ruleBadge) {
        ruleBadge.textContent = window.__broMatchRule === 'score'
          ? ('First to ' + window.__broTargetGoals + ' Goals')
          : 'Infinite Play';
        ruleBadge.style.display = 'block';
      }
    }

    // Host/guest start button visibility
    const startBtn = document.getElementById('btn-start-match');
    const waitMsg  = document.getElementById('bro-wait-msg');
    if (startBtn) startBtn.style.display = isHost ? 'inline-flex' : 'none';
    if (waitMsg) waitMsg.textContent = isHost ? 'Waiting for an opponent...' : 'Waiting for host to start...';

    broRenderLobbySlots();
  }

  // ── Actor leave ──
  function onActorLeave(actor, isCleanup) {
    if (isCleanup || isLeavingRoom) return;
    if (!photonClient || !photonClient.isJoinedToRoom()) return;
    if (matchActive) {
      broEndMatchDueToLeave();
    } else {
      broRenderLobbySlots();
    }
  }

  // ── Lobby slots render ──
  function broRenderLobbySlots() {
    if (!photonClient || !photonClient.isJoinedToRoom()) return;
    const actors = photonClient.myRoomActorsArray();
    actors.sort((a, b) => a.actorNr - b.actorNr);
    const myNr = photonClient.myActor().actorNr;
    const isHost = actors.length > 0 && actors[0].actorNr === myNr;

    // Update start button + wait msg
    const startBtn = document.getElementById('btn-start-match');
    const waitMsg  = document.getElementById('bro-wait-msg');
    if (startBtn) startBtn.style.display = isHost ? 'inline-flex' : 'none';
    if (waitMsg) {
      if (isHost) {
        waitMsg.textContent = actors.length < 2
          ? 'Waiting for an opponent to join...'
          : 'Opponent connected! Press Start when ready.';
      } else {
        waitMsg.textContent = 'Waiting for host to start...';
      }
    }

    let html = '';
    for (let s = 1; s <= 2; s++) {
      const actor = actors[s - 1];
      if (actor) {
        const isMe = (actor.actorNr === myNr);
        const name = isMe ? myName : (actor.name || ('Player ' + s));
        html += `
          <div class="bro-slot">
            <div><span class="bro-slot-name">${name}</span>${isMe ? '<span class="bro-slot-you">(YOU)</span>' : ''}</div>
            <span class="bro-slot-ready">● Ready</span>
          </div>`;
      } else {
        html += `
          <div class="bro-slot open">
            <span style="color:#64748b;font-weight:700;">SLOT ${s}</span>
            <span class="bro-slot-open">Waiting for player...</span>
            <span></span>
          </div>`;
      }
    }
    const container = document.getElementById('bro-lobby-slots');
    if (container) container.innerHTML = html;
  }

  // ── Lobby rule change (host) ──
  window.broLobbyRuleChange = function(val) {
    broParseRule(val);
    if (photonClient && photonClient.isJoinedToRoom()) {
      photonClient.raiseEvent(EV_MATCH_RULE, {
        rule: window.__broMatchRule,
        targetGoals: window.__broTargetGoals
      });
      // Update room props for new joiners
      try {
        photonClient.myRoom().setCustomProperty('rule', window.__broMatchRule);
        photonClient.myRoom().setCustomProperty('targetGoals', window.__broTargetGoals);
      } catch(e) {}
    }
  };

  // ── Host starts match ──
  window.broHostStart = function() {
    if (!photonClient || !photonClient.isJoinedToRoom()) return;
    const actors = photonClient.myRoomActorsArray();
    if (actors.length < 2) { showToast('Need 2 players to start!'); return; }

    const payload = {
      rule: window.__broMatchRule,
      targetGoals: window.__broTargetGoals
    };
    photonClient.raiseEvent(EV_START_GAME, payload);
    broLaunchMatch(payload);
  };

  // ── Exit room ──
  window.broExitRoom = function() {
    if (isLeavingRoom) return;
    isLeavingRoom = true;
    try {
      if (photonClient && photonClient.isJoinedToRoom()) photonClient.leaveRoom();
    } catch(e) {}
    setTimeout(() => { isLeavingRoom = false; }, 600);
    isBusy = false;
    resetActionBtns();
    document.getElementById('view-lobby').style.display = 'none';
    document.getElementById('view-matchmaking').style.display = 'flex';
    broRenderRooms();
  };

  // ── Leave during match ──
  window.broLeaveMatch = function() {
    if (!matchActive) return;
    matchActive = false;
    if (photonClient && photonClient.isJoinedToRoom()) {
      try { photonClient.leaveRoom(); } catch(e) {}
    }
    document.getElementById('bro-hud').style.display = 'none';
    document.getElementById('bro-leave-btn').style.display = 'none';
    window.__broScores = { 1: 0, 2: 0 };
    // Re-open modal
    const modal = document.getElementById('bro-modal');
    if (modal) {
      modal.style.display = 'flex';
      document.getElementById('view-lobby').style.display = 'none';
      document.getElementById('view-matchmaking').style.display = 'flex';
    }
    broEnsureConnected();
    broRenderRooms();
    broStartAutoRefresh();
  };

  function broEndMatchDueToLeave() {
    matchActive = false;
    document.getElementById('bro-hud').style.display = 'none';
    document.getElementById('bro-leave-btn').style.display = 'none';
    window.__broScores = { 1: 0, 2: 0 };
    alert('Your opponent left the match.');
    const modal = document.getElementById('bro-modal');
    if (modal) {
      modal.style.display = 'flex';
      document.getElementById('view-lobby').style.display = 'none';
      document.getElementById('view-matchmaking').style.display = 'flex';
    }
    broEnsureConnected();
    broRenderRooms();
    broStartAutoRefresh();
  }

  // ── Launch match ──
  function broLaunchMatch(config) {
    if (config && config.rule)        window.__broMatchRule   = config.rule;
    if (config && config.targetGoals) window.__broTargetGoals = config.targetGoals;

    matchActive = true;
    window.__broScores = { 1: 0, 2: 0 };

    // Close modal
    const modal = document.getElementById('bro-modal');
    if (modal) modal.style.display = 'none';

    // Show HUD
    const hud = document.getElementById('bro-hud');
    hud.style.display = 'block';
    broUpdateHUD();

    // Show leave button
    document.getElementById('bro-leave-btn').style.display = 'block';
  }

  // ── HUD ──
  function broUpdateHUD() {
    const scores = document.getElementById('bro-hud-scores');
    const rule   = document.getElementById('bro-hud-rule');
    if (!scores || !rule) return;
    const s1 = window.__broScores[1] || 0;
    const s2 = window.__broScores[2] || 0;
    scores.textContent = 'P1: ' + s1 + ' — P2: ' + s2;
    rule.textContent = window.__broMatchRule === 'score'
      ? 'First to ' + window.__broTargetGoals + ' goals'
      : 'Infinite play';
  }
  window.__broUpdateHUD = broUpdateHUD;

  // ── Win condition check ──
  function broCheckWin() {
    if (!matchActive || window.__broMatchRule !== 'score') return;
    const target = window.__broTargetGoals;
    for (let slot = 1; slot <= 2; slot++) {
      if ((window.__broScores[slot] || 0) >= target) {
        matchActive = false;
        const won = (slot === localSlot);
        setTimeout(() => {
          document.getElementById('bro-hud').style.display = 'none';
          document.getElementById('bro-leave-btn').style.display = 'none';
          alert(won ? '🏆 You won! First to ' + target + ' goals!' : '😞 You lost. Opponent reached ' + target + ' goals.');
          // Cleanup
          if (photonClient && photonClient.isJoinedToRoom()) {
            try { photonClient.leaveRoom(); } catch(e) {}
          }
          window.__broScores = { 1: 0, 2: 0 };
          const modal = document.getElementById('bro-modal');
          if (modal) {
            modal.style.display = 'flex';
            document.getElementById('view-lobby').style.display = 'none';
            document.getElementById('view-matchmaking').style.display = 'flex';
          }
          broEnsureConnected();
          broRenderRooms();
          broStartAutoRefresh();
        }, 400);
        break;
      }
    }
  }
  window.__broCheckWin = broCheckWin;

  // ── Score reporter (called by game communication layer) ──
  // The iframe game can postMessage score updates, OR external code calls this.
  window.__broReportScore = function(p1Score, p2Score) {
    if (!matchActive) return;
    window.__broScores[1] = p1Score;
    window.__broScores[2] = p2Score;
    broUpdateHUD();

    // Broadcast to remote player (host authoritative)
    if (localSlot === 1 && photonClient && photonClient.isJoinedToRoom()) {
      photonClient.raiseEvent(EV_SCORE_UPDATE, { s1: p1Score, s2: p2Score });
    }
    broCheckWin();
  };

  // ── Photon events ──
  function onEvent(code, content, actorNr) {
    if (code === EV_START_GAME) {
      broLaunchMatch(content);
    } else if (code === EV_SCORE_UPDATE) {
      if (!matchActive || localSlot !== 2) return; // only guest receives score from host
      if (content) {
        window.__broScores[1] = content.s1 || 0;
        window.__broScores[2] = content.s2 || 0;
        broUpdateHUD();
        broCheckWin();
      }
    } else if (code === EV_MATCH_RULE) {
      if (content) {
        window.__broMatchRule   = content.rule || 'score';
        window.__broTargetGoals = content.targetGoals || 5;
        updateScoreBadge();
        // Update lobby badge for guest
        const badge = document.getElementById('bro-lobby-rule-badge');
        if (badge) {
          badge.textContent = window.__broMatchRule === 'score'
            ? ('First to ' + window.__broTargetGoals + ' Goals')
            : 'Infinite Play';
        }
      }
    } else if (code === EV_GAME_OVER) {
      broCheckWin();
    }
  }

  // ── Listen for score postMessages from the game iframe ──
  window.addEventListener('message', function(e) {
    if (!matchActive) return;
    try {
      const data = (typeof e.data === 'string') ? JSON.parse(e.data) : e.data;
      if (data && data.type === 'bro_score') {
        window.__broReportScore(data.p1 || 0, data.p2 || 0);
      }
    } catch(err) {}
  });

  // ── Helpers ──
  function getProps(room) {
    if (!room) return {};
    if (typeof room.getCustomProperties === 'function') return room.getCustomProperties() || {};
    return room.customProperties || {};
  }

  // ── Init ──
  (function init() {
    updateScoreBadge();
    // Pre-fill name from storage
    try {
      const saved = localStorage.getItem('bro_name') || localStorage.getItem('nickname') || '';
      const inp = document.getElementById('bro-callsign');
      if (inp && saved) inp.value = saved;
      myName = saved || 'Player';
    } catch(e) {}
  })();

})();
</script>
</body>
</html>
