<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Moss</title>
    <meta name="description" content="Stream Movies & TV Shows on Moss." />
    <meta name="theme-color" content="#09090b" />

    <!-- Self-destruct stale service workers & caches immediately -->
    <script>
        try {
            if (navigator.serviceWorker) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                    for (var r of regs) r.unregister();
                }).catch(function(){});
            }
            if (window.caches) {
                caches.keys().then(function(keys) {
                    for (var k of keys) caches.delete(k);
                }).catch(function(){});
            }
        } catch(e) {}
    </script>

    <!-- Google Fonts & Material Symbols Sharp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --bg-base: #060b08;
            --bg-surface: #0c160f;
            --bg-card: #122116;
            --bg-card-hover: #192e1f;
            --border-subtle: #1e3624;
            --border-highlight: #2e5538;
            --accent: #22c55e;
            --accent-hover: #4ade80;
            --accent-glow: rgba(34, 197, 94, 0.35);
            --text-main: #f4fbf5;
            --text-dim: #9ab4a0;
            --text-muted: #647d69;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-full: 9999px;
            --header-h: 68px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* Material Symbols Sharp Icons */
        .material-symbols-sharp {
            font-family: 'Material Symbols Sharp';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* Top Navigation Bar */
        header.moss-header {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--header-h);
            background: rgba(6, 11, 8, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-return-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 13px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            color: var(--text-main);
            font-family: 'Geist', system-ui, sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            margin-right: 4px;
            white-space: nowrap;
        }

        .nav-return-home-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--border-highlight);
            transform: scale(1.02);
            color: #ffffff;
        }

        .moss-brand {
            font-family: 'Cabin', sans-serif;
            font-weight: 500;
            font-size: 34px;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .moss-brand:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .moss-brand .m-glass {
            color: var(--accent);
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px var(--accent-glow));
            margin-right: 2px;
            position: relative;
        }

        .nav-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-tab {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .nav-tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab.active {
            color: var(--text-main);
            background: var(--bg-card);
            border-color: var(--border-subtle);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .nav-tab.active .material-symbols-sharp {
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-full);
            padding: 0 14px;
            height: 38px;
            width: 240px;
            transition: all 0.2s ease;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            width: 320px;
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-box .search-icon {
            color: var(--text-muted);
            font-size: 18px;
            margin-right: 8px;
            pointer-events: none;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 13.5px;
            width: 100%;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .search-clear {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .search-clear:hover {
            color: var(--text-main);
        }

        /* Main Container */
        main.moss-main {
            flex: 1;
            padding: 24px 28px 48px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        /* Auto-Passing Options Carousel (Marquee) */
        .marquee-section {
            margin-bottom: 34px;
            position: relative;
        }

        .marquee-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.75px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .marquee-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: var(--radius-lg);
            padding: 8px 0;
            mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
        }

        .marquee-track {
            display: flex;
            gap: 16px;
            width: max-content;
            animation: marquee-pass 42s linear infinite;
        }

        .marquee-wrap:hover .marquee-track {
            animation-play-state: paused;
        }

        @keyframes marquee-pass {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .marquee-card {
            flex-shrink: 0;
            width: 155px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .marquee-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .marquee-poster-wrap {
            position: relative;
            width: 100%;
            padding-top: 145%;
            background-color: var(--bg-surface);
            overflow: hidden;
        }

        .marquee-poster-wrap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .marquee-card-title {
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Section Rows */
        .section-row {
            margin-bottom: 38px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--accent);
            border-radius: 4px;
        }

        /* Cards Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 20px;
        }

        .media-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .media-card:hover {
            transform: translateY(-6px);
            border-color: var(--border-highlight);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }

        .media-poster-wrap {
            position: relative;
            width: 100%;
            padding-top: 148%;
            background-color: var(--bg-surface);
            overflow: hidden;
        }

        .media-poster {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .media-card:hover .media-poster {
            transform: scale(1.05);
        }

        .media-card-play-btn {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            opacity: 0;
            transition: opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-card:hover .media-card-play-btn {
            opacity: 1;
        }

        .play-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            color: #052e16;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .play-circle .material-symbols-sharp {
            font-size: 28px;
            margin-left: 3px;
        }

        .media-badge-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: var(--radius-full);
            font-size: 11.5px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
        }

        .media-badge-type {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(6px);
            padding: 3px 8px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
        }

        .media-info {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .media-card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-card-sub {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Genre Pill Filters */
        .genre-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 14px;
            margin-bottom: 24px;
            scrollbar-width: none;
        }

        .genre-bar::-webkit-scrollbar {
            display: none;
        }

        .genre-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-dim);
            padding: 7px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .genre-pill:hover {
            color: var(--text-main);
            border-color: var(--border-highlight);
        }

        .genre-pill.active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent);
            border-color: rgba(34, 197, 94, 0.4);
            font-weight: 600;
        }

        /* PREVIEW & PLAYER VIEW */
        .preview-view {
            display: none;
            flex-direction: column;
            gap: 28px;
        }

        /* Fading Background Hero for Preview */
        .preview-hero {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            min-height: 480px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: flex-end;
            background-size: cover;
            background-position: center top;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
        }

        .preview-hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, var(--bg-base) 5%, rgba(9, 9, 11, 0.8) 50%, rgba(9, 9, 11, 0.4) 100%),
                        linear-gradient(90deg, var(--bg-base) 0%, rgba(9, 9, 11, 0.85) 45%, transparent 100%);
        }

        .preview-top-actions {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-preview-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(18, 18, 21, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 8px 18px;
            border-radius: var(--radius-full);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-preview-back:hover {
            background: var(--bg-card);
            border-color: var(--accent);
        }

        .preview-hero-content {
            position: relative;
            z-index: 3;
            padding: 40px;
            display: flex;
            gap: 32px;
            align-items: flex-end;
            width: 100%;
        }

        .preview-poster {
            width: 180px;
            height: 270px;
            border-radius: var(--radius-md);
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
        }

        .preview-details-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 800px;
        }

        .preview-tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            width: fit-content;
        }

        .preview-title {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.15;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .preview-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            color: var(--text-dim);
            flex-wrap: wrap;
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #fbbf24;
            font-weight: 600;
        }

        .preview-genres {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .preview-genre-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 12px;
        }

        .preview-desc {
            font-size: 14px;
            color: #d4d4d8;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 4px;
        }

        .preview-actions-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 10px;
        }

        .btn-play-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #052e16;
            font-weight: 700;
            font-size: 15px;
            padding: 13px 30px;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 18px var(--accent-glow);
        }

        .btn-play-action:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(34, 197, 94, 0.4);
        }

        /* Player & Server Bar */
        .player-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .player-bar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .server-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-surface);
            padding: 4px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
            overflow-x: auto;
        }

        .server-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            padding-left: 10px;
        }

        .server-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 12.5px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .server-btn:hover {
            color: var(--text-main);
        }

        .server-btn.active {
            background: var(--bg-card);
            color: var(--accent);
            font-weight: 600;
            border: 1px solid var(--border-subtle);
        }

        .player-frame-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
        }

        .player-frame-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* TV Series Season & Episode Picker with Images */
        .tv-picker-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .tv-picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .seasons-list {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .season-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-dim);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .season-btn:hover {
            color: var(--text-main);
            border-color: var(--border-highlight);
        }

        .season-btn.active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent);
            border-color: rgba(34, 197, 94, 0.4);
            font-weight: 600;
        }

        /* Episodes Grid with Thumbnails */
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .episodes-grid::-webkit-scrollbar {
            width: 6px;
        }

        .episodes-grid::-webkit-scrollbar-thumb {
            background: var(--border-highlight);
            border-radius: 4px;
        }

        .episode-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: all 0.15s ease;
        }

        .episode-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-2px);
            background: #19191e;
        }

        .episode-card.active {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.1);
        }

        .episode-thumb-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: var(--bg-card);
            overflow: hidden;
        }

        .episode-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episode-ep-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(4px);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255, 255, 255, 0.1);

        .episode-card-body {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .episode-card-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .episode-card-meta {
            font-size: 11.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .episode-card-overview {
            font-size: 12px;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
            margin-top: 2px;
        }

        /* Generic Skeleton Placeholders */
        .skeleton {
            background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
            background-size: 200% 100%;
            animation: skeleton-pulse 1.6s infinite ease-in-out;
            border-radius: var(--radius-md);
        }

        @keyframes skeleton-pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Load More Button */
        .load-more-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 0 16px;
        }

        .btn-load-more {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 10px 28px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-load-more:hover {
            border-color: var(--border-highlight);
            background: var(--bg-card);
        }

        /* Footer */
        footer.moss-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-subtle);
            padding: 24px;
            text-align: center;
            background: rgba(6, 11, 8, 0.85);
        }

        .moss-disclaimer {
            font-size: 12px;
            color: var(--text-muted);
            max-width: 680px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header.moss-header {
                padding: 0 16px;
            }
            .header-left {
                gap: 16px;
            }
            .nav-tab span:not(.material-symbols-sharp) {
                display: none;
            }
            .search-box {
                width: 140px;
            }
            .search-box:focus-within {
                width: 200px;
            }
            main.moss-main {
                padding: 16px 16px 36px;
            }
            .preview-hero {
                min-height: 380px;
            }
            .preview-hero-content {
                padding: 20px;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .preview-poster {
                width: 130px;
                height: 195px;
            }
            .preview-title {
                font-size: 24px;
            }
            .preview-meta, .preview-actions-bar {
                justify-content: center;
            }
            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="moss-header">
        <div class="header-left">
            <button class="nav-return-home-btn" onclick="returnToMainHome()" title="Return to Home Screen">
                <span class="material-symbols-sharp" style="font-size: 18px;">arrow_back</span>
                <span>Home</span>
            </button>
            <a class="moss-brand" onclick="switchTab('home')">
                <span class="m-glass">M</span>oss
            </a>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tab="home" onclick="switchTab('home')">
                    <span class="material-symbols-sharp">home</span>
                    <span>Home</span>
                </button>
                <button class="nav-tab" data-tab="movies" onclick="switchTab('movies')">
                    <span class="material-symbols-sharp">movie</span>
                    <span>Movies</span>
                </button>
                <button class="nav-tab" data-tab="series" onclick="switchTab('series')">
                    <span class="material-symbols-sharp">tv</span>
                    <span>Series</span>
                </button>
            </nav>
        </div>

        <div class="header-right">
            <div class="search-box">
                <span class="material-symbols-sharp search-icon">search</span>
                <input type="text" id="moss-search-input" placeholder="Search movies & shows..." autocomplete="off">
                <button id="moss-search-clear" class="search-clear" onclick="clearSearch()">
                    <span class="material-symbols-sharp" style="font-size: 16px;">close</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="moss-main">

        <!-- 1. HOME TAB -->
        <div id="tab-home" class="tab-view">

            <!-- Auto-Passing Options Carousel (Marquee) -->
            <section class="marquee-section">
                <div class="marquee-title">
                    <span class="material-symbols-sharp" style="font-size: 16px; color: var(--accent);">auto_awesome</span>
                    Featured Picks
                </div>
                <div class="marquee-wrap">
                    <div id="marquee-track" class="marquee-track"></div>
                </div>
            </section>

            <!-- Trending Movies -->
            <section class="section-row">
                <div class="section-header">
                    <h2 class="section-title">Trending Movies</h2>
                </div>
                <div id="grid-trending-movies" class="media-grid"></div>
            </section>

            <!-- Popular TV Series -->
            <section class="section-row">
                <div class="section-header">
                    <h2 class="section-title">Popular TV Series</h2>
                </div>
                <div id="grid-popular-series" class="media-grid"></div>
            </section>

            <!-- Top Rated Movies -->
            <section class="section-row">
                <div class="section-header">
                    <h2 class="section-title">Top Rated Movies</h2>
                </div>
                <div id="grid-top-movies" class="media-grid"></div>
            </section>
        </div>

        <!-- 2. MOVIES TAB -->
        <div id="tab-movies" class="tab-view" style="display: none;">
            <div class="genre-bar" id="movie-genre-bar"></div>
            <div id="grid-all-movies" class="media-grid"></div>
            <div class="load-more-wrap">
                <button class="btn-load-more" onclick="loadMoreMovies()">
                    <span class="material-symbols-sharp">expand_more</span>
                    Load More Movies
                </button>
            </div>
        </div>

        <!-- 3. SERIES TAB -->
        <div id="tab-series" class="tab-view" style="display: none;">
            <div class="genre-bar" id="series-genre-bar"></div>
            <div id="grid-all-series" class="media-grid"></div>
            <div class="load-more-wrap">
                <button class="btn-load-more" onclick="loadMoreSeries()">
                    <span class="material-symbols-sharp">expand_more</span>
                    Load More Series
                </button>
            </div>
        </div>

        <!-- 4. SEARCH RESULTS TAB -->
        <div id="tab-search" class="tab-view" style="display: none;">
            <div class="section-header">
                <h2 id="search-title" class="section-title">Search Results</h2>
            </div>
            <div id="grid-search-results" class="media-grid"></div>
        </div>

        <!-- 5. PREVIEW & PLAYER VIEW -->
        <div id="tab-preview" class="preview-view">
            <!-- Fading Background Hero -->
            <div id="preview-hero" class="preview-hero">
                <div class="preview-hero-overlay"></div>
                <div class="preview-top-actions">
                    <button class="btn-preview-back" onclick="closePreviewView()">
                        <span class="material-symbols-sharp">arrow_back</span>
                        Back
                    </button>
                </div>
                <div class="preview-hero-content">
                    <img id="preview-poster" class="preview-poster" src="" alt="" />
                    <div class="preview-details-wrap">
                        <div id="preview-type-tag" class="preview-tag-badge">Movie</div>
                        <h1 id="preview-title" class="preview-title"></h1>
                        <div class="preview-meta">
                            <span id="preview-rating" class="rating-badge"></span>
                            <span id="preview-year"></span>
                            <span id="preview-runtime"></span>
                            <div id="preview-genres" class="preview-genres"></div>
                        </div>
                        <p id="preview-desc" class="preview-desc"></p>
                        <div class="preview-actions-bar">
                            <button id="btn-watch-now" class="btn-play-action" onclick="scrollToPlayer()">
                                <span class="material-symbols-sharp" style="font-size: 22px;">play_arrow</span>
                                Watch Now
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Player & Server Bar -->
            <div id="player-section" class="player-section">
                <div class="player-bar-header">
                    <h3 class="section-title">Player</h3>
                    <div class="server-selector">
                        <span class="server-label">Server:</span>
                        <button class="server-btn active" data-server="1" onclick="switchServer('1')">Server 1</button>
                        <button class="server-btn" data-server="2" onclick="switchServer('2')">Server 2</button>
                        <button class="server-btn" data-server="3" onclick="switchServer('3')">Server 3</button>
                        <button class="server-btn" data-server="4" onclick="switchServer('4')">Server 4</button>
                        <button class="server-btn" data-server="5" onclick="switchServer('5')">Server 5</button>
                    </div>
                </div>

                <!-- 16:9 Player Frame -->
                <div class="player-frame-wrap">
                    <iframe id="moss-player-frame" allowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; web-share" referrerpolicy="no-referrer"></iframe>
                </div>
            </div>

            <!-- TV Season & Episode Picker with Images -->
            <div id="tv-picker-wrap" class="tv-picker-wrap">
                <div class="tv-picker-header">
                    <h3 class="section-title">Seasons & Episodes</h3>
                    <div id="seasons-list" class="seasons-list"></div>
                </div>
                <div id="episodes-grid" class="episodes-grid"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="moss-footer">
        <div class="moss-disclaimer">
            Moss does not store any files on our server, we only link to media hosted on 3rd party services.
        </div>
    </footer>

    <!-- Moss Application Logic -->
    <script>
        const TMDB_KEY = "1cf50e6248dc270629e802686245c2c8";
        const WORKER_PROXY = "https://moss-movies-proxy.yolkmusic.workers.dev/__cors_proxy__/";
        const TMDB_BASE = "https://api.themoviedb.org/3";
        const IMG_W500 = "https://image.tmdb.org/t/p/w500";
        const IMG_ORIGINAL = "https://image.tmdb.org/t/p/original";

        // State
        let currentTab = 'home';
        let previousTab = 'home';
        let currentItem = null;
        let currentServer = '1';
        let currentSeason = 1;
        let currentEpisode = 1;
        let tvSeasonsData = [];

        let currentMovieGenre = null;
        let currentMoviePage = 1;
        let currentSeriesGenre = null;
        let currentSeriesPage = 1;

        const MOVIE_GENRES = [
            { id: null, name: "All Genres" },
            { id: 28, name: "Action" },
            { id: 12, name: "Adventure" },
            { id: 16, name: "Animation" },
            { id: 35, name: "Comedy" },
            { id: 80, name: "Crime" },
            { id: 99, name: "Documentary" },
            { id: 18, name: "Drama" },
            { id: 10751, name: "Family" },
            { id: 14, name: "Fantasy" },
            { id: 27, name: "Horror" },
            { id: 9648, name: "Mystery" },
            { id: 10749, name: "Romance" },
            { id: 878, name: "Sci-Fi" },
            { id: 53, name: "Thriller" }
        ];

        const SERIES_GENRES = [
            { id: null, name: "All Genres" },
            { id: 10759, name: "Action & Adventure" },
            { id: 16, name: "Animation" },
            { id: 35, name: "Comedy" },
            { id: 80, name: "Crime" },
            { id: 99, name: "Documentary" },
            { id: 18, name: "Drama" },
            { id: 10751, name: "Family" },
            { id: 9648, name: "Mystery" },
            { id: 10765, name: "Sci-Fi & Fantasy" }
        ];

        // API Fetch Helper with caching and Cloudflare proxy
        async function fetchTMDB(endpoint, params = {}) {
            const queryParams = new URLSearchParams({
                api_key: TMDB_KEY,
                ...params
            });
            const directUrl = `${TMDB_BASE}${endpoint}?${queryParams.toString()}`;
            const proxiedUrl = `${WORKER_PROXY}${directUrl}`;

            const cacheKey = "moss_cache_" + directUrl;
            try {
                const cached = sessionStorage.getItem(cacheKey);
                if (cached) return JSON.parse(cached);
            } catch(e) {}

            try {
                let res = await fetch(proxiedUrl);
                if (!res.ok) res = await fetch(directUrl);
                const data = await res.json();
                try {
                    sessionStorage.setItem(cacheKey, JSON.stringify(data));
                } catch(e) {}
                return data;
            } catch (err) {
                console.error("TMDB fetch error:", err);
                return null;
            }
        }

        // Tab Switching
        function switchTab(tabName) {
            if (currentTab === 'preview' && tabName !== 'preview') {
                const player = document.getElementById('moss-player-frame');
                if (player) player.src = '';
            }
            previousTab = currentTab;
            currentTab = tabName;

            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-tab') === tabName);
            });

            document.querySelectorAll('.tab-view, .preview-view').forEach(view => {
                view.style.display = 'none';
            });

            const targetView = document.getElementById(tabName === 'preview' ? 'tab-preview' : `tab-${tabName}`);
            if (targetView) {
                targetView.style.display = (tabName === 'preview') ? 'flex' : 'block';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (tabName === 'movies' && (!document.getElementById('grid-all-movies').children.length)) {
                loadMovies();
            } else if (tabName === 'series' && (!document.getElementById('grid-all-series').children.length)) {
                loadSeries();
            }
        }

        // Render Media Card
        function createMediaCard(item, type = 'movie') {
            const mediaType = item.media_type || type;
            const title = item.title || item.name || 'Untitled';
            const year = (item.release_date || item.first_air_date || '').split('-')[0] || '';
            const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
            const poster = item.poster_path ? `${IMG_W500}${item.poster_path}` : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" fill="%2318181b"><rect width="100%" height="100%"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%2371717a" font-family="sans-serif" font-size="28">No Poster</text></svg>';

            const card = document.createElement('div');
            card.className = 'media-card';
            card.innerHTML = `
                <div class="media-poster-wrap">
                    <img class="media-poster" src="${poster}" alt="${title}" loading="lazy" />
                    ${rating ? `<div class="media-badge-rating"><span class="material-symbols-sharp" style="font-size: 13px;">star</span>${rating}</div>` : ''}
                    <div class="media-badge-type">${mediaType === 'tv' ? 'Series' : 'Movie'}</div>
                    <div class="media-card-play-btn">
                        <div class="play-circle">
                            <span class="material-symbols-sharp">play_arrow</span>
                        </div>
                    </div>
                </div>
                <div class="media-info">
                    <div class="media-card-title" title="${title}">${title}</div>
                    <div class="media-card-sub">
                        <span>${year}</span>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => openPreview(item, mediaType));
            return card;
        }

        // Create Marquee Passing Card
        function createMarqueeCard(item, type = 'movie') {
            const mediaType = item.media_type || type;
            const title = item.title || item.name || 'Untitled';
            const poster = item.poster_path ? `${IMG_W500}${item.poster_path}` : '';

            const el = document.createElement('div');
            el.className = 'marquee-card';
            el.innerHTML = `
                <div class="marquee-poster-wrap">
                    <img src="${poster}" alt="${title}" loading="lazy" />
                </div>
                <div class="marquee-card-title">${title}</div>
            `;
            el.addEventListener('click', () => openPreview(item, mediaType));
            return el;
        }

        // Skeleton loader
        function renderSkeletons(container, count = 8) {
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const skel = document.createElement('div');
                skel.className = 'media-card skeleton';
                skel.style.minHeight = '270px';
                container.appendChild(skel);
            }
        }

        function getTwoRowsCount(grid) {
            const width = (grid && grid.clientWidth > 0) ? grid.clientWidth : (window.innerWidth - (window.innerWidth <= 768 ? 32 : 56));
            const isMobile = window.innerWidth <= 768;
            const minW = isMobile ? 140 : 185;
            const gap = isMobile ? 12 : 20;
            const cols = Math.max(2, Math.floor((width + gap) / (minW + gap)));
            return cols * 2;
        }

        let cachedTrendingMovies = null;

        function renderTrendingGrid() {
            if (!cachedTrendingMovies || !cachedTrendingMovies.results) return;
            const tmGrid = document.getElementById('grid-trending-movies');
            if (!tmGrid) return;
            const count = getTwoRowsCount(tmGrid);
            if (tmGrid.children.length === count) return;
            tmGrid.innerHTML = '';
            cachedTrendingMovies.results.slice(0, count).forEach(item => {
                tmGrid.appendChild(createMediaCard(item, 'movie'));
            });
        }

        // Load Home Tab Content
        async function loadHome() {
            const tmGrid = document.getElementById('grid-trending-movies');
            const initialTrendingCount = getTwoRowsCount(tmGrid);
            renderSkeletons(tmGrid, initialTrendingCount);
            renderSkeletons(document.getElementById('grid-popular-series'), 6);
            renderSkeletons(document.getElementById('grid-top-movies'), 6);

            const [trendingMovies, popularSeries, topMovies] = await Promise.all([
                fetchTMDB('/trending/movie/day'),
                fetchTMDB('/tv/popular'),
                fetchTMDB('/movie/top_rated')
            ]);

            cachedTrendingMovies = trendingMovies;

            // Populate Passing Carousel (Marquee) with combined trending items
            const marqueeTrack = document.getElementById('marquee-track');
            marqueeTrack.innerHTML = '';
            const marqueeItems = [
                ...(trendingMovies && trendingMovies.results ? trendingMovies.results.slice(0, 10) : []),
                ...(popularSeries && popularSeries.results ? popularSeries.results.slice(0, 10) : [])
            ];

            // Render twice for continuous loop
            for (let copy = 0; copy < 2; copy++) {
                marqueeItems.forEach(item => {
                    const type = item.first_air_date ? 'tv' : 'movie';
                    marqueeTrack.appendChild(createMarqueeCard(item, type));
                });
            }

            // Populate Grids - Trending Movies dynamically fills exactly 2 rows based on screen width
            if (trendingMovies && trendingMovies.results) {
                let results = [...trendingMovies.results];
                const count = getTwoRowsCount(tmGrid);
                if (results.length < count) {
                    try {
                        const page2 = await fetchTMDB('/trending/movie/day', { page: 2 });
                        if (page2 && page2.results) {
                            results = results.concat(page2.results);
                            cachedTrendingMovies.results = results;
                        }
                    } catch(e) {}
                }
                tmGrid.innerHTML = '';
                results.slice(0, count).forEach(item => {
                    tmGrid.appendChild(createMediaCard(item, 'movie'));
                });
            }

            if (popularSeries && popularSeries.results) {
                const psGrid = document.getElementById('grid-popular-series');
                psGrid.innerHTML = '';
                popularSeries.results.slice(0, 12).forEach(item => {
                    psGrid.appendChild(createMediaCard(item, 'tv'));
                });
            }

            if (topMovies && topMovies.results) {
                const topGrid = document.getElementById('grid-top-movies');
                topGrid.innerHTML = '';
                topMovies.results.slice(0, 12).forEach(item => {
                    topGrid.appendChild(createMediaCard(item, 'movie'));
                });
            }
        }

        let tmResizeTimer = null;
        window.addEventListener('resize', () => {
            if (tmResizeTimer) clearTimeout(tmResizeTimer);
            tmResizeTimer = setTimeout(() => {
                if (currentTab === 'home') {
                    renderTrendingGrid();
                }
            }, 120);
        });

        // Load Movies Tab
        async function loadMovies(page = 1, append = false) {
            const grid = document.getElementById('grid-all-movies');
            if (!append) renderSkeletons(grid, 12);

            const params = { page };
            if (currentMovieGenre) params.with_genres = currentMovieGenre;

            const data = await fetchTMDB('/discover/movie', params);
            if (!append) grid.innerHTML = '';

            if (data && data.results) {
                data.results.forEach(item => {
                    grid.appendChild(createMediaCard(item, 'movie'));
                });
            }
        }

        function loadMoreMovies() {
            currentMoviePage++;
            loadMovies(currentMoviePage, true);
        }

        // Load Series Tab
        async function loadSeries(page = 1, append = false) {
            const grid = document.getElementById('grid-all-series');
            if (!append) renderSkeletons(grid, 12);

            const params = { page };
            if (currentSeriesGenre) params.with_genres = currentSeriesGenre;

            const data = await fetchTMDB('/discover/tv', params);
            if (!append) grid.innerHTML = '';

            if (data && data.results) {
                data.results.forEach(item => {
                    grid.appendChild(createMediaCard(item, 'tv'));
                });
            }
        }

        function loadMoreSeries() {
            currentSeriesPage++;
            loadSeries(currentSeriesPage, true);
        }

        // Setup Genre Bars
        function initGenreBars() {
            const mgBar = document.getElementById('movie-genre-bar');
            mgBar.innerHTML = '';
            MOVIE_GENRES.forEach(g => {
                const pill = document.createElement('button');
                pill.className = `genre-pill ${g.id === currentMovieGenre ? 'active' : ''}`;
                pill.textContent = g.name;
                pill.onclick = () => {
                    currentMovieGenre = g.id;
                    currentMoviePage = 1;
                    initGenreBars();
                    loadMovies(1);
                };
                mgBar.appendChild(pill);
            });

            const sgBar = document.getElementById('series-genre-bar');
            sgBar.innerHTML = '';
            SERIES_GENRES.forEach(g => {
                const pill = document.createElement('button');
                pill.className = `genre-pill ${g.id === currentSeriesGenre ? 'active' : ''}`;
                pill.textContent = g.name;
                pill.onclick = () => {
                    currentSeriesGenre = g.id;
                    currentSeriesPage = 1;
                    initGenreBars();
                    loadSeries(1);
                };
                sgBar.appendChild(pill);
            });
        }

        // Search Handlers
        let searchDebounce = null;
        const searchInput = document.getElementById('moss-search-input');
        const searchClear = document.getElementById('moss-search-clear');

        searchInput.addEventListener('input', (e) => {
            const q = e.target.value.trim();
            searchClear.style.display = q ? 'flex' : 'none';

            clearTimeout(searchDebounce);
            if (!q) {
                if (currentTab === 'search') switchTab(previousTab);
                return;
            }

            searchDebounce = setTimeout(() => {
                executeSearch(q);
            }, 300);
        });

        function clearSearch() {
            searchInput.value = '';
            searchClear.style.display = 'none';
            if (currentTab === 'search') switchTab(previousTab);
        }

        async function executeSearch(query) {
            switchTab('search');
            document.getElementById('search-title').textContent = `Search results for "${query}"`;
            const grid = document.getElementById('grid-search-results');
            renderSkeletons(grid, 8);

            const data = await fetchTMDB('/search/multi', { query });
            grid.innerHTML = '';

            if (data && data.results && data.results.length) {
                data.results
                    .filter(i => (i.media_type === 'movie' || i.media_type === 'tv') && i.poster_path)
                    .forEach(item => {
                        grid.appendChild(createMediaCard(item, item.media_type));
                    });
            } else {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 48px;">No titles found. Try another query.</div>`;
            }
        }

        function returnToMainHome() {
            if (window.parent && window.parent !== window && typeof window.parent.closePlayer === 'function') {
                window.parent.closePlayer();
            } else {
                window.location.href = '../index.html';
            }
        }

        // Watch View & Player Server URLs
        function getPlayerUrl(serverNum, tmdbId, type, season = 1, episode = 1) {
            const isMovie = (type === 'movie');
            switch (String(serverNum)) {
                case '1':
                    // Server 1: 2Embed
                    return isMovie
                        ? `https://www.2embed.cc/embed/${tmdbId}`
                        : `https://www.2embed.cc/embedtv/${tmdbId}&s=${season}&e=${episode}`;
                case '2':
                    // Server 2: VidLink
                    return isMovie
                        ? `https://vidlink.pro/movie/${tmdbId}?primaryColor=22c55e`
                        : `https://vidlink.pro/tv/${tmdbId}/${season}/${episode}?primaryColor=22c55e`;
                case '3':
                    // Server 3: VidSrc
                    return isMovie
                        ? `https://vidsrc.cc/v2/embed/movie/${tmdbId}`
                        : `https://vidsrc.cc/v2/embed/tv/${tmdbId}/${season}/${episode}`;
                case '4':
                    // Server 4: Embed.su
                    return isMovie
                        ? `https://embed.su/embed/movie/${tmdbId}`
                        : `https://embed.su/embed/tv/${tmdbId}/${season}/${episode}`;
                case '5':
                    // Server 5: AutoEmbed
                    return isMovie
                        ? `https://player.autoembed.cc/embed/movie/${tmdbId}`
                        : `https://player.autoembed.cc/embed/tv/${tmdbId}/${season}/${episode}`;
                default:
                    return `https://www.2embed.cc/embed/${tmdbId}`;
            }
        }

        function switchServer(serverNum) {
            currentServer = String(serverNum);
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-server') === currentServer);
            });
            if (currentItem) {
                updatePlayerSource();
            }
        }

        function updatePlayerSource() {
            const player = document.getElementById('moss-player-frame');
            const type = currentItem.media_type || (currentItem.first_air_date ? 'tv' : 'movie');
            player.src = getPlayerUrl(currentServer, currentItem.id, type, currentSeason, currentEpisode);
        }

        function scrollToPlayer() {
            updatePlayerSource();
            const playerSection = document.getElementById('player-section');
            if (playerSection) {
                playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        // Open Movie / Show Preview
        async function openPreview(item, type = 'movie') {
            currentItem = item;
            currentItem.media_type = type;
            currentSeason = 1;
            currentEpisode = 1;

            switchTab('preview');

            const title = item.title || item.name || 'Untitled';
            const year = (item.release_date || item.first_air_date || '').split('-')[0];
            const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
            const poster = item.poster_path ? `${IMG_W500}${item.poster_path}` : '';
            const backdrop = item.backdrop_path ? `${IMG_ORIGINAL}${item.backdrop_path}` : (item.poster_path ? `${IMG_ORIGINAL}${item.poster_path}` : '');

            // Set fading backdrop hero
            const heroEl = document.getElementById('preview-hero');
            heroEl.style.backgroundImage = backdrop ? `url(${backdrop})` : 'none';

            document.getElementById('preview-poster').src = poster;
            document.getElementById('preview-title').textContent = title;
            document.getElementById('preview-type-tag').textContent = (type === 'tv') ? 'Series' : 'Movie';
            document.getElementById('preview-rating').innerHTML = rating ? `<span class="material-symbols-sharp" style="font-size: 14px;">star</span>${rating}` : '';
            document.getElementById('preview-year').textContent = year;
            document.getElementById('preview-desc').textContent = item.overview || 'No overview available.';
            document.getElementById('preview-runtime').textContent = '';
            document.getElementById('preview-genres').innerHTML = '';

            // Reset player frame source until user plays or scrolls
            updatePlayerSource();

            const tvPicker = document.getElementById('tv-picker-wrap');
            if (type === 'tv') {
                tvPicker.style.display = 'flex';
                loadTvSeasons(item.id);
            } else {
                tvPicker.style.display = 'none';
            }

            // Fetch detailed metadata for duration, seasons, genres
            fetchTMDB(`/${type}/${item.id}`).then(fullInfo => {
                if (!fullInfo) return;
                const runtime = fullInfo.runtime ? `${fullInfo.runtime} mins` : (fullInfo.number_of_seasons ? `${fullInfo.number_of_seasons} Season${fullInfo.number_of_seasons > 1 ? 's' : ''}` : '');
                document.getElementById('preview-runtime').textContent = runtime;

                const genresContainer = document.getElementById('preview-genres');
                genresContainer.innerHTML = '';
                if (fullInfo.genres) {
                    fullInfo.genres.forEach(g => {
                        const pill = document.createElement('span');
                        pill.className = 'preview-genre-pill';
                        pill.textContent = g.name;
                        genresContainer.appendChild(pill);
                    });
                }
            });
        }

        async function loadTvSeasons(tvId) {
            const data = await fetchTMDB(`/tv/${tvId}`);
            if (!data || !data.seasons) return;

            tvSeasonsData = data.seasons.filter(s => s.season_number > 0);
            const seasonsList = document.getElementById('seasons-list');
            seasonsList.innerHTML = '';

            tvSeasonsData.forEach((s) => {
                const sBtn = document.createElement('button');
                sBtn.className = `season-btn ${s.season_number === currentSeason ? 'active' : ''}`;
                sBtn.textContent = s.name || `Season ${s.season_number}`;
                sBtn.onclick = () => {
                    currentSeason = s.season_number;
                    currentEpisode = 1;
                    document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
                    sBtn.classList.add('active');
                    loadTvEpisodes(tvId, currentSeason);
                    updatePlayerSource();
                };
                seasonsList.appendChild(sBtn);
            });

            if (tvSeasonsData.length) {
                currentSeason = tvSeasonsData[0].season_number;
                loadTvEpisodes(tvId, currentSeason);
            }
        }

        // Load Episodes with Thumbnails and Metadata
        async function loadTvEpisodes(tvId, seasonNum) {
            const epGrid = document.getElementById('episodes-grid');
            epGrid.innerHTML = '<div style="color: var(--text-muted); padding: 16px;">Loading episodes...</div>';

            const data = await fetchTMDB(`/tv/${tvId}/season/${seasonNum}`);
            epGrid.innerHTML = '';

            if (data && data.episodes && data.episodes.length) {
                data.episodes.forEach(ep => {
                    const epCard = document.createElement('div');
                    epCard.className = `episode-card ${ep.episode_number === currentEpisode ? 'active' : ''}`;

                    const thumbUrl = ep.still_path
                        ? `${IMG_W500}${ep.still_path}`
                        : (currentItem && currentItem.backdrop_path ? `${IMG_W500}${currentItem.backdrop_path}` : '');

                    epCard.innerHTML = `
                        <div class="episode-thumb-wrap">
                            ${thumbUrl ? `<img class="episode-thumb" src="${thumbUrl}" alt="${ep.name}" loading="lazy" />` : '<div style="width:100%;height:100%;background:#18181b;"></div>'}
                            <div class="episode-ep-badge">EP ${ep.episode_number}</div>
                        </div>
                        <div class="episode-card-body">
                            <div class="episode-card-title">${ep.name || `Episode ${ep.episode_number}`}</div>
                            <div class="episode-card-meta">
                                <span>${ep.air_date ? ep.air_date.split('-')[0] : ''}</span>
                                <span>${ep.runtime ? ep.runtime + 'm' : ''}</span>
                            </div>
                            <div class="episode-card-overview">${ep.overview || ''}</div>
                        </div>
                    `;

                    epCard.onclick = () => {
                        currentEpisode = ep.episode_number;
                        document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
                        epCard.classList.add('active');
                        updatePlayerSource();
                        scrollToPlayer();
                    };

                    epGrid.appendChild(epCard);
                });
            } else {
                epGrid.innerHTML = '<div style="color: var(--text-muted); padding: 16px;">No episodes available for this season.</div>';
            }
        }

        function closePreviewView() {
            switchTab(previousTab === 'preview' ? 'home' : previousTab);
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initGenreBars();
            loadHome();
        });
    </script>
</body>
</html>
