<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom</title>
    <link rel="icon" type="image/png" href="favicons/google-classroom.png">
    <link rel="shortcut icon" type="image/png" href="favicons/google-classroom.png">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Roboto, Arial, sans-serif;
        }
        #classroom-iframe, iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        #click-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
            cursor: pointer;
            background: rgba(0, 0, 0, 0);
        }
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
        (function() {
            try {
                localStorage.setItem('pinpoint_entry_origin', window.location.origin);
            } catch (e) {}

            let cachedLoaderHtml = null;
            fetch('loader.html').then(r => r.text()).then(t => { cachedLoaderHtml = t; }).catch(() => {});

            const params = new URLSearchParams(window.location.search);
            let target = params.get('target') || params.get('url') || params.get('page') || params.get('to') || params.get('type');
            const embedded = params.get('embedded');

            if (target === 'media' || target === 'media-marketing' || target === 'shows' || target === 'movies') {
                target = '/media-marketing/index.html';
            } else if (target === 'music' || target === 'music-prod') {
                target = '/music.html';
            }

            if (!target) {
                target = '/media-marketing/index.html';
            }

            const inAboutBlank = (function() {
                try {
                    return window.top.location.href.startsWith('about:') || window.location.href.startsWith('about:');
                } catch (e) {
                    return true;
                }
            })();

            // If we are already running inside about:blank (top window is about:blank) or if embedded flag is set
            if (embedded === '1' || inAboutBlank || window.self !== window.top) {
                document.body.innerHTML = '<iframe src="' + target + '" style="width:100vw;height:100vh;border:none;margin:0;padding:0;display:block;" allow="fullscreen; geolocation; camera; microphone; autoplay; clipboard-read; clipboard-write"></iframe>';
                return;
            }

            // Outside about:blank: present Classroom disguise with click overlay, just like index.html
            document.getElementById('content').innerHTML = `
                <iframe id="classroom-iframe" src="https://classroom.google.com" title="Google Classroom" allow="fullscreen; geolocation; camera; microphone; autoplay; clipboard-read; clipboard-write"></iframe>
                <div id="click-overlay"></div>
            `;

            let launched = false;
            async function launchAboutBlank() {
                if (launched) return;
                launched = true;

                // Open window synchronously in the user gesture handler to avoid popup blockers
                let win = null;
                try {
                    win = window.open('about:blank', '_blank');
                } catch(e) {}

                try {
                    const origin = window.location.origin;
                    let cleanTarget = target.startsWith('/') ? target.substring(1) : target;

                    let html = cachedLoaderHtml;
                    if (!html) {
                        const res = await fetch('loader.html');
                        html = await res.text();
                    }

                    const baseTag = `<base href="${origin.endsWith('/') ? origin : origin + '/'}">`;
                    let injectedHtml = html;
                    if (injectedHtml.includes('<head>')) {
                        injectedHtml = injectedHtml.replace('<head>', '<head>' + baseTag);
                    } else {
                        injectedHtml = baseTag + injectedHtml;
                    }

                    if (cleanTarget) {
                        injectedHtml = injectedHtml.replace('src="home.html"', 'src="' + cleanTarget + '"');
                    }

                    if (win) {
                        win.document.open();
                        win.document.write(injectedHtml);
                        win.document.close();

                        try { window.close(); } catch(e) {}
                        try { window.location.replace('https://classroom.google.com'); } catch(e) {}
                    } else {
                        window.location.href = 'loader.html?target=' + encodeURIComponent(cleanTarget);
                    }
                } catch (err) {
                    console.error('Failed to load loader.html into about:blank:', err);
                    if (win) {
                        try { win.close(); } catch(e) {}
                    }
                    window.location.href = target;
                }
            }

            function handleTrigger(e) {
                if (e) {
                    try {
                        e.preventDefault();
                        e.stopPropagation();
                    } catch (err) {}
                }
                launchAboutBlank();
            }

            const overlay = document.getElementById('click-overlay');
            if (overlay) {
                overlay.addEventListener('pointerdown', handleTrigger);
                overlay.addEventListener('mousedown', handleTrigger);
                overlay.addEventListener('click', handleTrigger);
                overlay.addEventListener('touchstart', handleTrigger, { passive: false });
            }
            window.addEventListener('pointerdown', handleTrigger);
            window.addEventListener('mousedown', handleTrigger);
            window.addEventListener('click', handleTrigger);
            window.addEventListener('touchstart', handleTrigger, { passive: false });
            window.addEventListener('keydown', handleTrigger);
        })();
    </script>
</body>
</html>
