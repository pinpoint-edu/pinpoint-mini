<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashbin</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z'/></svg>">

  <!-- Google Fonts: Geist, Libre Baskerville, and Material Symbols Sharp -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border: #27272a;
      --border-hover: #3f3f46;
      --border-focus: #ffffff;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #ffffff;
      --success: #22c55e;
      --danger: #ef4444;
      --parabola-ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Headings and Big Text use Libre Baskerville */
    h1, h2, h3, h4, .logo-title, .brand-name, .player-title, .results-title, #smallLogo span {
      font-family: 'Libre Baskerville', Georgia, serif;
      letter-spacing: -0.02em;
    }
      position: relative;
    }

    /* Google Material Symbols Sharp */
    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Top Left Small Logo (reveals when searching) */
    #smallLogo {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--parabola-ease), transform 0.35s var(--parabola-ease);
      transform: translateY(-4px);
      z-index: 50;
      text-decoration: none;
    }

    body.is-searching #smallLogo {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #smallLogo .brand-icon {
      font-size: 24px;
      color: #ffffff;
    }

    /* Top Right Header Badges */
    .top-header-right {
      position: fixed;
      top: 24px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .status-pill.online .dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .status-pill.offline .dot {
      width: 7px;
      height: 7px;
      background: #f59e0b;
      border-radius: 50%;
    }

    /* Central Search Block */
    #search-block {
      position: fixed;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 620px;
      padding: 0 20px;
      z-index: 40;
      box-sizing: border-box;
      transition: top 0.6s var(--parabola-ease), 
                  transform 0.6s var(--parabola-ease);
    }

    body.is-searching #search-block {
      top: 24px;
      transform: translate(-50%, 0);
    }

    /* Large Logo above Search Bar */
    #large-logo-wrapper {
      opacity: 1;
      height: 120px;
      transition: opacity 0.35s ease-out, height 0.35s ease-out, margin 0.35s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      cursor: pointer;
    }

    body.is-searching #large-logo-wrapper {
      opacity: 0;
      height: 0;
      margin-bottom: 0 !important;
      overflow: hidden;
      pointer-events: none;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon-large {
      font-size: 44px;
      color: #ffffff;
      filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.25));
    }

    .logo-title {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #ffffff;
    }

    .logo-sub {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: -0.2px;
    }

    /* Center Pill Search Bar */
    .search-pill-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-pill-icon {
      position: absolute;
      left: 20px;
      font-size: 22px;
      color: var(--text-dim);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    #searchInput {
      width: 100%;
      height: 56px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0 52px 0 54px;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      transition: all 0.25s var(--parabola-ease);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    #searchInput:focus {
      background: #18181b;
      border-color: #ffffff;
      box-shadow: 0 0 0 1px #ffffff, 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    #searchInput::placeholder {
      color: var(--text-dim);
    }

    .clear-search-btn {
      position: absolute;
      right: 16px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #27272a;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-search-btn:hover {
      background: #3f3f46;
      transform: scale(1.05);
    }

    /* Quick Filter Chips */
    .quick-pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .pill-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-chip:hover {
      background: var(--bg-card);
      border-color: #52525b;
      color: #ffffff;
    }

    .pill-chip.active {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    .pill-chip.active .pill-count {
      background: #e4e4e7;
      color: #000000;
    }

    .pill-count {
      font-size: 11px;
      padding: 2px 7px;
      background: #27272a;
      border-radius: 9999px;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Results Container (shows when searching) */
    #results-container {
      max-width: 900px;
      margin: 120px auto 60px auto;
      padding: 0 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease-out;
    }

    body.is-searching #results-container {
      opacity: 1;
      pointer-events: auto;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .results-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
    }

    /* Game Cards Grid */
    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.15s ease;
    }

    .game-card:hover {
      background: var(--bg-card);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .game-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .game-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      background: #18181b;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .game-icon-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .game-details {
      min-width: 0;
      flex: 1;
    }

    .game-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .game-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .badge-dl {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
    }

    .badge-progress {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
    }

    .progress-bar-wrap {
      width: 100%;
      max-width: 180px;
      height: 3px;
      background: #27272a;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #ffffff;
      width: 0%;
      transition: width 0.2s ease;
    }

    /* Buttons */
    .game-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-sharp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
      background: #18181b;
      color: #fafafa;
    }

    .btn-sharp:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-primary-sharp {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }

    .btn-primary-sharp:hover {
      background: #e4e4e7;
      color: #000000;
    }

    .btn-icon-sharp {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon-sharp:hover {
      background: #1f1f23;
      border-color: var(--border);
      color: var(--danger);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state h3 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 12px;
    }

    .empty-state p {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 4px;
    }

    /* In-Page Player View */
    #player-view {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      flex-direction: column;
    }

    .player-header {
      height: 48px;
      background: #09090b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .player-header-left, .player-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .player-iframe {
      flex: 1;
      width: 100%;
      height: calc(100% - 48px);
      border: none;
      background: #000000;
    }
  </style>
</head>
<body>

  <!-- Small Top-Left Logo (reveals during search) -->
  <a href="#" id="smallLogo" onclick="resetToCenterHome(); return false;">
    <span class="material-symbols-sharp brand-icon">delete_sweep</span>
    <span>Trashbin</span>
  </a>

  <!-- Top-Right Header Status -->
  <div class="top-header-right">
    <div id="connectionStatus" class="status-pill online">
      <span class="dot"></span>
      <span id="connectionText">Online</span>
    </div>
    <div class="status-pill">
      <span class="material-symbols-sharp" style="font-size: 15px;">download</span>
      <span id="downloadCountLabel">0 Downloaded</span>
    </div>
  </div>

  <!-- Center Search Block (Yolk-style with debounced push-up) -->
  <div id="search-block">
    <div id="large-logo-wrapper" onclick="focusSearch()">
      <div class="logo-inner">
        <div class="logo-row">
          <span class="material-symbols-sharp brand-icon-large">delete_sweep</span>

        </div>
        <p class="logo-sub">Fast games, music & study tools</p>
      </div>
    </div>

    <div class="search-pill-wrapper">
      <span class="material-symbols-sharp search-pill-icon">search</span>
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Search games, music, AI..." 
        autocomplete="off" 
        spellcheck="false"
      />
      <button id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()" style="display: none;">
        <span class="material-symbols-sharp" style="font-size: 16px;">close</span>
      </button>
    </div>

    <div class="quick-pills">
      <button class="pill-chip active" id="chipAll" onclick="selectChip('all')">
        <span class="material-symbols-sharp" style="font-size: 15px;">grid_view</span>
        <span>All Games</span>
        <span class="pill-count" id="allCountBadge">0</span>
      </button>
      <button class="pill-chip" id="chipDownloaded" onclick="selectChip('downloaded')">
        <span class="material-symbols-sharp" style="font-size: 15px;">download_for_offline</span>
        <span>Downloaded</span>
        <span class="pill-count" id="dlCountBadge">0</span>
      </button>
      <button class="pill-chip" onclick="playGame('yolk/index.html', 'Yolk! - Minimalist Music')">
        <img src="yolk/yolk-circle.png" alt="" style="width: 14px; height: 14px; border-radius: 50%; object-fit: contain;">
        <span>Yolk!</span>
      </button>
      <button class="pill-chip" onclick="playGame('ai.html', 'Google Classroom AI Assistant')">
        <span class="material-symbols-sharp" style="font-size: 15px; color: #60a5fa;">psychology</span>
        <span>AI</span>
      </button>
    </div>
  </div>

  <!-- Search Results Container -->
  <main id="results-container">
    <div class="results-header">
      <span class="results-title" id="resultsCategoryLabel">All Games</span>
      <span id="resultsSummaryLabel" style="font-size: 12px; color: var(--text-dim);"></span>
    </div>

    <div id="gameList" class="game-grid"></div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <span class="material-symbols-sharp" style="font-size: 40px; color: #52525b;">search_off</span>
      <h3>No games found</h3>
      <p id="emptyStateDesc">Try searching for another keyword.</p>
    </div>
  </main>

  <!-- In-Page Player View -->
  <div id="player-view">
    <div class="player-header">
      <div class="player-header-left">
        <button class="btn-sharp" onclick="closePlayer()">
          <span class="material-symbols-sharp">arrow_back</span>
          <span>Back</span>
        </button>
        <span id="currentPlayerTitle" class="player-title">Playing</span>
      </div>

      <div class="player-header-right">
        <button class="btn-sharp" onclick="reloadPlayer()" title="Reload">
          <span class="material-symbols-sharp">refresh</span>
        </button>
        <button class="btn-sharp" onclick="toggleFullscreen()" title="Fullscreen">
          <span class="material-symbols-sharp">fullscreen</span>
        </button>
        <button class="btn-sharp" onclick="closePlayer()" title="Close">
          <span class="material-symbols-sharp">close</span>
        </button>
      </div>
    </div>

    <iframe id="gameIframe" class="player-iframe" allow="autoplay; fullscreen; camera; microphone; clipboard-read; clipboard-write; display-capture; geolocation"></iframe>
  </div>

  <script>
// IndexedDB + CacheStorage for Offline Games (Supports single-file & multi-part/asset games)
const GAME_DB_NAME = 'TrashbinGamesDB';
const GAME_DB_VERSION = 1;
const GAME_STORE_NAME = 'games';
const GAME_CACHE_NAME = 'trashbin-game-cache';
const RECOMMENDED_LIMIT_BYTES = 100 * 1024 * 1024; // 100 MB

const CDN_MIRRORS = [
    'https://cdn.jsdelivr.net',
    'https://fastly.jsdelivr.net',
    'https://quantil.jsdelivr.net',
    'https://testingcf.jsdelivr.net',
    'https://originfastly.jsdelivr.net',
    'https://gcore.jsdelivr.net'
];
let activeMirror = CDN_MIRRORS[0];

async function autoSelectMirror() {
    for (const mirror of CDN_MIRRORS) {
        try {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), 3500);
            const res = await fetch(mirror + '/gh/pinpoint-edu/assets@main/textbooks/2048.html', {
                method: 'HEAD',
                signal: ctrl.signal
            });
            clearTimeout(to);
            if (res.ok) {
                activeMirror = mirror;
                console.log('[Trashbin] Connected to CDN mirror:', activeMirror);
                return;
            }
        } catch (e) {}
    }
}

// Open IndexedDB
const gameDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(GAME_DB_NAME, GAME_DB_VERSION);
    req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(GAME_STORE_NAME)) {
            const store = db.createObjectStore(GAME_STORE_NAME, { keyPath: 'id' });
            store.createIndex('title', 'title', { unique: false });
            store.createIndex('downloadedAt', 'downloadedAt', { unique: false });
        }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => reject(req.error);
});

const activeControllers = new Map();
const activeInFlightDownloads = new Map();

// Periodic storage quota check
if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
    setInterval(async () => {
        try {
            const est = await navigator.storage.estimate();
            if (est.quota && est.usage && (est.quota - est.usage < 15 * 1024 * 1024)) {
                const all = await PinpointGameStorage.getAllGames();
                all.sort((a, b) => new Date(a.downloadedAt) - new Date(b.downloadedAt));
                if (all.length > 0) {
                    const item = all[0];
                    await PinpointGameStorage.deleteGame(item.id, item.fileUrl);
                }
            }
        } catch(e) {}
    }, 20000);
}

const PinpointGameStorage = {
    RECOMMENDED_LIMIT_BYTES,

    getManifest(fileUrl) {
        if (/^https?:\/\//i.test(fileUrl)) return [fileUrl];
        const norm = fileUrl.replace(/^\/+/, '');
        if (GAME_MANIFESTS[norm]) return GAME_MANIFESTS[norm];
        if (norm.endsWith('/index.html') && GAME_MANIFESTS[norm.replace('/index.html', '/')]) {
            return GAME_MANIFESTS[norm.replace('/index.html', '/')];
        }
        if (norm.endsWith('/') && GAME_MANIFESTS[norm + 'index.html']) {
            return GAME_MANIFESTS[norm + 'index.html'];
        }
        if (!norm.endsWith('/') && !norm.endsWith('.html') && GAME_MANIFESTS[norm + '/index.html']) {
            return GAME_MANIFESTS[norm + '/index.html'];
        }
        return ['/' + norm];
    },

    async isDownloaded(id) {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(!!req.result);
                req.onerror = () => resolve(false);
            });
        } catch(e) { return false; }
    },

    async getGame(id) {
        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readonly');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    },

    async getAllGames() {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        } catch(e) { return []; }
    },

    async downloadGame(id, title, fileUrl, onProgress) {
        if (activeControllers.has(id)) {
            throw new Error('Download already in progress');
        }

        const controller = new AbortController();
        activeControllers.set(id, controller);
        activeInFlightDownloads.set(id, fileUrl);

        const assets = this.getManifest(fileUrl);
        let cache = null;
        if (typeof caches !== 'undefined') {
            try {
                cache = await caches.open(GAME_CACHE_NAME);
            } catch(e) {
                console.warn('CacheStorage not accessible:', e);
            }
        }

        let totalBytes = 0;
        let mainContent = '';
        let completedAssets = 0;

        try {
            for (let i = 0; i < assets.length; i++) {
                const assetUrl = assets[i];
                if (controller.signal.aborted) {
                    const err = new Error('Download cancelled');
                    err.name = 'AbortError';
                    throw err;
                }

                const clean = assetUrl.replace(/^\/+/, '');
                // Skip directories (cannot be fetched directly as files over HTTP)
                if (!clean || clean.endsWith('/')) {
                    completedAssets++;
                    continue;
                }

                let candidateUrls = [];
                if (/^https?:\/\//i.test(assetUrl)) {
                    let mirrorUrl = assetUrl;
                    if (assetUrl.includes('jsdelivr.net')) {
                        mirrorUrl = assetUrl.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//i, activeMirror + '/');
                    }
                    candidateUrls = [mirrorUrl, assetUrl];
                } else {
                    const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];
                    candidateUrls = [
                        ...mirrors.map(m => m + '/gh/pinpoint-edu/assets@main/' + clean),
                        'https://cdn.statically.io/gh/pinpoint-edu/assets@main/' + clean,
                        'https://raw.githubusercontent.com/pinpoint-edu/assets/main/' + clean
                    ];
                }

                let res = null;
                for (const url of candidateUrls) {
                    try {
                        const r = await fetch(url, { signal: controller.signal });
                        if (r.ok) {
                            const checkCl = r.headers.get('content-length');
                            if (checkCl && parseInt(checkCl, 10) < 300 && clean.endsWith('.html')) {
                                const previewText = await r.clone().text();
                                if (previewText.includes('Package size exceeded') || previewText.includes('limit of 20 MB')) continue;
                            }
                            res = r;
                            for (const m of CDN_MIRRORS) {
                                if (url.startsWith(m)) {
                                    activeMirror = m;
                                    break;
                                }
                            }
                            break;
                        }
                    } catch(e) {}
                }

                if (!res) {
                    throw new Error(`Failed to download ${clean} from CDN mirrors.`);
                }

                const contentLength = parseInt(res.headers.get('content-length') || '0', 10);
                let assetBlob;

                if (res.body && typeof res.body.getReader === 'function' && contentLength > 0) {
                    const reader = res.body.getReader();
                    const chunks = [];
                    let receivedBytes = 0;

                    while (true) {
                        if (controller.signal.aborted) {
                            reader.cancel().catch(() => {});
                            const err = new Error('Download cancelled');
                            err.name = 'AbortError';
                            throw err;
                        }
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        receivedBytes += value.length;
                        totalBytes += value.length;

                        if (typeof onProgress === 'function') {
                            const assetPart = (receivedBytes / contentLength) / assets.length;
                            const overallPercent = Math.min(99, Math.round(((completedAssets / assets.length) + assetPart) * 100));
                            onProgress({
                                percent: overallPercent,
                                loaded: receivedBytes,
                                total: contentLength,
                                assetIndex: i + 1,
                                assetTotal: assets.length
                            });
                        }
                    }

                    assetBlob = new Blob(chunks, { type: res.headers.get('content-type') || 'application/octet-stream' });
                } else {
                    assetBlob = await res.blob();
                    totalBytes += assetBlob.size;
                }

                if (i === 0 && (clean.endsWith('.html') || clean.endsWith('/'))) {
                    mainContent = await assetBlob.text();
                }

                if (cache) {
                    const cacheUrls = [
                        assetUrl,
                        new URL(assetUrl, window.location.href).href,
                        clean,
                        '/' + clean
                    ];
                    for (const cu of cacheUrls) {
                        try {
                            await cache.put(cu, new Response(assetBlob.slice(), {
                                headers: {
                                    'Content-Type': res.headers.get('content-type') || 'application/octet-stream',
                                    'Content-Length': assetBlob.size.toString()
                                }
                            }));
                        } catch(ce) {}
                    }
                }

                completedAssets++;
                if (typeof onProgress === 'function') {
                    const overallPercent = Math.min(99, Math.round((completedAssets / assets.length) * 100));
                    onProgress({
                        percent: overallPercent,
                        assetIndex: completedAssets,
                        assetTotal: assets.length
                    });
                }
            }

            if (typeof onProgress === 'function') {
                onProgress({ percent: 100, assetIndex: assets.length, assetTotal: assets.length });
            }

            const db = await gameDbPromise;
            const record = await new Promise((resolve, reject) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
                const store = tx.objectStore(GAME_STORE_NAME);
                const gameRecord = {
                    id: id,
                    title: title,
                    fileUrl: fileUrl,
                    content: mainContent,
                    assets: assets,
                    sizeBytes: totalBytes,
                    downloadedAt: new Date().toISOString()
                };
                const req = store.put(gameRecord);
                req.onsuccess = () => resolve(gameRecord);
                req.onerror = () => reject(req.error);
            });

            return record;

        } catch (downloadErr) {
            try {
                await this.deleteGame(id, fileUrl);
            } catch (cleanupErr) {
                console.warn('Cleanup error after failed download:', cleanupErr);
            }
            throw downloadErr;
        } finally {
            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
        }
    },

    async deleteGame(id, fileUrl) {
        if (typeof caches !== 'undefined') {
            try {
                const cache = await caches.open(GAME_CACHE_NAME);
                const assets = fileUrl ? this.getManifest(fileUrl) : [];
                for (const assetUrl of assets) {
                    const delKeys = [
                        assetUrl,
                        new URL(assetUrl, window.location.href).href,
                        assetUrl.replace(/^\/+/, ''),
                        decodeURIComponent(assetUrl),
                        encodeURI(assetUrl)
                    ];
                    if (assetUrl.endsWith('/index.html')) {
                        const dirPath = assetUrl.replace(/index\.html$/, '');
                        delKeys.push(dirPath, '/' + dirPath.replace(/^\/+/, ''));
                    }
                    for (const k of delKeys) {
                        await cache.delete(k);
                    }
                }
            } catch(e) {}
        }

        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.delete(id);
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
        });
    },

    cancelDownload(id) {
        if (activeControllers.has(id)) {
            activeControllers.get(id).abort();
            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
        }
    },

    isDownloading(id) {
        return activeControllers.has(id);
    }
};

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function prepareGameHtml(html, fileUrl) {
  let base = fileUrl.replace(/[^/]*$/, '');
  if (!base.endsWith('/')) base += '/';

  let repoBase = base;
  const mRepo = base.match(/^(https?:\/\/[^/]+\/(?:gh\/[^/]+\/[^/@]+@[^/]+\/|[^/]+\/[^/]+\/[^/]+\/))/i);
  if (mRepo) {
    repoBase = mRepo[1];
  }

  const lower = html.toLowerCase();
  const firstScript = lower.indexOf('<script');
  const firstHead = lower.indexOf('<head');
  const hasRealHead = firstHead !== -1 && (firstScript === -1 || firstHead < firstScript);

  // 1. Inject or update <base href="...">
  const mBase = html.match(/(<base\b[^>]*\bhref\s*=\s*)(['"])(.*?)\2/i);
  if (mBase) {
    const existingHref = mBase[3];
    if (existingHref.startsWith('/') || existingHref.startsWith('./') || !existingHref.includes('://')) {
      html = html.replace(/(<base\b[^>]*\bhref\s*=\s*)(['"])(.*?)\2/i, '$1$2' + base + '$2');
    }
  } else if (hasRealHead) {
    html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
  } else {
    html = '<base href="' + base + '">' + html;
  }

  // 2. Inject frame viewport style and runtime fetch/XHR interceptor
  const frameStyle = '<style>html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#000;}.webgl-content,#gameContainer,#canvas{width:100%;height:100%;}</style>';
  const interceptScript = '<scr' + 'ipt>(function(){' +
    'var b=' + JSON.stringify(base) + ';' +
    'var rb=' + JSON.stringify(repoBase) + ';' +
    'function fix(u){if(typeof u!=="string")return u;if(u.indexOf("/textbooks/")===0)return rb+u.slice(1);if(u.indexOf("/assets/")===0)return b+u.slice(1);return u;}' +
    'if(typeof window.fetch!=="undefined"){var _f=window.fetch;window.fetch=function(inp,init){if(typeof inp==="string")inp=fix(inp);else if(inp&&inp.url)inp=new Request(fix(inp.url),inp);return _f.call(this,inp,init);};}' +
    'if(typeof XMLHttpRequest!=="undefined"){var _o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){arguments[1]=fix(u);return _o.apply(this,arguments);};}' +
    '})();</scr' + 'ipt>';

  if (hasRealHead) {
    html = html.replace(/<head([^>]*)>/i, '<head$1>' + interceptScript + frameStyle);
  } else {
    html = interceptScript + frameStyle + html;
  }

  // 3. Resolve root-relative paths in HTML attributes
  html = html.replace(/(\s(?:src|href))=(['"])\/(?!\/)/gi, '$1=$2' + repoBase);

  // 4. Normalize jsdelivr mirror domains to current active mirror
  html = html.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//g, activeMirror + '/');

  return html;
}

function writeGameIntoFrame(iframe, rawHtml, fileUrl) {
  const preparedHtml = prepareGameHtml(rawHtml, fileUrl);
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(preparedHtml);
  doc.close();
  try {
    iframe.contentWindow.focus();
  } catch(e) {}
}

async function fetchGameHtml(file) {
  if (/^https?:\/\//i.test(file)) {
    let mirrorUrl = file;
    if (file.includes('jsdelivr.net')) {
      mirrorUrl = file.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//i, activeMirror + '/');
    }
    try {
      const res = await fetch(mirrorUrl);
      if (res.ok) {
        const text = await res.text();
        return { html: text, resolvedUrl: mirrorUrl };
      }
    } catch(e) {}
    const res2 = await fetch(file);
    if (res2.ok) {
      const text = await res2.text();
      return { html: text, resolvedUrl: file };
    }
    throw new Error('Could not fetch game from ' + file);
  }

  const cleanPath = file.replace(/^\/+/, '');
  let fetchFile = cleanPath;
  if (fetchFile.endsWith('/')) {
    fetchFile += 'index.html';
  }

  const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];
  const urlsToTry = [
    ...mirrors.map(m => m + '/gh/pinpoint-edu/assets@main/' + fetchFile),
    'https://cdn.statically.io/gh/pinpoint-edu/assets@main/' + fetchFile,
    'https://raw.githubusercontent.com/pinpoint-edu/assets/main/' + fetchFile
  ];

  for (const url of urlsToTry) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const text = await res.text();
      if (text.includes('Package size exceeded') || text.includes('limit of 20 MB') || text.includes('404: Not Found') || text.trim().startsWith('{"status": 4')) {
        continue;
      }
      for (const m of CDN_MIRRORS) {
        if (url.startsWith(m)) {
          activeMirror = m;
          break;
        }
      }
      return { html: text, resolvedUrl: url };
    } catch(e) {
      continue;
    }
  }
  throw new Error('Could not fetch game from any CDN mirror.');
}

// Play Game in the In-Page Player
async function playGame(encodedFile, encodedTitle) {
  const file = decodeURIComponent(encodedFile);
  const title = decodeURIComponent(encodedTitle);
  const id = getGameId(file);

  currentPlayingFile = file;
  document.getElementById('currentPlayerTitle').textContent = title;
  document.getElementById('player-view').style.display = 'flex';

  const iframe = document.getElementById('gameIframe');

  // Direct iframe navigation for standalone apps or embedded external players
  if (file.startsWith('yolk/') || file === 'ai.html' || file.startsWith('pages/') || file.includes('scratch.mit.edu')) {
    iframe.removeAttribute('srcdoc');
    iframe.src = file;
    try { iframe.contentWindow.focus(); } catch(e) {}
    return;
  }

  // 1. Check if game is saved offline in IndexedDB
  if (typeof PinpointGameStorage !== 'undefined') {
    try {
      const record = await PinpointGameStorage.getGame(id);
      if (record && record.content && record.content.length > 50) {
        writeGameIntoFrame(iframe, record.content, activeMirror + '/gh/pinpoint-edu/assets@main/' + file);
        return;
      }
    } catch(e) {}
  }

  // 2. Show loading spinner while fetching
  iframe.removeAttribute('src');
  iframe.srcdoc = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </head>
    <body>
      <div class="spinner"></div>
      <div style="font-size: 14px; letter-spacing: 0.5px;">Loading ${title}...</div>
    </body>
    </html>
  `;

  // 3. Fetch game HTML and inject via doc.write
  try {
    const { html, resolvedUrl } = await fetchGameHtml(file);
    writeGameIntoFrame(iframe, html, resolvedUrl);
  } catch (err) {
    console.error('Play game error:', err);
    iframe.srcdoc = `
      <!DOCTYPE html>
      <html>
      <head>
        <style>
          body { background: #000; color: #ef4444; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        </style>
      </head>
      <body>
        <h3 style="margin-bottom: 8px;">Failed to Load Game</h3>
        <p style="color: #888; font-size: 14px;">${err.message}</p>
      </body>
      </html>
    `;
  }
}

// Download Game for Offline
async function startDownload(id, encodedTitle, encodedFile) {
  const title = decodeURIComponent(encodedTitle);
  const file = decodeURIComponent(encodedFile);

  if (typeof PinpointGameStorage === 'undefined') {
    alert('Offline storage database is not available.');
    return;
  }

  if (PinpointGameStorage.isDownloading(id)) {
    return;
  }

  activeProgressMap.set(id, 0);
  renderGames();

  try {
    await PinpointGameStorage.downloadGame(id, title, file, (progress) => {
      activeProgressMap.set(id, progress.percent || 0);
      const card = document.getElementById('card-' + id);
      if (card) {
        const fill = card.querySelector('.progress-bar-fill');
        if (fill) fill.style.width = (progress.percent || 0) + '%';
        const badge = card.querySelector('.badge-progress');
        if (badge) badge.innerHTML = `<span class="material-symbols-sharp" style="font-size: 13px; animation: spin 1s linear infinite;">sync</span> ${progress.percent}%`;
      }
    });

    activeProgressMap.delete(id);
    downloadedGameIds.add(id);
    updateCounts();
    renderGames();
  } catch (err) {
    activeProgressMap.delete(id);
    console.error('Download error:', err);
    if (err.name !== 'AbortError') {
      alert('Failed to download ' + title + ': ' + err.message);
    }
    renderGames();
  }
}

function cancelDownload(id) {
  if (typeof PinpointGameStorage !== 'undefined') {
    PinpointGameStorage.cancelDownload(id);
  }
  activeProgressMap.delete(id);
  renderGames();
}

async function deleteGame(id, encodedFile, encodedTitle) {
  const file = decodeURIComponent(encodedFile);
  const title = decodeURIComponent(encodedTitle);

  if (!confirm(`Remove "${title}" from Downloaded games?`)) {
    return;
  }

  if (typeof PinpointGameStorage !== 'undefined') {
    try {
      await PinpointGameStorage.deleteGame(id, file);
    } catch(e) {
      console.warn('Delete error:', e);
    }
  }

  downloadedGameIds.delete(id);
  updateCounts();
  renderGames();
}

      const res = await fetch('games.json');
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          games = data;
        }
      }
    } catch(e) {
      console.log('[Trashbin] Using default embedded games list');
    }
  } else {
    console.log('[Trashbin] Running locally, using default embedded games list');
  }

  updateOnlineStatus();
  await syncDownloadedStatus();
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('player-view').style.display === 'flex') {
      closePlayer();
    } else if (document.body.classList.contains('is-searching')) {
      resetToCenterHome();
    }
  }
});

initGames();
  </script>
</body>
</html>
