// Live Clock with Seconds
function updateClockDisplay() {
  const now = new Date();
  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  hours = hours ? hours : 12;
  const timeStr = `${hours}:${minutes}:${seconds} ${ampm}`;

  const playerLiveTime = document.getElementById('playerLiveTime');
  if (playerLiveTime) playerLiveTime.textContent = timeStr;

  const modalClockTime = document.getElementById('modalClockTime');
  if (modalClockTime) modalClockTime.textContent = timeStr;

  const modalClockDate = document.getElementById('modalClockDate');
  if (modalClockDate) {
    modalClockDate.textContent = now.toLocaleDateString(undefined, {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  }
}

// Device Battery Monitor
async function queryBattery() {
  if ('getBattery' in navigator) {
    try {
      const battery = await navigator.getBattery();
      renderBattery(battery);

      battery.onlevelchange = () => renderBattery(battery);
      battery.onchargingchange = () => renderBattery(battery);
      battery.onchargingtimechange = () => renderBattery(battery);
      battery.ondischargingtimechange = () => renderBattery(battery);
    } catch (e) {
      renderBatteryFallback();
    }
  } else {
    renderBatteryFallback();
  }
}

function renderBattery(battery) {
  const pct = Math.round(battery.level * 100);
  const isCharging = battery.charging;

  const percentEl = document.getElementById('batteryPercentText');
  const statusEl = document.getElementById('batteryStatusText');
  const barFill = document.getElementById('batteryBarFill');
  const iconEl = document.getElementById('batteryIcon');
  const extraEl = document.getElementById('batteryExtraDetails');

  if (percentEl) percentEl.textContent = pct + '%';
  if (barFill) barFill.style.width = pct + '%';

  if (isCharging) {
    if (iconEl) {
      iconEl.textContent = 'battery_charging_full';
      iconEl.style.color = '#22c55e';
    }
    if (barFill) barFill.style.background = '#22c55e';
    if (statusEl) {
      statusEl.textContent = 'Charging (Plugged In)';
      statusEl.style.color = '#22c55e';
    }
    if (extraEl) {
      if (battery.chargingTime && isFinite(battery.chargingTime) && battery.chargingTime > 0) {
        const mins = Math.ceil(battery.chargingTime / 60);
        extraEl.textContent = `⚡ ~${mins} minutes until full charge`;
      } else {
        extraEl.textContent = '⚡ Connected to power supply';
      }
    }
  } else {
    let iconName = 'battery_full';
    let iconColor = '#ffffff';
    let barColor = '#ffffff';

    if (pct <= 10) {
      iconName = 'battery_alert';
      iconColor = '#ef4444';
      barColor = '#ef4444';
    } else if (pct <= 20) {
      iconName = 'battery_1_bar';
      iconColor = '#f97316';
      barColor = '#f97316';
    } else if (pct <= 40) {
      iconName = 'battery_3_bar';
      iconColor = '#eab308';
      barColor = '#eab308';
    } else if (pct <= 60) {
      iconName = 'battery_4_bar';
    } else if (pct <= 80) {
      iconName = 'battery_5_bar';
    } else {
      iconName = 'battery_full';
    }

    if (iconEl) {
      iconEl.textContent = iconName;
      iconEl.style.color = iconColor;
    }
    if (barFill) barFill.style.background = barColor;
    if (statusEl) {
      statusEl.textContent = pct <= 20 ? 'Low Battery — On Battery Power' : 'On Battery Power';
      statusEl.style.color = pct <= 20 ? iconColor : '#a1a1aa';
    }
    if (extraEl) {
      if (battery.dischargingTime && isFinite(battery.dischargingTime) && battery.dischargingTime > 0) {
        const hours = Math.floor(battery.dischargingTime / 3600);
        const mins = Math.ceil((battery.dischargingTime % 3600) / 60);
        extraEl.textContent = `⏱ ~${hours > 0 ? hours + 'h ' : ''}${mins}m remaining`;
      } else {
        extraEl.textContent = '';
      }
    }
  }
}

function renderBatteryFallback() {
  const percentEl = document.getElementById('batteryPercentText');
  const statusEl = document.getElementById('batteryStatusText');
  const barFill = document.getElementById('batteryBarFill');
  const iconEl = document.getElementById('batteryIcon');
  const extraEl = document.getElementById('batteryExtraDetails');

  if (percentEl) percentEl.textContent = '--';
  if (statusEl) {
    statusEl.textContent = 'Battery info unavailable';
    statusEl.style.color = '#a1a1aa';
  }
  if (iconEl) {
    iconEl.textContent = 'battery_unknown';
    iconEl.style.color = '#71717a';
  }
  if (barFill) {
    barFill.style.width = '100%';
    barFill.style.background = '#27272a';
  }
  if (extraEl) {
    extraEl.textContent = 'Battery Status API not permitted on this browser.';
  }
}

// Player Download Button State Manager
function updatePlayerDownloadBtn() {
  const btn = document.getElementById('playerDownloadBtn');
  const icon = document.getElementById('playerDownloadIcon');
  if (!btn || !icon) return;

  if (!currentPlayingFile) {
    btn.style.display = 'none';
    return;
  }

  const id = getGameId(currentPlayingFile);
  const isDownloaded = downloadedGameIds.has(id);
  const isDownloading = typeof PinpointGameStorage !== 'undefined' && PinpointGameStorage.isDownloading(id);
  const progress = activeProgressMap.get(id);

  if (currentPlayingFile.startsWith('yolk/') || currentPlayingFile === 'ai.html' || currentPlayingFile.startsWith('pages/') || currentPlayingFile.includes('scratch.mit.edu')) {
    btn.style.display = 'none';
    return;
  }
  btn.style.display = 'inline-flex';

  if (isDownloaded) {
    icon.textContent = 'check_circle';
    icon.style.color = '#34d399';
    icon.style.animation = '';
    btn.title = 'Downloaded for Offline';
  } else if (isDownloading) {
    icon.textContent = 'sync';
    icon.style.color = '#60a5fa';
    icon.style.animation = 'spin 1s linear infinite';
    btn.title = `Downloading... ${progress !== undefined ? progress + '%' : ''}`;
  } else {
    icon.textContent = 'download';
    icon.style.color = '';
    icon.style.animation = '';
    btn.title = 'Download for Offline';
  }
}

async function downloadCurrentGame() {
  if (!currentPlayingFile || !currentPlayingTitle) return;
  const id = getGameId(currentPlayingFile);
  if (downloadedGameIds.has(id)) {
    return;
  }
  await startDownload(id, encodeURIComponent(currentPlayingTitle), encodeURIComponent(currentPlayingFile));
}

// Download Game for Offline
async function startDownload(id, encodedTitle, encodedFile) {
  const title = decodeURIComponent(encodedTitle);
  const file = decodeURIComponent(encodedFile);

  if (typeof PinpointGameStorage === 'undefined') {
    alert('Offline storage database is not available.');
    return;
  }

  if (PinpointGameStorage.isDownloading(id)) {
    return;
  }

  activeProgressMap.set(id, 0);
  renderGames();
  updatePlayerDownloadBtn();

  try {
    await PinpointGameStorage.downloadGame(id, title, file, (progress) => {
      activeProgressMap.set(id, progress.percent || 0);
      const card = document.getElementById('card-' + id);
      if (card) {
        const fill = card.querySelector('.progress-bar-fill');
        if (fill) fill.style.width = (progress.percent || 0) + '%';
        const badge = card.querySelector('.badge-progress');
        if (badge) badge.innerHTML = `<span class="material-symbols-sharp" style="font-size: 13px; animation: spin 1s linear infinite;">sync</span> ${progress.percent}%`;
      }
      updatePlayerDownloadBtn();
    });

    activeProgressMap.delete(id);
    downloadedGameIds.add(id);
    updateCounts();
    renderGames();
    updatePlayerDownloadBtn();
  } catch (err) {
    activeProgressMap.delete(id);
    console.error('Download error:', err);
    if (err.name !== 'AbortError') {
      alert('Failed to download ' + title + ': ' + err.message);
    }
    renderGames();
    updatePlayerDownloadBtn();
  }
}

function cancelDownload(id) {
  if (typeof PinpointGameStorage !== 'undefined') {
    PinpointGameStorage.cancelDownload(id);
  }
  activeProgressMap.delete(id);
  renderGames();
  updatePlayerDownloadBtn();
}

async function deleteGame(id, encodedFile, encodedTitle) {
  const file = decodeURIComponent(encodedFile);
  const title = decodeURIComponent(encodedTitle);

  if (!confirm(`Remove "${title}" from Downloaded games?`)) {
    return;
  }

  if (typeof PinpointGameStorage !== 'undefined') {
    try {
      await PinpointGameStorage.deleteGame(id, file);
    } catch(e) {
      console.warn('Delete error:', e);
    }
  }

  downloadedGameIds.delete(id);
  updateCounts();
  renderGames();
  updatePlayerDownloadBtn();
}

function updateOnlineStatus() {
  const isOnline = navigator.onLine;
  const statusEl = document.getElementById('connectionStatus');
  const textEl = document.getElementById('connectionText');

  if (statusEl && textEl) {
    if (isOnline) {
      statusEl.className = 'status-pill online';
      textEl.textContent = 'Online';
    } else {
      statusEl.className = 'status-pill offline';
      textEl.textContent = 'Offline';
    }
  }
}

window.addEventListener('online', updateOnlineStatus);

async function initGames() {
  await autoSelectMirror();
  if (location.protocol !== 'file:') {
    try {
      const res = await fetch('games.json');
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          games = data;

      console.log('[Trashbin] Using default embedded games list');

  } else {

  updateOnlineStatus();
  await syncDownloadedStatus();

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const statusModal = document.getElementById('status-modal-overlay');
    if (statusModal && statusModal.style.display === 'flex') {

});
