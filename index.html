<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashbin</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z'/></svg>">

  <!-- Google Fonts: Geist, Libre Baskerville, and Material Symbols Sharp -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border: #27272a;
      --border-hover: #3f3f46;
      --border-focus: #ffffff;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #ffffff;
      --success: #22c55e;
      --danger: #ef4444;
      --parabola-ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      position: relative;
    }

    /* Headings and Big Text use Libre Baskerville */
    h1, h2, h3, h4, .logo-title, .brand-name, .player-title, .results-title, #smallLogo span {
      font-family: 'Libre Baskerville', Georgia, serif;
      letter-spacing: -0.02em;
    }

    /* Google Material Symbols Sharp */
    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Top Left Small Logo (reveals when searching) */
    #smallLogo {
      position: fixed;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s var(--parabola-ease), transform 0.35s var(--parabola-ease);
      transform: translateY(-4px);
      z-index: 50;
      text-decoration: none;
    }

    body.is-searching #smallLogo {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #smallLogo .brand-icon {
      font-size: 24px;
      color: #ffffff;
    }

    /* Top Right Header Badges */
    .top-header-right {
      position: fixed;
      top: 24px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .status-pill.online .dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .status-pill.offline .dot {
      width: 7px;
      height: 7px;
      background: #f59e0b;
      border-radius: 50%;
    }

    /* Central Search Block */
    #search-block {
      position: fixed;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 620px;
      padding: 0 20px;
      z-index: 40;
      box-sizing: border-box;
      transition: top 0.6s var(--parabola-ease), 
                  transform 0.6s var(--parabola-ease);
    }

    body.is-searching #search-block {
      top: 20px;
      transform: translate(-50%, 0);
    }

    body.is-searching .quick-pills {
      margin-top: 10px;
    }

    /* Large Logo above Search Bar */
    #large-logo-wrapper {
      opacity: 1;
      height: 120px;
      transition: opacity 0.35s ease-out, height 0.35s ease-out, margin 0.35s ease-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      cursor: pointer;
    }

    body.is-searching #large-logo-wrapper {
      opacity: 0;
      height: 0;
      margin-bottom: 0 !important;
      overflow: hidden;
      pointer-events: none;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon-large {
      font-size: 44px;
      color: #ffffff;
      filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.25));
    }

    .logo-title {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #ffffff;
    }

    .logo-sub {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: -0.2px;
    }

    /* Center Pill Search Bar */
    .search-pill-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-pill-icon {
      position: absolute;
      left: 20px;
      font-size: 22px;
      color: var(--text-dim);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    #searchInput {
      width: 100%;
      height: 56px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 0 130px 0 54px;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      transition: all 0.25s var(--parabola-ease);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    #searchInput:focus {
      background: #18181b;
      border-color: #ffffff;
      box-shadow: 0 0 0 1px #ffffff, 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    #searchInput::placeholder {
      color: var(--text-dim);
    }

    .search-right-actions {
      position: absolute;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-search-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #27272a;
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clear-search-btn:hover {
      background: #3f3f46;
      transform: scale(1.05);
    }

    .search-browse-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      height: 32px;
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 11px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      white-space: nowrap;
    }

    .search-browse-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: translateY(-1px);
    }

    .search-browse-btn:active {
      transform: scale(0.96);
    }

    /* Quick Filter Chips (Squircles) */
    .quick-pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .pill-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-chip:hover {
      background: var(--bg-card);
      border-color: #52525b;
      color: #ffffff;
    }

    .pill-chip.active {
      background: #ffffff;
      border-color: #ffffff;
      color: #000000;
    }

    .pill-chip.active .pill-count {
      background: #e4e4e7;
      color: #000000;
    }

    .pill-count {
      font-size: 11px;
      padding: 2px 7px;
      background: #27272a;
      border-radius: 8px;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Results Container: Pinned & Non-scrolling Page, with Internal Game List Scroll */
    #results-container {
      position: fixed;
      top: 136px;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease-out, top 0.25s ease;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      z-index: 30;
      min-height: 0;
    }

    body.is-searching #results-container {
      opacity: 1;
      pointer-events: auto;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .results-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-dim);
    }

    /* Game Cards Grid (scrolls internally) */
    .game-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scrollbar-width: thin;
      scrollbar-color: #27272a transparent;
    }

    .game-grid::-webkit-scrollbar {
      width: 6px;
    }
    .game-grid::-webkit-scrollbar-track {
      background: transparent;
    }
    .game-grid::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 10px;
    }
    .game-grid::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
    .game-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .game-card:hover {
      background: var(--bg-card);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .game-left {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
    }

    .game-details {
      min-width: 0;
      flex: 1;
    }

    .game-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .game-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .badge-dl {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-size: 11px;
      font-weight: 600;
      color: var(--success);
    }

    .badge-progress {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
    }

    .progress-bar-wrap {
      width: 100%;
      max-width: 180px;
      height: 4px;
      background: #27272a;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-bar-fill {
      height: 100%;
      background: #ffffff;
      width: 0%;
      transition: width 0.2s ease;
    }

    /* Squircle Buttons */
    .game-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-sharp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 11px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
      background: #18181b;
      color: #fafafa;
    }

    .btn-sharp:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn-primary-sharp {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
    }

    .btn-primary-sharp:hover {
      background: #e4e4e7;
      color: #000000;
    }

    .btn-icon-sharp {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: #18181b;
      border: 1px solid var(--border);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon-sharp:hover {
      background: #27272a;
      border-color: var(--border-hover);
      color: var(--danger);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state h3 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 12px;
    }

    .empty-state p {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 4px;
    }

    /* In-Page Player View */
    #player-view {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      flex-direction: column;
    }

    .player-header {
      height: 54px;
      background: #09090b;
      border-bottom: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
    }

    .player-header-left, .player-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .player-header-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .player-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    /* Small Squircle Buttons */
    .player-btn-squircle {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #18181b;
      border: 1px solid #27272a;
      color: #fafafa;
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
      flex-shrink: 0;
      outline: none;
    }

    .player-btn-squircle:hover {
      background: #27272a;
      border-color: #3f3f46;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .player-btn-squircle:active {
      transform: scale(0.94);
      background: #3f3f46;
    }

    .player-btn-squircle .material-symbols-sharp {
      font-size: 20px;
    }

    /* Player Time Squircle */
    .player-time-squircle {
      height: 36px;
      padding: 0 12px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #18181b;
      border: 1px solid #27272a;
      color: #fafafa;
      font-family: 'Geist', monospace, sans-serif;
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      user-select: none;
    }

    .player-time-squircle:hover {
      background: #27272a;
      border-color: #52525b;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .player-time-squircle:active {
      transform: scale(0.96);
    }

    /* Status & Battery Fullscreen Viewer */
    .status-fullscreen-overlay {
      position: fixed;
      inset: 0;
      background: #09090b;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      box-sizing: border-box;
      animation: fadeInStatus 0.2s ease-out;
    }

    @keyframes fadeInStatus {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .status-fullscreen-close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #18181b;
      border: 1px solid #27272a;
      color: #fafafa;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .status-fullscreen-close-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: translateY(-1px);
    }

    .status-fullscreen-content {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .status-top-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 12px;
      background: #18181b;
      border: 1px solid #27272a;
      font-size: 13px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 24px;
    }

    .fullscreen-clock-time {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(48px, 9vw, 84px);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1.5px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .fullscreen-clock-date {
      color: #a1a1aa;
      font-size: clamp(15px, 2.5vw, 19px);
      margin-top: 12px;
      margin-bottom: 36px;
      font-weight: 500;
    }

    .status-battery-card {
      width: 100%;
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 24px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      margin-bottom: 28px;
    }

    .status-fullscreen-actions {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .status-fullscreen-actions .status-action-btn {
      flex: 1;
      height: 48px;
      font-size: 15px;
      border-radius: 12px;
    }

    .battery-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .battery-info-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .battery-icon {
      font-size: 28px;
      color: #ffffff;
      transition: color 0.3s ease;
    }

    .battery-text-col {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .battery-label {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .battery-status-sub {
      font-size: 12px;
      color: #a1a1aa;
      margin-top: 2px;
      transition: color 0.3s ease;
    }

    .battery-percent-value {
      font-family: 'Geist', monospace, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .battery-bar-container {
      width: 100%;
      height: 8px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
    }

    .battery-bar-fill {
      height: 100%;
      background: #ffffff;
      border-radius: 999px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .battery-extra-details {
      font-size: 11px;
      color: #71717a;
      margin-top: 8px;
      text-align: left;
    }

    .status-card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-action-btn {
      width: 100%;
      height: 42px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid #27272a;
      background: #18181b;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .status-action-btn:hover {
      background: #27272a;
      border-color: #3f3f46;
    }

    .status-action-btn.primary {
      background: #ffffff;

    /* Fake Resuming Loading Screen */
    .fake-resuming-overlay {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fake-resuming-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .fake-resuming-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px 40px;

      transform: scale(0.96);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fake-resuming-overlay.active .fake-resuming-card {
      transform: scale(1);
    }

    .resuming-spinner {
      width: 38px;
      height: 38px;
      border: 3px solid #27272a;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .resuming-text {
      font-size: 17px;
      font-weight: 600;
      color: #fafafa;
      letter-spacing: -0.01em;
    }

    .resuming-sub {
      font-size: 13px;
      color: #71717a;
      margin-top: -8px;
    }

    /* Toast Notifications */
    .trashbin-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trashbin-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;

    .trashbin-toast.success {
      border-color: #22c55e;

// IndexedDB + CacheStorage for Offline Games (Supports single-file & multi-part/asset games)
const GAME_DB_NAME = 'TrashbinGamesDB';

const CDN_MIRRORS = [
    'https://cdn.jsdelivr.net',

];
let activeMirror = CDN_MIRRORS[0];

async function autoSelectMirror() {
    for (const mirror of CDN_MIRRORS) {
        try {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), 3500);
            const res = await fetch(mirror + '/gh/pinpoint-edu/assets@main/textbooks/2048.html', {
                method: 'HEAD',
                signal: ctrl.signal
            });
            clearTimeout(to);
            if (res.ok) {
                activeMirror = mirror;
                console.log('[Trashbin] Connected to CDN mirror:', activeMirror);
                return;
            }
        } catch (e) {}
    }
}

// Open IndexedDB
const gameDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(GAME_DB_NAME, GAME_DB_VERSION);
    req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(GAME_STORE_NAME)) {
            const store = db.createObjectStore(GAME_STORE_NAME, { keyPath: 'id' });
            store.createIndex('title', 'title', { unique: false });
            store.createIndex('downloadedAt', 'downloadedAt', { unique: false });
        }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => reject(req.error);
});

const activeControllers = new Map();
const activeInFlightDownloads = new Map();

// Periodic storage quota check
if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
    setInterval(async () => {
        try {
            const est = await navigator.storage.estimate();
            if (est.quota && est.usage && (est.quota - est.usage < 15 * 1024 * 1024)) {
                const all = await PinpointGameStorage.getAllGames();
                all.sort((a, b) => new Date(a.downloadedAt) - new Date(b.downloadedAt));
                if (all.length > 0) {
                    const item = all[0];
                    await PinpointGameStorage.deleteGame(item.id, item.fileUrl);
                }
            }
        } catch(e) {}
    }, 20000);
}

const PinpointGameStorage = {
    RECOMMENDED_LIMIT_BYTES,

    getManifest(fileUrl) {
        if (/^https?:\/\//i.test(fileUrl)) return [fileUrl];
        const norm = fileUrl.replace(/^\/+/, '');
        if (GAME_MANIFESTS[norm]) return GAME_MANIFESTS[norm];
        if (norm.endsWith('/index.html') && GAME_MANIFESTS[norm.replace('/index.html', '/')]) {
            return GAME_MANIFESTS[norm.replace('/index.html', '/')];
        }
        if (norm.endsWith('/') && GAME_MANIFESTS[norm + 'index.html']) {
            return GAME_MANIFESTS[norm + 'index.html'];
        }
        if (!norm.endsWith('/') && !norm.endsWith('.html') && GAME_MANIFESTS[norm + '/index.html']) {
            return GAME_MANIFESTS[norm + '/index.html'];
        }
        return ['/' + norm];
    },

    async isDownloaded(id) {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(!!req.result);
                req.onerror = () => resolve(false);
            });
        } catch(e) { return false; }
    },

    async getGame(id) {
        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readonly');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    },

    async getAllGames() {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        } catch(e) { return []; }
    },

    async downloadGame(id, title, fileUrl, onProgress) {
        if (activeControllers.has(id)) {
            throw new Error('Download already in progress');
        }

        const controller = new AbortController();
        activeControllers.set(id, controller);
        activeInFlightDownloads.set(id, fileUrl);

        const assets = this.getManifest(fileUrl);
        let cache = null;
        if (typeof caches !== 'undefined') {
            try {
                cache = await caches.open(GAME_CACHE_NAME);
            } catch(e) {
                console.warn('CacheStorage not accessible:', e);
            }
        }

        let totalBytes = 0;
        let mainContent = '';
        let completedAssets = 0;

        try {
            for (let i = 0; i < assets.length; i++) {
                const assetUrl = assets[i];
                if (controller.signal.aborted) {
                    const err = new Error('Download cancelled');
                    err.name = 'AbortError';
                    throw err;
                }

                const clean = assetUrl.replace(/^\/+/, '');
                // Skip directories (cannot be fetched directly as files over HTTP)
                if (!clean || clean.endsWith('/')) {
                    completedAssets++;
                    continue;
                }

                let candidateUrls = [];
                if (/^https?:\/\//i.test(assetUrl)) {
                    let mirrorUrl = assetUrl;
                    if (assetUrl.includes('jsdelivr.net')) {
                        mirrorUrl = assetUrl.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//i, activeMirror + '/');
                    }
                    candidateUrls = [mirrorUrl, assetUrl];
                } else {
                    const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];
                    candidateUrls = [
                        ...mirrors.map(m => m + '/gh/pinpoint-edu/assets@main/' + clean),
                        'https://cdn.statically.io/gh/pinpoint-edu/assets@main/' + clean,
                        'https://raw.githubusercontent.com/pinpoint-edu/assets/main/' + clean
                    ];
                }

                let res = null;
                for (const url of candidateUrls) {
                    try {
                        const r = await fetch(url, { signal: controller.signal });
                        if (r.ok) {
                            const checkCl = r.headers.get('content-length');
                            if (checkCl && parseInt(checkCl, 10) < 300 && clean.endsWith('.html')) {
                                const previewText = await r.clone().text();
                                if (previewText.includes('Package size exceeded') || previewText.includes('limit of 20 MB')) continue;
                            }
                            res = r;
                            for (const m of CDN_MIRRORS) {
                                if (url.startsWith(m)) {
                                    activeMirror = m;
                                    break;
                                }
                            }
                            break;
                        }
                    } catch(e) {}
                }

                if (!res) {
                    throw new Error(`Failed to download ${clean} from CDN mirrors.`);
                }

                const contentLength = parseInt(res.headers.get('content-length') || '0', 10);
                let assetBlob;

                if (res.body && typeof res.body.getReader === 'function' && contentLength > 0) {
                    const reader = res.body.getReader();
                    const chunks = [];
                    let receivedBytes = 0;

                    while (true) {
                        if (controller.signal.aborted) {
                            reader.cancel().catch(() => {});
                            const err = new Error('Download cancelled');
                            err.name = 'AbortError';
                            throw err;
                        }
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        receivedBytes += value.length;
                        totalBytes += value.length;

                        if (typeof onProgress === 'function') {
                            const assetPart = (receivedBytes / contentLength) / assets.length;
                            const overallPercent = Math.min(99, Math.round(((completedAssets / assets.length) + assetPart) * 100));
                            onProgress({
                                percent: overallPercent,
                                loaded: receivedBytes,
                                total: contentLength,
                                assetIndex: i + 1,
                                assetTotal: assets.length
                            });
                        }
                    }

                    assetBlob = new Blob(chunks, { type: res.headers.get('content-type') || 'application/octet-stream' });
                } else {
                    assetBlob = await res.blob();
                    totalBytes += assetBlob.size;
                }

                if (i === 0 && (clean.endsWith('.html') || clean.endsWith('/'))) {
                    mainContent = await assetBlob.text();
                }

                if (cache) {
                    const cacheUrls = [
                        assetUrl,
                        new URL(assetUrl, window.location.href).href,
                        clean,
                        '/' + clean
                    ];
                    for (const cu of cacheUrls) {
                        try {
                            await cache.put(cu, new Response(assetBlob.slice(), {
                                headers: {
                                    'Content-Type': res.headers.get('content-type') || 'application/octet-stream',
                                    'Content-Length': assetBlob.size.toString()
                                }
                            }));
                        } catch(ce) {}
                    }
                }

                completedAssets++;
                if (typeof onProgress === 'function') {
                    const overallPercent = Math.min(99, Math.round((completedAssets / assets.length) * 100));
                    onProgress({
                        percent: overallPercent,
                        assetIndex: completedAssets,
                        assetTotal: assets.length
                    });
                }
            }

            if (typeof onProgress === 'function') {
                onProgress({ percent: 100, assetIndex: assets.length, assetTotal: assets.length });
            }

            const db = await gameDbPromise;
            const record = await new Promise((resolve, reject) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
                const store = tx.objectStore(GAME_STORE_NAME);
                const gameRecord = {
                    id: id,
                    title: title,
                    fileUrl: fileUrl,
                    content: mainContent,
                    assets: assets,
                    sizeBytes: totalBytes,
                    downloadedAt: new Date().toISOString()
                };
                const req = store.put(gameRecord);
                req.onsuccess = () => resolve(gameRecord);
                req.onerror = () => reject(req.error);
            });

            return record;

        } catch (downloadErr) {
            try {
                await this.deleteGame(id, fileUrl);
            } catch (cleanupErr) {
                console.warn('Cleanup error after failed download:', cleanupErr);
            }
            throw downloadErr;
        } finally {
            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
        }
    },

    async deleteGame(id, fileUrl) {
        if (typeof caches !== 'undefined') {
            try {
                const cache = await caches.open(GAME_CACHE_NAME);
                const assets = fileUrl ? this.getManifest(fileUrl) : [];
                for (const assetUrl of assets) {
                    const delKeys = [
                        assetUrl,
                        new URL(assetUrl, window.location.href).href,
                        assetUrl.replace(/^\/+/, ''),
                        decodeURIComponent(assetUrl),
                        encodeURI(assetUrl)
                    ];
                    if (assetUrl.endsWith('/index.html')) {
                        const dirPath = assetUrl.replace(/index\.html$/, '');
                        delKeys.push(dirPath, '/' + dirPath.replace(/^\/+/, ''));
                    }
                    for (const k of delKeys) {
                        await cache.delete(k);
                    }
                }
            } catch(e) {}
        }

        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.delete(id);
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
        });
    },

    cancelDownload(id) {
        if (activeControllers.has(id)) {
            activeControllers.get(id).abort();
            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
        }
    },

    isDownloading(id) {
        return activeControllers.has(id);
    }
};

let games = [...DEFAULT_GAMES];
let downloadedGameIds = new Set();
let currentTab = 'all'; // 'all' or 'downloaded'
let currentPlayingFile = null;
let currentPlayingTitle = null;
let activeProgressMap = new Map();
let searchDebounceTimer = null;

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function getGameId(file) {
  return file.replace(/[^a-zA-Z0-9_-]/g, '_');
}

async function syncDownloadedStatus() {
  if (typeof PinpointGameStorage !== 'undefined') {
    try {
      const records = await PinpointGameStorage.getAllGames();
      downloadedGameIds = new Set(records.map(r => r.id));
    } catch(e) {
      console.warn('Could not read offline games from storage:', e);
    }
  }
  updateCounts();
  if (document.body.classList.contains('is-searching')) {
    renderGames();
  }
}

function updateCounts() {
  const allCount = games.length;
  const dlCount = downloadedGameIds.size;

  const bAll = document.getElementById('allCountBadge');
  const bDl = document.getElementById('dlCountBadge');
  const lDl = document.getElementById('downloadCountLabel');

  if (bAll) bAll.textContent = allCount;
  if (bDl) bDl.textContent = dlCount;
  if (lDl) lDl.textContent = `${dlCount} Downloaded`;
}

function selectChip(tab) {
  currentTab = tab;
  document.getElementById('chipAll').classList.toggle('active', tab === 'all');
  document.getElementById('chipDownloaded').classList.toggle('active', tab === 'downloaded');
  document.getElementById('resultsCategoryLabel').textContent = tab === 'downloaded' ? 'Downloaded Games' : 'All Games';
  activateSearchState();
  renderGames();
}

function focusSearch() {
  document.getElementById('searchInput').focus();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  resetToCenterHome();
}

function updateResultsPosition() {
  const sb = document.getElementById('search-block');
  const rc = document.getElementById('results-container');
  if (sb && rc && document.body.classList.contains('is-searching')) {
    const bottom = sb.getBoundingClientRect().bottom;
    rc.style.top = Math.max(134, Math.round(bottom + 12)) + 'px';
  }
}

function activateSearchState() {
  document.body.classList.add('is-searching');
  setTimeout(updateResultsPosition, 40);
  setTimeout(updateResultsPosition, 250);
  setTimeout(updateResultsPosition, 650);
}

function resetToCenterHome() {
  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  document.body.classList.remove('is-searching');
  const rc = document.getElementById('results-container');
  if (rc) rc.style.top = '';
  currentTab = 'all';
  document.getElementById('chipAll').classList.add('active');
  document.getElementById('chipDownloaded').classList.remove('active');
  document.getElementById('resultsCategoryLabel').textContent = 'All Games';
}

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const val = searchInput.value;
  document.getElementById('clearSearchBtn').style.display = val ? 'flex' : 'none';

  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);

  if (!val.trim()) {
    resetToCenterHome();

    activateSearchState();
    renderGames();

});

// Render results
function renderGames() {
  const listContainer = document.getElementById('gameList');
  const emptyState = document.getElementById('emptyState');
  const emptyDesc = document.getElementById('emptyStateDesc');
  const summaryLabel = document.getElementById('resultsSummaryLabel');
  const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = games.filter(g => {
    const id = getGameId(g.file);
    if (currentTab === 'downloaded' && !downloadedGameIds.has(id)) {
      return false;
    }
    if (query && !g.title.toLowerCase().includes(query)) {
      return false;
    }
    return true;
  });

  if (summaryLabel) {
    summaryLabel.textContent = `${filtered.length} games`;
  }

  if (filtered.length === 0) {
    listContainer.innerHTML = '';
    emptyState.style.display = 'block';
    if (currentTab === 'downloaded') {
      emptyDesc.textContent = query
        ? 'No downloaded games match your search.'
        : 'No offline games yet. Click "Download" on any game to save it.';
    } else {
      emptyDesc.textContent = 'No games match your search query.';
    }
    return;
  }

  emptyState.style.display = 'none';

  let html = '';
  filtered.forEach(game => {
    const id = getGameId(game.file);
    const isDownloaded = downloadedGameIds.has(id);
    const isDownloading = typeof PinpointGameStorage !== 'undefined' && PinpointGameStorage.isDownloading(id);
    const progress = activeProgressMap.get(id);

    html += `
      <div class="game-card" id="card-${id}" onclick="playGame('${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')">
        <div class="game-left">
          <div class="game-details">
            <span class="game-title">${game.title}</span>
            <div class="game-meta">
              <span>${game.isApp ? 'Web App' : formatBytes(game.sizeBytes)}</span>
              ${isDownloaded ? `
                <span class="badge-dl">
                  <span class="material-symbols-sharp" style="font-size: 14px;">check_circle</span>
                  Downloaded
                </span>
              ` : ''}
              ${isDownloading ? `
                <span class="badge-progress">
                  <span class="material-symbols-sharp" style="font-size: 14px; animation: spin 1s linear infinite;">sync</span>
                  ${progress !== undefined ? progress + '%' : 'Downloading...'}
                </span>
              ` : ''}
            </div>
            ${isDownloading ? `
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width: ${progress || 5}%;"></div>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="game-actions">
          <button class="btn-sharp btn-primary-sharp" onclick="event.stopPropagation(); playGame('${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')">
            <span class="material-symbols-sharp">${game.isApp ? 'open_in_new' : 'play_arrow'}</span>
            <span>${game.isApp ? 'Open' : 'Play'}</span>
          </button>

          ${!game.isApp ? (isDownloaded ? `
            <button class="btn-icon-sharp" onclick="event.stopPropagation(); deleteGame('${id}', '${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')" title="Remove">
              <span class="material-symbols-sharp">delete</span>
            </button>
          ` : isDownloading ? `
            <button class="btn-sharp" onclick="event.stopPropagation(); cancelDownload('${id}')" title="Cancel">
              <span class="material-symbols-sharp">close</span>
              <span>Cancel</span>
            </button>
          ` : `
            <button class="btn-sharp" onclick="event.stopPropagation(); startDownload('${id}', '${encodeURIComponent(game.title)}', '${encodeURIComponent(game.file)}')" title="Download for offline">

function prepareGameHtml(html, fileUrl) {
  let base = fileUrl.replace(/[^/]*$/, '');
  if (!base.endsWith('/')) base += '/';

  let repoBase = base;
  const mRepo = base.match(/^(https?:\/\/[^/]+\/(?:gh\/[^/]+\/[^/@]+@[^/]+\/|[^/]+\/[^/]+\/[^/]+\/))/i);
  if (mRepo) {
    repoBase = mRepo[1];
  }

  // Fix Ruffle publicPath in raw HTML so .wasm loads from valid mirror path
  html = html.replace(/publicPath:\s*[^,\n}]+/gi, 'publicPath: ' + JSON.stringify(repoBase + 'textbooks/ruffle/'));

  // Strip broken wrapper scripts that fail with 404 / ERR_FILE_NOT_FOUND
  html = html.replace(/<script[^>]*src=["'][^"']*(?:all\.js|settings\/js\/index\.js)[^"']*["'][^>]*>\s*<\/script>/gi, '');

  // Protect car-soccer asset matcher from throwing if map is undefined
  html = html.replace(/function matchAsset\s*\(([^)]*)\)\s*\{/g, 'function matchAsset($1){ if(!map)return null;');

  const lower = html.toLowerCase();
  const firstScript = lower.indexOf('<script');
  const firstHead = lower.indexOf('<head');
  const hasRealHead = firstHead !== -1 && (firstScript === -1 || firstHead < firstScript);

  // 1. Inject or update <base href="...">
  const mBase = html.match(/(<base\b[^>]*\bhref\s*=\s*)(['"])(.*?)\2/i);
  if (mBase) {
    const existingHref = mBase[3];
    if (/^https?:\/\//i.test(existingHref)) {
      // It already has a valid absolute base URL (e.g. Baldi's Basics, Baseball Bros). Do not overwrite it!
    } else {
      let resolvedBase = base;
      if (existingHref.startsWith('/')) {
        resolvedBase = repoBase + existingHref.replace(/^\/+/, '');
      } else {
        try {
          resolvedBase = new URL(existingHref, base).href;
        } catch(e) {
          resolvedBase = base + existingHref;
        }
      }
      if (!resolvedBase.endsWith('/')) resolvedBase += '/';
      html = html.replace(/(<base\b[^>]*\bhref\s*=\s*)(['"])(.*?)\2/i, (m, p1, p2) => p1 + p2 + resolvedBase + p2);
    }
  } else if (hasRealHead) {
    html = html.replace(/<head([^>]*)>/i, (m, p1) => '<head' + p1 + '><base href="' + base + '">');
  } else {
    html = '<base href="' + base + '">' + html;
  }

  // 2. Inject frame viewport style and runtime fetch/XHR interceptor
  const isApp = fileUrl.includes('ai.html') || fileUrl.includes('yolk/');
  const frameStyle = isApp ? '' : '<style>html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#000;}.webgl-content,#gameContainer,#canvas{width:100%;height:100%;}</style>';
  const interceptScript = '<scr' + 'ipt>(function(){' +
    'try {' +
      'Object.defineProperty(window, "top", { get: function() { return window; } });' +
    '}catch(e){}' +
    'window._carSoccerImageBlobs = window._carSoccerImageBlobs || new Map();' +
    'window.GZ_ASSETS_MAP = window.GZ_ASSETS_MAP || {};' +
    'window.addEventListener("error", function(e) {' +
      'if(e && e.message && (e.message.indexOf("getBoundingClientRect")!==-1 || e.message.indexOf("all.js")!==-1 || e.message.indexOf("matchAsset")!==-1)){' +
        'e.preventDefault();' +
        'e.stopPropagation();' +
        'return true;' +
      '}' +
    '}, true);' +
    'try {' +
      'var origGetId = Document.prototype.getElementById;' +
      'Document.prototype.getElementById = function(id) {' +
        'var el = origGetId.call(this, id);' +
        'if(!el && id === "canvas") { return document.querySelector("canvas"); }' +
        'return el;' +
      '};' +
    '}catch(e){}' +
    'window.__allAudioContexts = window.__allAudioContexts || [];' +
    'try {' +
      'var OrigAC = window.AudioContext || window.webkitAudioContext;' +
      'if(OrigAC){' +
        'var PatchedAC = function(){' +
          'var ctx = new OrigAC();' +
          'try{ window.__allAudioContexts.push(ctx); }catch(e){}' +
          'return ctx;' +
        '};' +
        'PatchedAC.prototype = OrigAC.prototype;' +
        'window.AudioContext = PatchedAC;' +
        'if(window.webkitAudioContext) window.webkitAudioContext = PatchedAC;' +
      '}' +
    '}catch(e){}' +
    'var b=' + JSON.stringify(base) + ';' +
    'var rb=' + JSON.stringify(repoBase) + ';' +
    'var m=' + JSON.stringify(activeMirror) + ';' +
    'function fix(u){' +
      'if(typeof u!=="string")return u;' +
      'if(u.indexOf("blob:")===0||u.indexOf("data:")===0)return u;' +
      'if(/all\\.js|settings\\/js/i.test(u)){' +
        'return "data:application/javascript,";' +
      '}' +
      'if(/savedata.*\\.ini|optiondata\\.dat/i.test(u)){' +
        'return b + u.replace(/^\\/?(textbooks\\/)?/, "");' +
      '}' +
      'if(u.indexOf("matheveryday25/math@main/1v1lol/2.7.wasm.code.unityweb")!==-1){' +
        'return "https://raw.githubusercontent.com/matheveryday25/math/main/1v1lol/2.7.wasm.code.unityweb";' +
      '}' +
      'if((u.indexOf("ruffle/")!==-1 || /ruffle.*\\.wasm/i.test(u)) && !u.includes(".unityweb")){' +
        'var fn=u.substring(u.lastIndexOf("/")+1);' +
        'return rb+"textbooks/ruffle/"+fn;' +
      '}' +
      'if(u.indexOf("/textbooks/")===0)return rb+u.slice(1);' +
      'if(u.indexOf("/assets/")===0)return rb+u.slice(1);' +
      'if(u.startsWith("/")){' +
        'return rb+u.slice(1);' +
      '}' +
      'if(u.indexOf("://")===-1){' +
        'return b+u;' +
      '}' +
      'return u;' +
    '}' +
    'try {' +
      'var origScriptSrc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, "src");' +
      'if(origScriptSrc && origScriptSrc.set){' +
        'Object.defineProperty(HTMLScriptElement.prototype, "src", {' +
          'set: function(v){' +
            'if(typeof v==="string"){' +
              'if(/all\\.js|settings\\/js/i.test(v)) return origScriptSrc.set.call(this, "data:application/javascript,");' +
              'v = fix(v);' +
            '}' +
            'return origScriptSrc.set.call(this, v);' +
          '},' +
          'get: function(){ return origScriptSrc.get.call(this); }' +
        '});' +
      '}' +
    '}catch(e){}' +
    'if(typeof window.fetch!=="undefined"){' +
      'var _f=window.fetch;' +
      'window.fetch=function(inp,init){' +
        'var u = typeof inp==="string" ? inp : (inp && inp.url ? inp.url : "");' +
        'if(/all\\.js|settings\\/js/i.test(u)){' +
          'return Promise.resolve(new Response("", {status: 200, headers: {"Content-Type": "application/javascript"}}));' +
        '}' +
        'var targetUrl=fix(u);' +
        'var req = (typeof inp==="string" || !inp) ? targetUrl : new Request(targetUrl, inp);' +
        'return _f.call(this,req,init).then(function(res){' +
          'if(!res.ok && (res.status===403 || res.status===404) && typeof targetUrl==="string" && targetUrl.indexOf("cdn.jsdelivr.net/gh/")!==-1){' +
            'var rawUrl=targetUrl.replace(/https?:\\/\\/[^/]*\\.jsdelivr\\.net\\/gh\\/([^/@]+)\\/([^/@]+)(?:@[^/]+)?\\//, function(m, p1, p2){ return "https://raw.githubusercontent.com/" + p1 + "/" + p2 + "/main/"; });' +
            'if(rawUrl!==targetUrl){' +
              'var fbReq=(typeof inp==="string" || !inp) ? rawUrl : new Request(rawUrl, inp);' +
              'return _f.call(window, fbReq, init);' +
            '}' +
          '}' +
          'return res;' +
        '});' +
      '};' +
    '}' +
    'if(typeof XMLHttpRequest!=="undefined"){' +
      'var _o=XMLHttpRequest.prototype.open;' +
      'XMLHttpRequest.prototype.open=function(method,url,async,user,pass){' +
        'var targetUrl=fix(url);' +
        'return _o.call(this,method,targetUrl,async!==false,user,pass);' +
      '};' +
    '}' +
  '})();</scr' + 'ipt>';

  if (hasRealHead) {
    html = html.replace(/<head([^>]*)>/i, (m, p1) => '<head' + p1 + '>' + interceptScript + frameStyle);
  } else {
    html = interceptScript + frameStyle + html;
  }

  // 3. Resolve root-relative paths in HTML attributes
  html = html.replace(/(\s(?:src|href))=(['"])\/(?!\/)/gi, (m, p1, p2) => p1 + '=' + p2 + repoBase);

  // 4. Normalize jsdelivr mirror domains to current active mirror
  html = html.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//g, activeMirror + '/');

  return html;
}

function writeGameIntoFrame(iframe, rawHtml, fileUrl) {
  const preparedHtml = prepareGameHtml(rawHtml, fileUrl);
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(preparedHtml);
  doc.close();
  try {
    iframe.contentWindow.focus();
  } catch(e) {}
}

async function fetchGameHtml(file) {
  if (/^https?:\/\//i.test(file)) {
    let mirrorUrl = file;
    if (file.includes('jsdelivr.net')) {
      mirrorUrl = file.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//i, activeMirror + '/');
    }
    try {
      const res = await fetch(mirrorUrl);
      if (res.ok) {
        const text = await res.text();
        return { html: text, resolvedUrl: mirrorUrl };
      }
    } catch(e) {}
    const res2 = await fetch(file);
    if (res2.ok) {
      const text = await res2.text();
      return { html: text, resolvedUrl: file };
    }
    throw new Error('Could not fetch game from ' + file);
  }

  const cleanPath = file.replace(/^\/+/, '');
  let fetchFile = cleanPath;
  if (fetchFile.endsWith('/')) {
    fetchFile += 'index.html';
  }

  // First try direct local / relative fetch (e.g. running on file://, localhost, or Vercel)
  try {
    const localRes = await fetch(fetchFile);
    if (localRes.ok) {
      const text = await localRes.text();
      if (!text.includes('Package size exceeded') && !text.includes('limit of 20 MB') && !text.includes('404: Not Found') && !text.trim().startsWith('{"status": 4')) {
        let localResolved = fetchFile;
        try {
          localResolved = new URL(fetchFile, window.location.href).href;
        } catch(e) {}
        return { html: text, resolvedUrl: localResolved };
      }
    }
  } catch(e) {}

  const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];

  // Apps live in pinpoint-mini, game textbooks live in assets
  const isMiniRepo = fetchFile.startsWith('yolk/') || fetchFile === 'ai.html' || fetchFile.startsWith('pages/');
  const primaryRepo = isMiniRepo ? 'pinpoint-edu/pinpoint-mini@main/' : 'pinpoint-edu/assets@main/';
  const fallbackRepo = isMiniRepo ? 'pinpoint-edu/assets@main/' : 'pinpoint-edu/pinpoint-mini@main/';

  const urlsToTry = [
    ...mirrors.map(m => m + '/gh/' + primaryRepo + fetchFile),
    'https://cdn.statically.io/gh/' + primaryRepo + fetchFile,
    'https://raw.githubusercontent.com/' + primaryRepo.replace('@main/', '/main/') + fetchFile,
    ...mirrors.map(m => m + '/gh/' + fallbackRepo + fetchFile),
    'https://cdn.statically.io/gh/' + fallbackRepo + fetchFile,
    'https://raw.githubusercontent.com/' + fallbackRepo.replace('@main/', '/main/') + fetchFile
  ];

  for (const url of urlsToTry) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const text = await res.text();
      if (text.includes('Package size exceeded') || text.includes('limit of 20 MB') || text.includes('404: Not Found') || text.trim().startsWith('{"status": 4')) {
        continue;
      }
      for (const m of CDN_MIRRORS) {
        if (url.startsWith(m)) {
          activeMirror = m;
          break;
        }
      }
      return { html: text, resolvedUrl: url };
    } catch(e) {
      continue;
    }
  }
  throw new Error('Could not fetch game from any CDN mirror.');
}

// Play Game in the In-Page Player
async function playGame(encodedFile, encodedTitle) {
  const file = decodeURIComponent(encodedFile);
  const title = decodeURIComponent(encodedTitle);
  const id = getGameId(file);

  currentPlayingFile = file;
  currentPlayingTitle = title;
  document.getElementById('currentPlayerTitle').textContent = title;
  document.getElementById('player-view').style.display = 'flex';

  if (window.PinpointSaveManager) {
    PinpointSaveManager.updateUI(file, title);
  }
  updatePlayerDownloadBtn();

  const iframe = document.getElementById('gameIframe');

  // Direct iframe navigation for external embeds
  if (file.startsWith('http') && file.includes('scratch.mit.edu')) {
    iframe.removeAttribute('srcdoc');
    iframe.src = file;
    try { iframe.contentWindow.focus(); } catch(e) {}
    return;
  }

  // 1. Check if game is saved offline in IndexedDB
  if (typeof PinpointGameStorage !== 'undefined') {
    try {
      const record = await PinpointGameStorage.getGame(id);
      if (record && record.content && record.content.length > 50) {
        const offlineBase = (/^https?:\/\//i.test(file)) ? file : (activeMirror + '/gh/pinpoint-edu/assets@main/' + file);
        writeGameIntoFrame(iframe, record.content, offlineBase);
        return;
      }
    } catch(e) {}
  }

  // 2. Show loading spinner while fetching
  iframe.removeAttribute('src');
  iframe.srcdoc = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </head>
    <body>
      <div class="spinner"></div>
      <div style="font-size: 14px; letter-spacing: 0.5px;">Loading ${title}...</div>
    </body>
    </html>
  `;

  // 3. Fetch game HTML and inject via doc.write
  try {
    const { html, resolvedUrl } = await fetchGameHtml(file);
    writeGameIntoFrame(iframe, html, resolvedUrl);
  } catch (err) {
    console.error('Play game error:', err);
    iframe.srcdoc = `
      <!DOCTYPE html>
      <html>
      <head>
        <style>
          body { background: #000; color: #ef4444; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 20px; text-align: center; }
        </style>
      </head>
      <body>
        <h3 style="margin-bottom: 8px;">Failed to Load Game</h3>
        <p style="color: #888; font-size: 14px;">${err.message}</p>
      </body>
      </html>
    `;
  }
}

// Pinpoint Game Save Manager (Retro Bowl & Retro Bowl College)
const SAVE_SALT = 'PinpointMini_SecureSave_v1';

const GAME_SAVE_CONFIGS = {
  'retro-bowl': {
    id: 'retro-bowl',
    title: 'Retro Bowl',
    matchers: [
      /textbooks\/retro-bowl\.html/i,
      /retro-bowl(?!\-college)/i,
      /retro\s*bowl(?!\s*college)/i,
      /^retro-bowl$/i
    ],
    isKeyMatch: (key) => {
      if (!key || typeof key !== 'string') return false;
      return (key.startsWith('RetroBowl.') || key.startsWith('RetroBowl_')) &&
             !key.startsWith('RetroBowlCollege.') &&
             !key.startsWith('RetroBowlCollege_') &&
             !key.startsWith('RetroBowl_College');
    },
    validateData: (data) => {
      const keys = Object.keys(data || {});
      if (keys.length === 0) return { valid: false, error: 'No save data entries found.' };
      for (const k of keys) {
        if (k.toLowerCase().includes('college')) {
          return { valid: false, error: 'Save data contains Retro Bowl College keys and cannot be imported into Retro Bowl.' };
        }
        if (!k.startsWith('RetroBowl.') && !k.startsWith('RetroBowl_')) {
          return { valid: false, error: `Unrecognized save key '${k}' for Retro Bowl.` };
        }
      }
      return { valid: true };
    }
  },
  'retro-bowl-college': {
    id: 'retro-bowl-college',
    title: 'Retro Bowl College',
    matchers: [
      /textbooks\/retro-bowl-college\.html/i,
      /retro-bowl-college/i,
      /retro\s*bowl\s*college/i,
      /^retro-bowl-college$/i
    ],
    isKeyMatch: (key) => {
      if (!key || typeof key !== 'string') return false;
      return key.startsWith('RetroBowlCollege.') ||
             key.startsWith('RetroBowlCollege_') ||
             key.startsWith('RetroBowl_College.') ||
             key.startsWith('RetroBowl_College_');
    },
    validateData: (data) => {
      const keys = Object.keys(data || {});
      if (keys.length === 0) return { valid: false, error: 'No save data entries found.' };
      for (const k of keys) {
        if (!k.startsWith('RetroBowlCollege.') && !k.startsWith('RetroBowlCollege_') && !k.startsWith('RetroBowl_College')) {
          return { valid: false, error: `Save data contains non-College Retro Bowl keys ('${k}') and cannot be imported into Retro Bowl College.` };
        }
      }
      return { valid: true };
    }
  }
};

function computeSaveChecksum(gameId, dataObj) {
  const keys = Object.keys(dataObj).sort();
  let str = gameId + ':' + SAVE_SALT + ':';
  for (const k of keys) {
    str += k + '=' + String(dataObj[k]).length + ':' + String(dataObj[k]).slice(0, 50) + ';';
  }
  let h1 = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h1 ^= str.charCodeAt(i);
    h1 = Math.imul(h1, 0x01000193);
  }
  return (h1 >>> 0).toString(16).padStart(8, '0');
}

function getSaveGameConfig(fileOrTitle) {
  if (!fileOrTitle || typeof fileOrTitle !== 'string') return null;
  const cleanStr = fileOrTitle.trim();
  for (const id in GAME_SAVE_CONFIGS) {
    const cfg = GAME_SAVE_CONFIGS[id];
    if (cfg.id === cleanStr) return cfg;
    if (cfg.title.toLowerCase() === cleanStr.toLowerCase()) return cfg;
    for (const m of cfg.matchers) {
      if (m.test(cleanStr)) return cfg;
    }
  }
  return null;
}

function getSaveStorageList() {
  const storages = [];
  try {
    if (typeof localStorage !== 'undefined') storages.push(localStorage);
  } catch(e) {}

  try {
    const iframe = document.getElementById('gameIframe') || document.getElementById('runner-iframe');
    if (iframe && iframe.contentWindow) {
      try {
        const ifStorage = iframe.contentWindow.localStorage;
        if (ifStorage && !storages.includes(ifStorage)) {
          storages.push(ifStorage);
        }
      } catch(secErr) {}
    }
  } catch(e) {}

  return storages;
}

function showTrashbinToast(msg, type = 'info', duration = 3500) {
  let toast = document.getElementById('trashbin-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'trashbin-toast';
    document.body.appendChild(toast);
  }
  toast.className = `trashbin-toast ${type} show`;
  toast.innerHTML = `<span class="material-symbols-sharp" style="font-size: 18px;">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'info'}</span><span>${msg}</span>`;
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toast.className = 'trashbin-toast';
  }, duration);
}

const PinpointSaveManager = {
  isSupported: (fileOrTitle) => !!getSaveGameConfig(fileOrTitle),

  updateUI: (file, title) => {
    const isSupported = !!getSaveGameConfig(file || title);
    const exportBtn = document.getElementById('runner-save-export');
    const importBtn = document.getElementById('runner-save-import');
    if (exportBtn) exportBtn.style.display = isSupported ? 'inline-flex' : 'none';
    if (importBtn) importBtn.style.display = isSupported ? 'inline-flex' : 'none';
  },

  exportCurrentSave: () => {
    const target = currentPlayingFile || currentPlayingTitle || '';
    const cfg = getSaveGameConfig(target);
    if (!cfg) {
      showTrashbinToast('Save export is not supported for this game.', 'warning');
      return false;
    }

    const storages = getSaveStorageList();
    const data = {};
    for (const storage of storages) {
      try {
        for (let i = 0; i < storage.length; i++) {
          const key = storage.key(i);
          if (key && cfg.isKeyMatch(key)) {
            const val = storage.getItem(key);
            if (val !== null && val !== undefined) {
              data[key] = val;
            }
          }
        }
      } catch(e) {}
    }

    const keyCount = Object.keys(data).length;
    if (keyCount === 0) {
      showTrashbinToast(`No save data found yet for ${cfg.title}. Play a match or start a season first!`, 'warning', 4500);
      return false;
    }

    const now = new Date();
    const savePayload = {
      pinpointSave: true,
      formatVersion: 1,
      app: 'pinpoint-mini',
      gameId: cfg.id,
      gameTitle: cfg.title,
      exportedAt: now.toISOString(),
      timestamp: now.getTime(),
      metadata: {
        keyCount: keyCount,
        keys: Object.keys(data),
        totalBytes: JSON.stringify(data).length
      },
      checksum: computeSaveChecksum(cfg.id, data),
      data: data
    };

    const jsonString = JSON.stringify(savePayload, null, 2);
    const blob = new Blob([jsonString], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStamp = now.toISOString().slice(0, 10);
    a.href = url;
    a.download = `${cfg.id}_save_${dateStamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showTrashbinToast(`Exported save file for ${cfg.title} (${keyCount} entries)!`, 'success');
    return true;
  },

  triggerImportCurrentSave: () => {
    const fileInput = document.getElementById('runner-save-file-input');
    if (fileInput) {
      fileInput.value = '';
      fileInput.click();
    }
  },

  handleImportFile: (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const target = currentPlayingFile || currentPlayingTitle || '';

    const reader = new FileReader();
    reader.onload = function(e) {
      const content = e.target.result;
      PinpointSaveManager.importSave(target, content);
    };
    reader.onerror = function() {
      showTrashbinToast('Failed to read save file from disk.', 'error');
    };
    reader.readAsText(file);
  },

  importSave: async (fileOrTitle, jsonContent) => {
    const cfg = getSaveGameConfig(fileOrTitle);
    if (!cfg) {
      showTrashbinToast('Save import is not supported for this game.', 'error');
      return false;
    }

    let parsed;
    try {
      parsed = typeof jsonContent === 'string' ? JSON.parse(jsonContent) : jsonContent;
    } catch(e) {
      showTrashbinToast('Invalid file: The file does not contain valid JSON.', 'error');
      return false;
    }

    if (!parsed || typeof parsed !== 'object') {
      showTrashbinToast('Invalid save file format.', 'error');
      return false;
    }

    if (!parsed.pinpointSave && !parsed.data) {
      showTrashbinToast('Invalid save file: Missing save data structure.', 'error');
      return false;
    }

    if (parsed.gameId && parsed.gameId !== cfg.id) {
      const originTitle = parsed.gameTitle || parsed.gameId;
      showTrashbinToast(`Incompatible Save: File belongs to "${originTitle}", cannot import into "${cfg.title}".`, 'error', 5000);
      return false;
    }

    const payloadData = parsed.data || parsed;
    const valResult = cfg.validateData(payloadData);
    if (!valResult.valid) {
      showTrashbinToast(`Save Validation Failed: ${valResult.error}`, 'error', 5000);
      return false;
    }

    const saveCount = Object.keys(payloadData).length;
    const confirmed = confirm(`Import save for ${cfg.title}?\n\nThis will overwrite your existing save progress on this device with ${saveCount} save entries from ${parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleDateString() : 'the uploaded file'}.`);

    if (!confirmed) {
      showTrashbinToast('Save import cancelled.', 'info');
      return false;
    }

    const storages = getSaveStorageList();
    for (const storage of storages) {
      try {
        const keysToRemove = [];
        for (let i = 0; i < storage.length; i++) {
          const k = storage.key(i);
          if (k && cfg.isKeyMatch(k)) {
            keysToRemove.push(k);
          }
        }
        for (const k of keysToRemove) {
          storage.removeItem(k);
        }

        for (const [k, v] of Object.entries(payloadData)) {
          storage.setItem(k, v);
        }
      } catch(e) {
        console.error('[PinpointSaveManager] Error writing storage:', e);
      }
    }

    // Reload game cleanly with newly imported save
    reloadPlayer();

    showTrashbinToast(`Successfully imported save for ${cfg.title}! Reloading game...`, 'success', 4000);
    return true;
  }
};
window.PinpointSaveManager = PinpointSaveManager;

let lastPlayingGame = null;
let isGamePausedInViewer = false;

function muteGameFrame() {
  const iframe = document.getElementById('gameIframe');
  if (!iframe) return;
  try {
    const win = iframe.contentWindow;
    const doc = iframe.contentDocument || (win && win.document);
    if (win && win.__allAudioContexts) {
      win.__allAudioContexts.forEach(ctx => {
        try { if (ctx && ctx.state === 'running') ctx.suspend(); } catch(e){}
      });
    }
    if (win && win.Howler && typeof win.Howler.mute === 'function') {
      try { win.Howler.mute(true); } catch(e){}
    }
    if (doc) {
      const mediaEls = doc.querySelectorAll('audio, video');
      mediaEls.forEach(el => {
        try {
          el.__savedMuted = el.muted;
          el.muted = true;
          el.pause();
        } catch(e){}
      });
    }
  } catch (e) {
    console.warn('[Trashbin] Mute frame warning:', e);
  }
}

function unmuteGameFrame() {
  const iframe = document.getElementById('gameIframe');
  if (!iframe) return;
  try {
    const win = iframe.contentWindow;
    const doc = iframe.contentDocument || (win && win.document);
    if (win && win.__allAudioContexts) {
      win.__allAudioContexts.forEach(ctx => {
        try { if (ctx && ctx.state === 'suspended') ctx.resume(); } catch(e){}
      });
    }
    if (win && win.Howler && typeof win.Howler.mute === 'function') {
      try { win.Howler.mute(false); } catch(e){}
    }
    if (doc) {
      const mediaEls = doc.querySelectorAll('audio, video');
      mediaEls.forEach(el => {
        try {
          if (!el.__savedMuted) el.muted = false;
          el.play().catch(() => {});
        } catch(e){}
      });
    }
  } catch (e) {
    console.warn('[Trashbin] Unmute frame warning:', e);
  }
}

function closePlayer() {
  isGamePausedInViewer = false;
  const iframe = document.getElementById('gameIframe');
  iframe.removeAttribute('srcdoc');
  iframe.src = 'about:blank';
  document.getElementById('player-view').style.display = 'none';
  currentPlayingFile = null;
  currentPlayingTitle = null;
  if (window.PinpointSaveManager) {
    PinpointSaveManager.updateUI(null);
  }
  updatePlayerDownloadBtn();
}

function openGameStatusMenu() {
  if (currentPlayingFile) {
    const titleEl = document.getElementById('currentPlayerTitle');
    lastPlayingGame = {
      file: currentPlayingFile,
      title: titleEl ? titleEl.textContent : 'Game'
    };
    isGamePausedInViewer = true;
    muteGameFrame();
  } else {
    isGamePausedInViewer = false;
  }

  const modal = document.getElementById('status-modal-overlay');
  if (modal) modal.style.display = 'flex';

  const resumeBtn = document.getElementById('resumeGameBtn');
  if (resumeBtn) {
    resumeBtn.style.display = (isGamePausedInViewer || (lastPlayingGame && lastPlayingGame.file)) ? 'inline-flex' : 'none';
  }

  updateClockDisplay();
  queryBattery();
}

function resumeGame() {
  const fakeOverlay = document.getElementById('fake-resuming-overlay');
  if (fakeOverlay) fakeOverlay.classList.add('active');

  setTimeout(() => {
    const modal = document.getElementById('status-modal-overlay');
    if (modal) modal.style.display = 'none';

    unmuteGameFrame();

    const playerView = document.getElementById('player-view');
    if ((!playerView || playerView.style.display !== 'flex') && lastPlayingGame && lastPlayingGame.file) {
      playGame(encodeURIComponent(lastPlayingGame.file), encodeURIComponent(lastPlayingGame.title));
    }

    isGamePausedInViewer = false;

    setTimeout(() => {
      if (fakeOverlay) fakeOverlay.classList.remove('active');
    }, 380);
  }, 140);
}

function closeStatusModal() {
  if (isGamePausedInViewer) {
    resumeGame();
    return;
  }
  const modal = document.getElementById('status-modal-overlay');
  if (modal) modal.style.display = 'none';
}

function exitToTrashbin() {
  isGamePausedInViewer = false;
  const modal = document.getElementById('status-modal-overlay');
  if (modal) modal.style.display = 'none';
  closePlayer();
  resetToCenterHome();
}

function reloadPlayer() {
  if (currentPlayingFile) {
    const title = document.getElementById('currentPlayerTitle').textContent;
    playGame(encodeURIComponent(currentPlayingFile), encodeURIComponent(title));
  }
}

function toggleFullscreen() {

  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (playerEl.requestFullscreen) {
      playerEl.requestFullscreen();
    } else if (playerEl.webkitRequestFullscreen) {
      playerEl.webkitRequestFullscreen();
    }
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
  }
}
