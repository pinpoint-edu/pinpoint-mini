<!DOCTYPE html>
<html lang="en">
<head><script src="scripts/cors-interceptor.js"></script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Classroom</title>
  <link rel="icon" type="image/png" href="favicons/google-classroom.png"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      font-family: Roboto, Arial, sans-serif;
    }
    #classroom-iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
    #click-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      cursor: pointer;
      background: rgba(0, 0, 0, 0);
    }
  </style>
</head>
<body>
  <iframe id="classroom-iframe" src="https://classroom.google.com" title="Google Classroom" allow="fullscreen; geolocation; camera; microphone; autoplay; clipboard-read; clipboard-write"></iframe>
  <div id="click-overlay"></div>

  <script>
    (function() {
      // Save entry origin
      try {
        localStorage.setItem('pinpoint_entry_origin', window.location.origin);
      } catch (e) {}

      // Fallback if classroom.google.com cannot be loaded in frame
      const iframe = document.getElementById('classroom-iframe');
      if (iframe) {
        iframe.addEventListener('error', function() {
          try {
            iframe.src = 'home.html';
          } catch (err) {}
        });
      }

      let redirected = false;

      function redirectToHome(e) {
        if (redirected) return;
        redirected = true;

        if (e) {
          try {
            e.preventDefault();
            e.stopPropagation();
          } catch (err) {}
        }
        window.location.href = 'home.html';
      }

      const overlay = document.getElementById('click-overlay');
      if (overlay) {
        overlay.addEventListener('pointerdown', redirectToHome);
        overlay.addEventListener('mousedown', redirectToHome);
        overlay.addEventListener('click', redirectToHome);
        overlay.addEventListener('touchstart', redirectToHome, { passive: false });
      }
      window.addEventListener('pointerdown', redirectToHome);
      window.addEventListener('mousedown', redirectToHome);
      window.addEventListener('click', redirectToHome);
      window.addEventListener('touchstart', redirectToHome, { passive: false });
      window.addEventListener('keydown', redirectToHome);
    })();
  </script>
</body>
</html>
