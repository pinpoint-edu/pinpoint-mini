<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lavagames</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Plus Jakarta Sans & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #0d0f14;
      --bg-card: #151821;
      --bg-card-hover: #1c202d;
      --border: #282d3d;
      --border-focus: #ff4500;
      --lava-1: #ff4500;
      --lava-2: #ff7a00;
      --lava-3: #ff2200;
      --lava-glow: rgba(255, 69, 0, 0.35);
      --lava-gradient: linear-gradient(135deg, #ff4500 0%, #ff7a00 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Google Fonts Icon formatting */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
      user-select: none;
    }

    /* Top Navigation Header */
    header {
      background: rgba(13, 15, 20, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand-flame {
      color: var(--lava-1);
      font-size: 28px;
      filter: drop-shadow(0 0 10px var(--lava-glow));
    }

    .brand .accent {
      background: var(--lava-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge.online .dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .status-badge.offline .dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 60px 20px;
    }

    /* Hero / Banner */
    .hero {
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Filter & Search Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    @media (min-width: 640px) {
      .controls {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 440px;
    }

    .search-box .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 20px;
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(255, 69, 0, 0.2);
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 10px;
      align-self: flex-start;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: var(--lava-gradient);
      color: #ffffff;
      box-shadow: 0 2px 12px var(--lava-glow);
    }

    .tab-btn:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-count {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
    }

    /* Single Scroll List */
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.15s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      border-color: rgba(255, 69, 0, 0.4);
      background: var(--bg-card-hover);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .game-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .game-icon-box {
      width: 44px;
      height: 44px;
      min-width: 44px;
      background: linear-gradient(135deg, #24191a 0%, #301718 100%);
      border: 1px solid rgba(255, 69, 0, 0.25);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lava-1);
    }

    .game-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .game-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .badge-dl {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: var(--success);
      font-weight: 600;
      font-size: 11px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-progress {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #f59e0b;
      font-weight: 600;
      font-size: 11px;
    }

    .game-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.2s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-play {
      background: var(--lava-gradient);
      color: #ffffff;
      box-shadow: 0 2px 10px var(--lava-glow);
    }

    .btn-play:hover {
      box-shadow: 0 4px 16px rgba(255, 69, 0, 0.5);
      background: linear-gradient(135deg, #ff5722 0%, #ff8a00 100%);
    }

    .btn-secondary {
      background: #1e2230;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: #272d40;
      color: var(--text-main);
      border-color: #3b435e;
    }

    .btn-icon {
      padding: 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .btn-icon:hover {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.4);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
    }

    .empty-state .material-symbols-outlined {
      font-size: 48px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .empty-state h3 {
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    /* Game Player Overlay */
    #player-view {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      flex-direction: column;
    }

    .player-header {
      background: #10121a;
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .player-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #000000;
    }

    /* Download progress bar inside item */
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: #232736;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--lava-gradient);
      width: 0%;
      transition: width 0.2s ease;
    }

</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="brand" onclick="switchTab('all'); return false;">
      <span class="material-symbols-outlined brand-flame">local_fire_department</span>
      <span>Lava<span class="accent">games</span></span>
    </a>

    <div class="header-stats">
      <div id="connectionStatus" class="status-badge online">
        <span class="dot"></span>
        <span id="connectionText">Online</span>
      </div>
      <div class="status-badge">
        <span class="material-symbols-outlined" style="font-size: 16px; color: var(--lava-1);">download</span>
        <span id="downloadCountLabel">0 Downloaded</span>
      </div>
    </div>
  </header>

  <!-- Main View -->
  <main id="main-content">
    <div class="hero">
      <h1>
        <span class="material-symbols-outlined" style="color: var(--lava-1); font-size: 32px;">sports_esports</span>
        Games Collection
      </h1>
      <p>Play instantly or download to your browser for fast offline play.</p>
    </div>

    <!-- Filter & Search Controls -->
    <div class="controls">
      <div class="tabs">
        <button id="tabAll" class="tab-btn active" onclick="switchTab('all')">
          <span class="material-symbols-outlined" style="font-size: 18px;">grid_view</span>
          <span>All Games</span>
          <span id="allCountBadge" class="tab-count">0</span>
        </button>
        <button id="tabDownloaded" class="tab-btn" onclick="switchTab('downloaded')">
          <span class="material-symbols-outlined" style="font-size: 18px;">download_for_offline</span>
          <span>Downloaded</span>
          <span id="dlCountBadge" class="tab-count">0</span>
        </button>
      </div>

      <div class="search-box">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="searchInput" placeholder="Search games..." oninput="handleSearch()" />
      </div>
    </div>

    <!-- The Single Scroll List -->
    <div id="gameList" class="game-list">
      <!-- Generated dynamically -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state" style="display: none;">
      <span class="material-symbols-outlined">search_off</span>
      <h3>No games found</h3>
      <p id="emptyStateDesc">Try adjusting your search query.</p>
    </div>
  </main>

  <!-- In-Page Player View -->
  <div id="player-view">
    <div class="player-header">
      <div class="player-header-left">
        <button class="btn btn-secondary" onclick="closePlayer()">
          <span class="material-symbols-outlined">arrow_back</span>
          <span>Back</span>
        </button>
        <span id="currentPlayerTitle" class="player-title">Playing Game</span>
      </div>

      <div class="player-header-right">
        <button class="btn btn-secondary" onclick="reloadPlayer()" title="Reload Game">
          <span class="material-symbols-outlined">refresh</span>
        </button>
        <button class="btn btn-secondary" onclick="toggleFullscreen()" title="Fullscreen">
          <span class="material-symbols-outlined">fullscreen</span>
        </button>
        <button class="btn btn-secondary" onclick="closePlayer()" title="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>

    <iframe id="gameIframe" class="player-iframe" allow="autoplay; fullscreen; camera; microphone; clipboard-read; clipboard-write; display-capture; geolocation"></iframe>
  </div>

  <script>
// IndexedDB + CacheStorage for Offline Games (Supports single-file & multi-part/asset games)
const GAME_DB_NAME = 'PinpointGamesDB';
const GAME_DB_VERSION = 1;
const GAME_STORE_NAME = 'games';
const GAME_CACHE_NAME = 'pinpoint-game-cache';
const RECOMMENDED_LIMIT_BYTES = 100 * 1024 * 1024; // 100 MB

const CDN_MIRRORS = [
    'https://cdn.jsdelivr.net',
    'https://fastly.jsdelivr.net',
    'https://gcore.jsdelivr.net',
    'https://testingcf.jsdelivr.net'
];
let activeMirror = CDN_MIRRORS[0];

async function autoSelectMirror() {
    for (const mirror of CDN_MIRRORS) {
        try {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), 3500);
            const res = await fetch(mirror + '/gh/pinpoint-edu/assets@main/textbooks/2048.html', {
                method: 'HEAD',
                signal: ctrl.signal
            });
            clearTimeout(to);
            if (res.ok) {
                activeMirror = mirror;
                console.log('[Lavagames] Connected to CDN mirror:', activeMirror);
                return;
            }
        } catch (e) {}
    }
}

const gameDbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(GAME_DB_NAME, GAME_DB_VERSION);

    request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(GAME_STORE_NAME)) {
            db.createObjectStore(GAME_STORE_NAME, { keyPath: 'id' });
        }
    };

    request.onsuccess = (event) => resolve(event.target.result);
    request.onerror = (event) => reject(event.target.error);
});

// Active in-flight downloads for crash/interruption cleanup and cancellation
const activeInFlightDownloads = new Map();
const activeControllers = new Map();

// Automatic cleanup if page refreshes or unloads during download
if (typeof window !== 'undefined') {
    const cleanInterrupted = () => {
        for (const [id, fileUrl] of activeInFlightDownloads.entries()) {
            try {
                // Record in session to purge on next startup if interrupted
                const current = JSON.parse(sessionStorage.getItem('pinpoint_pending_purges') || '[]');
                if (!current.some(item => item.id === id)) {
                    current.push({ id, fileUrl });
                    sessionStorage.setItem('pinpoint_pending_purges', JSON.stringify(current));
                }
            } catch(e) {}
        }
    };
    window.addEventListener('beforeunload', cleanInterrupted);
    window.addEventListener('pagehide', cleanInterrupted);

    // Run startup purge of any interrupted downloads
    setTimeout(async () => {
        try {
            const raw = sessionStorage.getItem('pinpoint_pending_purges');
            if (raw) {
                const purges = JSON.parse(raw);
                sessionStorage.removeItem('pinpoint_pending_purges');
                for (const item of purges) {
                    await PinpointGameStorage.deleteGame(item.id, item.fileUrl);
                }
            }
        } catch(e) {}
    }, 1000);
}

const PinpointGameStorage = {
    RECOMMENDED_LIMIT_BYTES,

    getManifest(fileUrl) {
        const norm = fileUrl.replace(/^\/+/, '');
        if (GAME_MANIFESTS[norm]) return GAME_MANIFESTS[norm];
        if (norm.endsWith('/index.html') && GAME_MANIFESTS[norm.replace('/index.html', '/')]) {
            return GAME_MANIFESTS[norm.replace('/index.html', '/')];
        }
        if (norm.endsWith('/') && GAME_MANIFESTS[norm + 'index.html']) {
            return GAME_MANIFESTS[norm + 'index.html'];
        }
        if (!norm.endsWith('/') && !norm.endsWith('.html') && GAME_MANIFESTS[norm + '/index.html']) {
            return GAME_MANIFESTS[norm + '/index.html'];
        }
        return ['/' + norm];
    },

    async isDownloaded(id) {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(!!req.result);
                req.onerror = () => resolve(false);
            });
        } catch(e) { return false; }
    },

    isDownloading(id) {
        return activeControllers.has(id);
    },

    cancelDownload(id) {
        if (activeControllers.has(id)) {
            const ctrl = activeControllers.get(id);
            ctrl.abort();
            activeControllers.delete(id);
            return true;
        }
        return false;
    },

    async getGame(id) {
        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readonly');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    },

    async getAllGames() {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve, reject) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        } catch(e) { return []; }
    },

    async downloadGame(id, title, fileUrl, onProgress) {
        if (activeControllers.has(id)) {
            throw new Error('Download already in progress');
        }

        const controller = new AbortController();
        activeControllers.set(id, controller);
        activeInFlightDownloads.set(id, fileUrl);

        const assets = this.getManifest(fileUrl);
        let cache = null;
        if (typeof caches !== 'undefined') {
            try {
                cache = await caches.open(GAME_CACHE_NAME);
            } catch(e) {
                console.warn('CacheStorage not accessible:', e);
            }
        }

        let totalBytes = 0;
        let mainContent = '';
        let completedAssets = 0;

        try {
            for (let i = 0; i < assets.length; i++) {
                const assetUrl = assets[i];
                if (controller.signal.aborted) {
                    const err = new Error('Download cancelled');
                    err.name = 'AbortError';
                    throw err;
                }

                const clean = assetUrl.replace(/^\/+/, '');
                const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];
                const candidateUrls = [
                    ...mirrors.map(m => m + '/gh/pinpoint-edu/assets@main/' + clean),
                    'https://raw.githubusercontent.com/pinpoint-edu/assets/main/' + clean
                ];

                let res = null;
                for (const url of candidateUrls) {
                    try {
                        const r = await fetch(url, { signal: controller.signal });
                        if (r.ok) {
                            const checkCl = r.headers.get('content-length');
                            if (checkCl && parseInt(checkCl, 10) < 300 && clean.endsWith('.html')) {
                                const previewText = await r.clone().text();
                                if (previewText.includes('Package size exceeded')) continue;
                            }
                            res = r;
                            for (const m of CDN_MIRRORS) {
                                if (url.startsWith(m)) {
                                    activeMirror = m;
                                    break;
                                }
                            }
                            break;
                        }
                    } catch(e) {}
                }

                if (!res) {
                    throw new Error(`Failed to download ${clean} from CDN mirrors.`);
                }

                const contentLength = parseInt(res.headers.get('content-length') || '0', 10);
                let assetBlob;

                if (res.body && typeof res.body.getReader === 'function' && contentLength > 0) {
                    const reader = res.body.getReader();
                    const chunks = [];
                    let receivedBytes = 0;

                    while (true) {
                        if (controller.signal.aborted) {
                            reader.cancel().catch(() => {});
                            const err = new Error('Download cancelled');
                            err.name = 'AbortError';
                            throw err;
                        }
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        receivedBytes += value.length;

                        const assetFraction = assets.length > 0 ? (i / assets.length) : 0;
                        const thisAssetProgress = (receivedBytes / contentLength) * (1 / assets.length);
                        const overallPercent = Math.min(99, Math.round((assetFraction + thisAssetProgress) * 100));

                        if (typeof onProgress === 'function') {
                            onProgress({
                                completed: i,
                                total: assets.length,
                                percent: overallPercent,
                                bytes: totalBytes + receivedBytes
                            });
                        }
                    }
                    assetBlob = new Blob(chunks);
                } else {
                    assetBlob = await res.blob();
                }

                totalBytes += assetBlob.size;

                if (cache) {
                    try {
                        const ext = assetUrl.split('.').pop().toLowerCase().split('?')[0];
                        const mimeMap = {
                            'wasm': 'application/wasm',
                            'js': 'application/javascript; charset=utf-8',
                            'json': 'application/json; charset=utf-8',
                            'swf': 'application/x-shockwave-flash',
                            'html': 'text/html; charset=utf-8',
                            'htm': 'text/html; charset=utf-8',
                            'css': 'text/css; charset=utf-8',
                            'png': 'image/png',
                            'jpg': 'image/jpeg',
                            'jpeg': 'image/jpeg',
                            'gif': 'image/gif',
                            'svg': 'image/svg+xml',
                            'ico': 'image/x-icon',
                            'webm': 'video/webm'
                        };

                        const headers = new Headers(res.headers);
                        if (mimeMap[ext]) {
                            headers.set('content-type', mimeMap[ext]);
                        }

                        const cacheRes = new Response(assetBlob, {
                            headers: headers,
                            status: 200,
                            statusText: 'OK'
                        });

                        const putKeys = new Set([
                            assetUrl,
                            new URL(assetUrl, window.location.href).href,
                            clean,
                            '/' + clean,
                            activeMirror + '/gh/pinpoint-edu/assets@main/' + clean,
                            'https://cdn.jsdelivr.net/gh/pinpoint-edu/assets@main/' + clean,
                            decodeURIComponent(assetUrl),
                            encodeURI(assetUrl)
                        ]);

                        if (assetUrl.endsWith('/index.html')) {
                            const dirPath = assetUrl.replace(/index\.html$/, '');
                            const dirNoSlash = dirPath.replace(/\/$/, '');
                            putKeys.add(dirPath);
                            putKeys.add(dirNoSlash);
                            putKeys.add(new URL(dirPath, window.location.href).href);
                            putKeys.add(new URL(dirNoSlash, window.location.href).href);
                        } else if (assetUrl.endsWith('/')) {
                            const indexPath = assetUrl + 'index.html';
                            const noSlash = assetUrl.replace(/\/$/, '');
                            putKeys.add(indexPath);
                            putKeys.add(noSlash);
                            putKeys.add(new URL(indexPath, window.location.href).href);
                            putKeys.add(new URL(noSlash, window.location.href).href);
                        }

                        for (const k of putKeys) {
                            try {
                                await cache.put(k, cacheRes.clone());
                            } catch(e) {}
                        }
                    } catch(err) {
                        console.warn('Could not cache asset in CacheStorage:', assetUrl, err);
                    }
                }

                if (assetUrl === fileUrl || assetUrl.endsWith('.html') || assetUrl.endsWith('/')) {
                    if (!mainContent) {
                        try {
                            mainContent = await assetBlob.text();
                        } catch(e) {}
                    }
                }

                completedAssets++;
                const overallPercent = Math.round((completedAssets / assets.length) * 100);
                if (typeof onProgress === 'function') {
                    onProgress({ completed: completedAssets, total: assets.length, percent: overallPercent, bytes: totalBytes });
                }
            }

            const db = await gameDbPromise;
            const record = await new Promise((resolve, reject) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
                const store = tx.objectStore(GAME_STORE_NAME);
                const gameRecord = {
                    id: id,
                    title: title,
                    fileUrl: fileUrl,
                    content: mainContent,
                    assets: assets,
                    sizeBytes: totalBytes,
                    downloadedAt: new Date().toISOString()
                };
                const req = store.put(gameRecord);
                req.onsuccess = () => resolve(gameRecord);
                req.onerror = () => reject(req.error);
            });

            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
            return record;

        } catch (downloadErr) {
            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
            try {
                await this.deleteGame(id, fileUrl);
            } catch (cleanupErr) {
                console.warn('Cleanup error after failed download:', cleanupErr);
            }
            throw downloadErr;
        }
    },

    async deleteGame(id, fileUrl) {
        // 1. Delete from CacheStorage
        if (typeof caches !== 'undefined') {
            try {
                const cache = await caches.open(GAME_CACHE_NAME);
                const assets = fileUrl ? this.getManifest(fileUrl) : [];
                for (const assetUrl of assets) {
                    const delKeys = [
                        assetUrl,
                        new URL(assetUrl, window.location.href).href,
                        assetUrl.replace(/^\/+/, ''),
                        decodeURIComponent(assetUrl),
                        encodeURI(assetUrl)
                    ];
                    if (assetUrl.endsWith('/index.html')) {
                        const dirPath = assetUrl.replace(/index\.html$/, '');
                        delKeys.push(dirPath, dirPath.replace(/\/$/, ''), new URL(dirPath, window.location.href).href);
                    } else if (assetUrl.endsWith('/')) {
                        const indexPath = assetUrl + 'index.html';
                        delKeys.push(indexPath, assetUrl.replace(/\/$/, ''), new URL(indexPath, window.location.href).href);
                    }
                    for (const k of delKeys) {
                        try { await cache.delete(k); } catch(e) {}
                    }
                }
            } catch(e) {
                console.warn('Error clearing CacheStorage:', e);
            }
        }

        // 2. Delete from IndexedDB
        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.delete(id);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    },

    async clearAllDownloads() {
        // 1. Clear entire game cache in CacheStorage
        if (typeof caches !== 'undefined') {
            try {
                await caches.delete(GAME_CACHE_NAME);
            } catch(e) {
                console.warn('Error deleting CacheStorage cache:', e);
            }
        }

        // 2. Clear entire object store in IndexedDB
        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.clear();
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    }
};

    ];

    let games = [...DEFAULT_GAMES];
    let downloadedGameIds = new Set();
    let currentTab = 'all'; // 'all' or 'downloaded'
    let currentPlayingFile = null;
    let activeProgressMap = new Map();

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getGameId(file) {
      return file.replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    // Initialize & Refresh Downloaded Status
    async function syncDownloadedStatus() {
      if (typeof PinpointGameStorage !== 'undefined') {
        try {
          const records = await PinpointGameStorage.getAllGames();
          downloadedGameIds = new Set(records.map(r => r.id));
        } catch(e) {
          console.warn('Could not read offline games from storage:', e);
        }
      }
      updateCounts();
      renderGames();
    }

    function updateCounts() {
      const allCount = games.length;
      const dlCount = downloadedGameIds.size;

      document.getElementById('allCountBadge').textContent = allCount;
      document.getElementById('dlCountBadge').textContent = dlCount;
      document.getElementById('downloadCountLabel').textContent = `${dlCount} Downloaded`;
    }

    // Switch between All Games and Downloaded tabs
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabAll').classList.toggle('active', tab === 'all');
      document.getElementById('tabDownloaded').classList.toggle('active', tab === 'downloaded');
      renderGames();
    }

    function handleSearch() {
      renderGames();
    }

    // Render the Single Scroll List of Games
    function renderGames() {
      const listContainer = document.getElementById('gameList');
      const emptyState = document.getElementById('emptyState');
      const emptyDesc = document.getElementById('emptyStateDesc');
      const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      let filtered = games.filter(g => {
        const id = getGameId(g.file);
        if (currentTab === 'downloaded' && !downloadedGameIds.has(id)) {
          return false;
        }
        if (query && !g.title.toLowerCase().includes(query)) {
          return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '';
        emptyState.style.display = 'block';
        if (currentTab === 'downloaded') {
          emptyDesc.textContent = query
            ? 'No downloaded games match your search.'
            : 'You have not saved any games for offline play yet. Click "Download" on any game to save it!';
        } else {
          emptyDesc.textContent = 'No games match your search query.';
        }
        return;
      }

      emptyState.style.display = 'none';

      let html = '';
      filtered.forEach(game => {
        const id = getGameId(game.file);
        const isDownloaded = downloadedGameIds.has(id);
        const isDownloading = typeof PinpointGameStorage !== 'undefined' && PinpointGameStorage.isDownloading(id);
        const progress = activeProgressMap.get(id);

        html += `
          <div class="game-card" id="card-${id}">
            <div class="game-left">
              <div class="game-icon-box">
                <span class="material-symbols-outlined">sports_esports</span>
              </div>
              <div class="game-details">
                <span class="game-title">${game.title}</span>
                <div class="game-meta">
                  <span>${formatBytes(game.sizeBytes)}</span>
                  ${isDownloaded ? `
                    <span class="badge-dl">
                      <span class="material-symbols-outlined" style="font-size: 14px;">check_circle</span>
                      Downloaded
                    </span>
                  ` : ''}
                  ${isDownloading ? `
                    <span class="badge-progress">
                      <span class="material-symbols-outlined" style="font-size: 14px; animation: spin 1s linear infinite;">sync</span>
                      ${progress !== undefined ? progress + '%' : 'Downloading...'}
                    </span>
                  ` : ''}
                </div>
                ${isDownloading ? `
                  <div class="progress-bar-wrap">
                    <div class="progress-bar-fill" style="width: ${progress || 5}%;"></div>
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="game-actions">
              <button class="btn btn-play" onclick="playGame('${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')">
                <span class="material-symbols-outlined">play_arrow</span>
                <span>Play</span>
              </button>

              ${isDownloaded ? `
                <button class="btn-icon" onclick="deleteGame('${id}', '${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')" title="Remove from Downloaded">
                  <span class="material-symbols-outlined">delete</span>
                </button>
              ` : isDownloading ? `
                <button class="btn btn-secondary" onclick="cancelDownload('${id}')" title="Cancel Download">
                  <span class="material-symbols-outlined">close</span>
                  <span>Cancel</span>
                </button>
              ` : `
                <button class="btn btn-secondary" onclick="startDownload('${id}', '${encodeURIComponent(game.title)}', '${encodeURIComponent(game.file)}')" title="Download for offline">
                  <span class="material-symbols-outlined">download</span>
                  <span>Download</span>
                </button>
              `}
            </div>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function prepareGameHtml(html, fileUrl) {
      let base = fileUrl.replace(/[^/]*$/, '');
      if (!base.endsWith('/')) base += '/';

      // 1. Inject <base href="..."> if not present
      if (!/<base\b/i.test(html)) {
        if (/<head([^>]*)>/i.test(html)) {
          html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
        } else {
          html = '<base href="' + base + '">' + html;
        }
      }

      // 2. Resolve root-relative paths (/...) to repo base
      try {
        const mRepo = base.match(/^(https?:\/\/[^/]+\/(?:gh\/[^/]+\/[^/@]+@[^/]+\/|[^/]+\/[^/]+\/[^/]+\/))/i);
        if (mRepo) {
          const repoBase = mRepo[1];
          html = html.replace(/(\s(?:src|href))=(['"])\/(?!\/)/gi, '$1=$2' + repoBase);
        }
      } catch (e) {}

      // 3. Normalize jsdelivr mirror domains to current active mirror
      html = html.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//g, activeMirror + '/');

      // 4. Inject fullscreen viewport styles into frame
      const frameStyle = '<style>html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#000;}.webgl-content,#gameContainer,#canvas{width:100%;height:100%;}</style>';
      if (/<head([^>]*)>/i.test(html)) {
        html = html.replace(/<head([^>]*)>/i, '<head$1>' + frameStyle);
      } else {
        html = frameStyle + html;
      }

      return html;
    }

    function writeGameIntoFrame(iframe, rawHtml, fileUrl) {
      const preparedHtml = prepareGameHtml(rawHtml, fileUrl);
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(preparedHtml);
      doc.close();
      try {
        iframe.contentWindow.focus();
      } catch(e) {}
    }

    async function fetchGameHtml(file) {
      const cleanPath = file.replace(/^\/+/, '');
      let fetchFile = cleanPath;
      if (fetchFile.endsWith('/')) {
        fetchFile += 'index.html';
      }

      // Priority list: active mirror first, then remaining CDN mirrors, then raw github
      const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];
      const urlsToTry = [
        ...mirrors.map(m => m + '/gh/pinpoint-edu/assets@main/' + fetchFile),
        'https://raw.githubusercontent.com/pinpoint-edu/assets/main/' + fetchFile
      ];

      for (const url of urlsToTry) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          const text = await res.text();
          if (text.includes('Package size exceeded') || text.includes('404: Not Found') || text.trim().startsWith('{"status": 4')) {
            continue;
          }
          for (const m of CDN_MIRRORS) {
            if (url.startsWith(m)) {
              activeMirror = m;
              break;
            }
          }
          return { html: text, resolvedUrl: url };
        } catch(e) {
          continue;
        }
      }
      throw new Error('Could not fetch game from any CDN mirror.');
    }

    // Play Game in the In-Page Player
    async function playGame(encodedFile, encodedTitle) {
      const file = decodeURIComponent(encodedFile);
      const title = decodeURIComponent(encodedTitle);
      const id = getGameId(file);

      currentPlayingFile = file;
      document.getElementById('currentPlayerTitle').textContent = title;
      document.getElementById('player-view').style.display = 'flex';

      const iframe = document.getElementById('gameIframe');

      // 1. Check if game is saved offline in IndexedDB
      if (typeof PinpointGameStorage !== 'undefined') {
        try {
          const record = await PinpointGameStorage.getGame(id);
          if (record && record.content && record.content.length > 50) {
            writeGameIntoFrame(iframe, record.content, activeMirror + '/gh/pinpoint-edu/assets@main/' + file);
            return;
          }
        } catch(e) {}
      }

      // 2. Show loading spinner while fetching
      iframe.srcdoc = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>
            body { background: #000; color: #ff5722; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
            .spinner { width: 36px; height: 36px; border: 4px solid #333; border-top: 4px solid #ff4500; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          </style>
        </head>
        <body>
          <div class="spinner"></div>
          <div>Loading ${title}...</div>
        </body>
        </html>
      `;

      // 3. Fetch game HTML and inject via doc.write
      try {
        const { html, resolvedUrl } = await fetchGameHtml(file);
        writeGameIntoFrame(iframe, html, resolvedUrl);
      } catch (err) {
        console.error('Play game error:', err);
        iframe.srcdoc = `
          <!DOCTYPE html>
          <html>
          <body style="background: #0d0f14; color: #f87171; font-family: sans-serif; padding: 30px; text-align: center;">
            <h3>Unable to load ${title}</h3>
            <p style="color: #9ca3af;">${err.message}</p>
            <p style="color: #6b7280; font-size: 13px;">If you are offline, make sure you download the game first.</p>
          </body>
          </html>
        `;
      }
    }

    function closePlayer() {
      const iframe = document.getElementById('gameIframe');
      iframe.src = 'about:blank';
      document.getElementById('player-view').style.display = 'none';
      currentPlayingFile = null;
    }

    function reloadPlayer() {
      if (currentPlayingFile) {
        const title = document.getElementById('currentPlayerTitle').textContent;
        playGame(encodeURIComponent(currentPlayingFile), encodeURIComponent(title));
      }
    }

    function toggleFullscreen() {
      const playerEl = document.getElementById('player-view');
      if (!document.fullscreenElement) {
        if (playerEl.requestFullscreen) {
          playerEl.requestFullscreen();
        } else if (playerEl.webkitRequestFullscreen) {
          playerEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Download Game for Offline
    async function startDownload(id, encodedTitle, encodedFile) {
      const title = decodeURIComponent(encodedTitle);
      const file = decodeURIComponent(encodedFile);

      if (typeof PinpointGameStorage === 'undefined') {
        alert('Offline storage database is not available.');
        return;
      }

      activeProgressMap.set(id, 0);
      renderGames();

      try {
        await PinpointGameStorage.downloadGame(id, title, file, (progress) => {
          activeProgressMap.set(id, progress.percent || 0);
          const card = document.getElementById('card-' + id);
          if (card) {
            const fill = card.querySelector('.progress-bar-fill');
            if (fill) fill.style.width = (progress.percent || 0) + '%';
            const badge = card.querySelector('.badge-progress');
            if (badge) badge.innerHTML = `<span class="material-symbols-outlined" style="font-size: 14px; animation: spin 1s linear infinite;">sync</span> ${progress.percent}%`;
          }
        });

        activeProgressMap.delete(id);
        downloadedGameIds.add(id);
        updateCounts();
        renderGames();
      } catch (err) {
        activeProgressMap.delete(id);
        console.error('Download error:', err);
        if (err.name !== 'AbortError') {
          alert('Failed to download ' + title + ': ' + err.message);
        }
        renderGames();
      }
    }

    function cancelDownload(id) {
      if (typeof PinpointGameStorage !== 'undefined') {
        PinpointGameStorage.cancelDownload(id);
      }
      activeProgressMap.delete(id);
      renderGames();
    }

    async function deleteGame(id, encodedFile, encodedTitle) {
      const file = decodeURIComponent(encodedFile);
      const title = decodeURIComponent(encodedTitle);

      if (!confirm(`Remove "${title}" from Downloaded games?`)) {
        return;
      }

      if (typeof PinpointGameStorage !== 'undefined') {
        try {
          await PinpointGameStorage.deleteGame(id, file);
        } catch(e) {
          console.warn('Delete error:', e);
        }
      }

      downloadedGameIds.delete(id);
      updateCounts();
      renderGames();
    }

    // Network Status Listeners
    function updateOnlineStatus() {
      const isOnline = navigator.onLine;
      const statusEl = document.getElementById('connectionStatus');
      const textEl = document.getElementById('connectionText');

      if (isOnline) {
        statusEl.className = 'status-badge online';
        textEl.textContent = 'Online';
      } else {
        statusEl.className = 'status-badge offline';
        textEl.textContent = 'Offline';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Initial fetch of games.json to supplement fallback
    async function initGames() {
      await autoSelectMirror();
      try {
        const res = await fetch('games.json');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            games = data;
          }
        }
      } catch(e) {
        console.log('Using default embedded games list');
      }

      updateOnlineStatus();
      await syncDownloadedStatus();
    }

    // Escape key closes player view
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('player-view').style.display === 'flex') {
        closePlayer();
      }
    });

    initGames();
  </script>
