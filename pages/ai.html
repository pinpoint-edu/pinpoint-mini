<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashbin AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z'/></svg>">

  <!-- Google Fonts: Geist, Libre Baskerville, Material Symbols Sharp -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border: #27272a;
      --border-hover: #3f3f46;
      --border-focus: #ffffff;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #ffffff;
      --success: #22c55e;
      --danger: #ef4444;
      --parabola-ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Headings and Big Text use Libre Baskerville */
    h1, h2, h3, h4, .brand-name, .logo-title, .header-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      letter-spacing: -0.02em;
    }

    /* Material Symbols Sharp */
    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }

    /* Header */
    header {
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }

    .btn-squircle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 14px;
      height: 36px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #fafafa;
    }

    .btn-squircle:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: translateY(-1px);
    }

    .btn-squircle:active {
      transform: scale(0.96);
    }

    .btn-squircle.btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      justify-content: center;
    }

    /* Backwards compatibility for any btn-sharp references */
    .btn-sharp {
      border-radius: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: #18181b;
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .status-pill .dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    /* Chat Messages Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 100px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      scrollbar-width: thin;
      scrollbar-color: #27272a transparent;
    }

    .chat-inner {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Welcome Banner */
    .welcome-card {
      text-align: center;
      padding: 40px 20px 20px 20px;
      margin-bottom: 8px;
    }

    .welcome-icon {
      font-size: 44px;
      color: #ffffff;
      margin-bottom: 12px;
      display: inline-block;
    }

    .welcome-card h2 {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .welcome-card p {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 480px;
      margin: 0 auto 24px auto;
    }

    .prompt-suggestions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .prompt-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 7px 14px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .prompt-chip:hover {
      background: var(--bg-card);
      border-color: #ffffff;
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Message Rows */
    .msg-row {
      display: flex;
      width: 100%;
      gap: 12px;
      animation: fadeIn 0.2s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.assistant {
      justify-content: flex-start;
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: #18181b;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      color: #ffffff;
      transition: all 0.2s ease;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.6;
      word-break: break-word;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .msg-row.user .msg-bubble {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: #fafafa;
      border-bottom-left-radius: 4px;
    }

    .msg-bubble pre {
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 14px;
      padding: 12px 16px;
      margin: 10px 0;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13px;
    }

    .msg-bubble code {
      background: #27272a;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
    }

    .msg-bubble p:not(:last-child) {
      margin-bottom: 8px;
    }

    /* Thinking Dots */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 8px 12px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #a1a1aa;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Floating Pill Input Box (Yolk-style) */
    .input-bar-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 780px;
      padding: 0 20px;
      z-index: 20;
    }

    .input-pill-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 9999px;
      padding: 6px 8px 6px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      transition: all 0.2s ease;
    }

    .input-pill-box:focus-within {
      border-color: #ffffff;
      box-shadow: 0 0 0 1px #ffffff, 0 12px 40px rgba(0, 0, 0, 0.8);
      background: #18181b;
    }

    #chatInput {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    #chatInput::placeholder {
      color: var(--text-dim);
    }

    .send-pill-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .send-pill-btn:hover:not(:disabled) {
      background: #e4e4e7;
      transform: scale(1.04);
    }

    .send-pill-btn:disabled {
      background: #27272a;
      color: #52525b;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-left">
      <a href="index.html" class="btn-squircle" title="Back to Trashbin Games">
        <span class="material-symbols-sharp">arrow_back</span>
        <span>Trashbin</span>
      </a>
      <div class="brand-link">
        <span class="material-symbols-sharp" style="color: #60a5fa;">psychology</span>
        <span class="brand-name">Trashbin AI</span>
      </div>
    </div>

    <div class="header-right">
      <div class="status-pill">
        <span class="dot"></span>
        <span>Llama 3.3 Active</span>
      </div>
      <button class="btn-squircle" onclick="clearConversation()" title="Clear Chat">
        <span class="material-symbols-sharp">delete</span>
        <span>Clear</span>
      </button>
      <button class="btn-squircle btn-icon" onclick="promptApiKey()" title="Custom Groq API Key">
        <span class="material-symbols-sharp">key</span>
      </button>
    </div>
  </header>

  <!-- Messages -->
  <div id="chat-container">
    <div class="chat-inner" id="chatHistory">
      <!-- Welcome card -->
      <div class="welcome-card" id="welcomeCard">
        <div style="display: flex; justify-content: center; margin-bottom: 16px;">
          <div style="width: 64px; height: 64px; border-radius: 18px; background: #18181b; border: 1px solid #27272a; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
            <span class="material-symbols-sharp" style="font-size: 34px; color: #60a5fa;">psychology</span>
          </div>
        </div>
        <h2>How can I help you today?</h2>
        <p>Instant answers, coding support, homework solutions, and study assistance.</p>
        <div class="prompt-suggestions">
          <button class="prompt-chip" onclick="usePrompt('Explain how game physics engines work simply')">Physics engines</button>
          <button class="prompt-chip" onclick="usePrompt('Write a clean JavaScript Snake game')">Code a Snake game</button>
          <button class="prompt-chip" onclick="usePrompt('Help me study for a math test on quadratics')">Quadratic equations</button>
          <button class="prompt-chip" onclick="usePrompt('What are the best tips to study effectively?')">Study tips</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Input Bar -->
  <div class="input-bar-container">
    <div class="input-pill-box">
      <input 
        type="text" 
        id="chatInput" 
        placeholder="Ask Trashbin AI anything..." 
        autocomplete="off" 
      />
      <button id="sendBtn" class="send-pill-btn" onclick="sendMessage()">
        <span class="material-symbols-sharp" style="font-size: 20px;">arrow_upward</span>
      </button>
    </div>
  </div>

  <script>
    const chatHistory = document.getElementById('chatHistory');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const welcomeCard = document.getElementById('welcomeCard');

    let messageHistory = [
      { role: "system", content: "You are Trashbin AI, an intelligent, concise, sharp, and helpful assistant designed for students and developers. Answer accurately and format code with markdown." }
    ];

    function promptApiKey() {
      const current = localStorage.getItem('pinpoint_groq_key') || '';
      const entered = prompt("Enter your personal Groq API key for faster, higher-rate inference (optional):", current);
      if (entered !== null) {
        if (entered.trim()) {
          localStorage.setItem('pinpoint_groq_key', entered.trim());
          alert("Groq API key saved successfully!");
        } else {
          localStorage.removeItem('pinpoint_groq_key');
          alert("Custom API key removed. Using built-in Trashbin AI engine.");
        }
      }
    }

    function clearConversation() {
      messageHistory = [
        { role: "system", content: "You are Trashbin AI, an intelligent, concise, sharp, and helpful assistant designed for students and developers. Answer accurately and format code with markdown." }
      ];
      chatHistory.innerHTML = '';
      if (welcomeCard) {
        chatHistory.appendChild(welcomeCard);
      }
      chatInput.value = '';
      chatInput.focus();
    }

    function usePrompt(text) {
      chatInput.value = text;
      sendMessage();
    }

    function appendMessage(text, role) {
      if (welcomeCard && welcomeCard.parentNode) {
        welcomeCard.remove();
      }

      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      if (role === 'assistant') {
        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.innerHTML = '<span class="material-symbols-sharp" style="font-size: 18px; color: #60a5fa;">psychology</span>';
        row.appendChild(avatar);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      if (role === 'assistant') {
        if (window.marked) {
          bubble.innerHTML = marked.parse(text);
        } else {
          bubble.textContent = text;
        }
      } else {
        bubble.textContent = text;
      }

      row.appendChild(bubble);
      chatHistory.appendChild(row);
      scrollToBottom();
    }

    function scrollToBottom() {
      const c = document.getElementById('chat-container');
      c.scrollTop = c.scrollHeight;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      messageHistory.push({ role: "user", content: text });

      chatInput.value = '';
      sendBtn.disabled = true;

      // Show typing indicator
      const typingRow = document.createElement('div');
      typingRow.className = 'msg-row assistant';
      typingRow.id = 'typingIndicator';
      typingRow.innerHTML = `
        <div class="msg-avatar"><span class="material-symbols-sharp" style="font-size: 18px; color: #60a5fa;">psychology</span></div>
        <div class="msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>
      `;
      chatHistory.appendChild(typingRow);
      scrollToBottom();

      let aiText = null;
      const customKey = (localStorage.getItem('pinpoint_groq_key') || '').trim();

      // Strategy 1: User's Groq key if available
      if (customKey) {
        try {
          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${customKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'llama-3.3-70b-versatile',
              messages: messageHistory,
              temperature: 0.7,
              max_tokens: 1500
            })
          });
          if (res.ok) {
            const data = await res.json();
            aiText = data.choices[0]?.message?.content;
          }
        } catch(e) {}
      }

      // Strategy 2: Serverless /api/chat (if hosted on Vercel)
      if (!aiText && location.protocol !== 'file:') {
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: messageHistory })
          });
          if (res.ok) {
            const data = await res.json();
            aiText = data.choices[0]?.message?.content;
          }
        } catch(e) {}
      }

      // Strategy 3: Free CORS-friendly Pollinations AI endpoint (guaranteed to work everywhere including file:// and GAS)
      if (!aiText) {
        try {
          const res = await fetch('https://text.pollinations.ai/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              messages: messageHistory,
              model: 'openai'
            })
          });
          if (res.ok) {
            aiText = await res.text();
          }
        } catch(e) {}
      }

      const indicator = document.getElementById('typingIndicator');
      if (indicator) indicator.remove();

      if (aiText) {
        appendMessage(aiText, 'assistant');
        messageHistory.push({ role: "assistant", content: aiText });
      } else {
        appendMessage("Sorry, I encountered an error connecting to the AI service. Please check your internet connection or provide a Groq API key.", 'assistant');
      }

      sendBtn.disabled = false;
      chatInput.focus();
    }

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    chatInput.focus();
  </script>
</body>
</html>
