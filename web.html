<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trashbin Web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-card: #18181b;
      --bg-card-hover: #222226;
      --border: #27272a;
      --border-hover: #3f3f46;
      --border-focus: #ffffff;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    h1, h2, h3, .brand-name {
      font-family: 'Libre Baskerville', Georgia, serif;
      letter-spacing: -0.02em;
    }

    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp' !important;
      font-weight: normal;
      font-style: normal;
      font-size: 19px;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
    }

    /* Browser Top Toolbar */
    .web-toolbar {
      height: 56px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      flex-shrink: 0;
      z-index: 20;
    }

    .nav-return-home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-return-home-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-hover);
      color: #ffffff;
    }

    .nav-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .nav-icon-btn:hover:not(:disabled) {
      background: var(--bg-card);
      border-color: var(--border);
      color: var(--text-main);
    }

    .nav-icon-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Omnibox Address Bar */
    .omnibox-form {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 38px;
      padding: 0 6px 0 12px;
      gap: 8px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 160px;
    }

    .omnibox-form:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }

    .omnibox-lock {
      color: #22c55e;
      font-size: 16px;
      flex-shrink: 0;
    }

    .omnibox-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
      min-width: 0;
    }

    .omnibox-input::placeholder {
      color: var(--text-dim);
    }

    .omnibox-go-btn {
      height: 26px;
      padding: 0 10px;
      border-radius: 8px;
      border: none;
      background: #ffffff;
      color: #09090b;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s ease;
      flex-shrink: 0;
    }

    .omnibox-go-btn:hover {
      opacity: 0.9;
    }

    /* Mode Selector Pill */
    .engine-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .engine-select {
      height: 36px;
      padding: 0 28px 0 11px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s ease;
    }

    .engine-select:hover, .engine-select:focus {
      border-color: var(--border-hover);
    }

    .engine-select-arrow {
      position: absolute;
      right: 7px;
      pointer-events: none;
      color: var(--text-muted);
      font-size: 16px;
    }

    /* Loading Progress Bar */
    .loading-bar {
      height: 2px;
      width: 100%;
      background: transparent;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .loading-bar.active::after {
      content: "";
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #10b981, #ffffff, transparent);
      animation: webLoadAnim 1.1s infinite ease-in-out;
    }

    @keyframes webLoadAnim {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    /* Main Content Area */
    .web-main {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
    }

    /* New Tab Home Screen */
    .newtab-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      overflow-y: auto;
      text-align: center;
    }

    .newtab-card {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .newtab-title {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
    }

    .hero-search-form {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 8px 6px 16px;
      gap: 10px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      transition: border-color 0.2s ease;
    }

    .hero-search-form:focus-within {
      border-color: #ffffff;
    }

    .hero-search-input {
      flex: 1;
      height: 40px;
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .hero-search-btn {
      height: 40px;
      padding: 0 18px;
      border-radius: 11px;
      border: none;
      background: #ffffff;
      color: #09090b;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .hero-search-btn:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }

    .quick-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .quick-tile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .quick-tile:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    .quick-tile-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .engine-cards {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: left;
    }

    .engine-info-card {
      background: rgba(24, 24, 27, 0.65);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .engine-info-card:hover, .engine-info-card.selected {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.07);
    }

    .engine-info-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .engine-info-desc {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
    }

    /* Viewport Iframe */
    #webViewport {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: none;
      flex: 1;
    }

    @media (max-width: 640px) {
      .engine-cards {
        grid-template-columns: 1fr;
      }
      .nav-return-home-btn span:not(.material-symbols-sharp) {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Browser Bar -->
  <header class="web-toolbar">
    <button class="nav-return-home-btn" onclick="returnToMainHome()" title="Return to Trashbin Home">
      <span class="material-symbols-sharp" style="font-size: 16px;">arrow_back</span>
      <span>Home</span>
    </button>

    <button class="nav-icon-btn" id="btnBack" onclick="goBack()" title="Back" disabled>
      <span class="material-symbols-sharp">chevron_left</span>
    </button>
    <button class="nav-icon-btn" id="btnForward" onclick="goForward()" title="Forward" disabled>
      <span class="material-symbols-sharp">chevron_right</span>
    </button>
    <button class="nav-icon-btn" id="btnReload" onclick="reloadPage()" title="Reload">
      <span class="material-symbols-sharp">refresh</span>
    </button>
    <button class="nav-icon-btn" onclick="showNewTab()" title="Start Page">
      <span class="material-symbols-sharp">home</span>
    </button>

    <form class="omnibox-form" id="omniboxForm">
      <span class="material-symbols-sharp omnibox-lock" id="omniboxIcon">encrypted</span>
      <input
        type="text"
        id="omniboxInput"
        class="omnibox-input"
        placeholder="Search DuckDuckGo or enter any URL (e.g. wikipedia.org)..."
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit" class="omnibox-go-btn">Go</button>
    </form>

    <button class="nav-icon-btn" onclick="popOutCurrent()" title="Open in New Tab">
      <span class="material-symbols-sharp">open_in_new</span>
    </button>
  </header>

  <div class="loading-bar" id="loadingBar"></div>

  <!-- Main Workspace -->
  <div class="web-main">
    <div class="newtab-screen" id="newtabScreen">
      <div class="newtab-card">
        <h1 class="newtab-title">Trashbin Web</h1>

        <form class="hero-search-form" id="heroSearchForm">
          <span class="material-symbols-sharp" style="color: var(--text-muted);">travel_explore</span>
          <input
            type="text"
            id="heroSearchInput"
            class="hero-search-input"
            placeholder="Search the web or type a URL..."
            autocomplete="off"
            spellcheck="false"
          />
          <button type="submit" class="hero-search-btn">
            <span>Browse</span>
            <span class="material-symbols-sharp" style="font-size: 17px;">arrow_forward</span>
          </button>
        </form>
      </div>
    </div>

    <iframe id="webViewport" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe>
  </div>

  <script>
    const OHIO_DOMAIN = "https://ohio-notes.broshan.com.np";
    const EDGE_DOMAIN = "https://trashbin-web.yolkmusic.workers.dev";

    const omniboxInput = document.getElementById("omniboxInput");
    const heroSearchInput = document.getElementById("heroSearchInput");
    const newtabScreen = document.getElementById("newtabScreen");
    const viewport = document.getElementById("webViewport");
    const loadingBar = document.getElementById("loadingBar");

    let navHistory = [];
    let navIndex = -1;
    let currentTargetUrl = "";
    let ohioReachable = null;
    let cfReachable = null;
    let gasBridgeAvailable = false;

    function returnToMainHome() {
      if (window.parent && window.parent !== window && typeof window.parent.closePlayer === "function") {
        window.parent.closePlayer();
      } else {
        window.location.href = "index.html";
      }
    }

    function normalizeTargetUrl(raw) {
      let v = (raw || "").trim();
      if (!v) return "";
      if (/^https?:\/\//i.test(v)) return v;
      if (/^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+(\/.*)?$/.test(v) && !v.includes(" ")) {
        return "https://" + v;
      }
      return "https://duckduckgo.com/?q=" + encodeURIComponent(v);
    }

    function setLoading(isLoading) {
      loadingBar.classList.toggle("active", !!isLoading);
    }

    function updateNavButtons() {
      document.getElementById("btnBack").disabled = navIndex <= 0;
      document.getElementById("btnForward").disabled = navIndex >= navHistory.length - 1;
    }

    function checkGasBridge() {
      try {
        if (window.__TRASHBIN_GAS_LAUNCHER__ || (window.parent && window.parent.__TRASHBIN_GAS_LAUNCHER__) || (window.top && window.top.__TRASHBIN_GAS_LAUNCHER__)) {
          gasBridgeAvailable = true;
          return true;
        }
        if (window.top && window.top.opener) {
          gasBridgeAvailable = true;
          return true;
        }
      } catch (e) {}
      return false;
    }

    async function probeNodes() {
      checkGasBridge();
      const checkUrl = async (url) => {
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 3000);
          const r = await fetch(url, { method: "HEAD", mode: "cors", signal: ctrl.signal });
          clearTimeout(t);
          return r.ok || r.status < 500;
        } catch (e) {
          return false;
        }
      };
      const [ohioOk, cfOk] = await Promise.all([
        checkUrl(OHIO_DOMAIN + "/version.json"),
        checkUrl(EDGE_DOMAIN + "/")
      ]);
      ohioReachable = ohioOk;
      cfReachable = cfOk;
    }

    function getAutoEngine() {
      if (cfReachable !== false) return "cf";
      if (ohioReachable !== false) return "ohio";
      return "gas";
    }

    function rewriteHtmlForClientSrcdoc(html, baseUrl) {
      html = html.replace(/<meta[^>]*http-equiv\s*=\s*(['"]?)(?:content-security-policy|x-frame-options)\1[^>]*>/gi, "");
      html = html.replace(/\s+integrity\s*=\s*(['"])[^'"]*\1/gi, "");
      const baseTag = `<base href="${baseUrl}">`;
      const hookScript = `<script>
        (function(){
          var BASE = ${JSON.stringify(baseUrl)};
          function toAbs(u) {
            try { return new URL(u, BASE).href; } catch(e) { return u; }
          }
          document.addEventListener("click", function(e) {
            var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
            if (!a) return;
            var h = a.getAttribute("href");
            if (!h || h.charAt(0) === "#" || h.indexOf("javascript:") === 0) return;
            e.preventDefault();
            window.parent.postMessage({ type: "TB_CLIENT_NAV", url: toAbs(h) }, "*");
          }, true);
          document.addEventListener("submit", function(e) {
            var form = e.target;
            if (!form || form.tagName !== "FORM") return;
            e.preventDefault();
            var act = toAbs(form.getAttribute("action") || BASE);
            var fd = new FormData(form);
            var u = new URL(act);
            fd.forEach(function(v, k) { if (typeof v === "string") u.searchParams.set(k, v); });
            window.parent.postMessage({ type: "TB_CLIENT_NAV", url: u.href }, "*");
          }, true);
        })();
      <\/script>`;
      if (/<head[^>]*>/i.test(html)) {
        return html.replace(/<head([^>]*)>/i, `<head$1>${baseTag}${hookScript}`);
      }
      return baseTag + hookScript + html;
    }

    function fetchViaDocsReader(targetUrl) {
      return new Promise((resolve, reject) => {
        const reqId = "web_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        let settled = false;

        const handler = (event) => {
          if (!event.data || event.data.type !== "TB_WEB_RESULT" || event.data.reqId !== reqId) return;
          settled = true;
          window.removeEventListener("message", handler);
          if (event.data.result && event.data.result.body) {
            resolve(event.data.result);
          } else {
            reject(new Error((event.data.result && event.data.result.error) || "Reader Error"));
          }
        };
        window.addEventListener("message", handler);

        let sentToOpener = false;
        try {
          const openerWin = (window.top && window.top.opener) || window.opener;
          if (openerWin) {
            openerWin.postMessage({ type: "TB_WEB_FETCH", reqId, url: targetUrl }, "*");
            sentToOpener = true;
          }
        } catch (e) {}

        setTimeout(async () => {
          if (settled) return;
          window.removeEventListener("message", handler);
          try {
            const res = await fetch(OHIO_DOMAIN + "/api/web?format=json&url=" + encodeURIComponent(targetUrl));
            if (res.ok) {
              const data = await res.json();
              if (data && data.body) return resolve(data);
            }
          } catch (e1) {}
          try {
            const res2 = await fetch(EDGE_DOMAIN + "/browse?format=json&url=" + encodeURIComponent(targetUrl));
            if (res2.ok) {
              const data2 = await res2.json();
              if (data2 && data2.body) return resolve(data2);
            }
          } catch (e2) {}
          reject(new Error(sentToOpener ? "Docs Reader timed out" : "Launch via Google Apps Script to use Docs Reader when offline from Edge nodes."));
        }, sentToOpener ? 9000 : 100);
      });
    }

    async function navigateWeb(rawInput, pushHistory = true) {
      const target = normalizeTargetUrl(rawInput);
      if (!target) return;

      currentTargetUrl = target;
      omniboxInput.value = target;
      heroSearchInput.value = target;

      if (pushHistory) {
        navHistory = navHistory.slice(0, navIndex + 1);
        navHistory.push(target);
        navIndex = navHistory.length - 1;
        updateNavButtons();
      }

      newtabScreen.style.display = "none";
      viewport.style.display = "block";
      setLoading(true);

      const chosenEngine = getAutoEngine();

      try {
        if (chosenEngine === "cf") {
          viewport.removeAttribute("srcdoc");
          viewport.src = EDGE_DOMAIN + "/browse?url=" + encodeURIComponent(target);
          return;
        }

        if (chosenEngine === "ohio") {
          viewport.removeAttribute("srcdoc");
          viewport.src = OHIO_DOMAIN + "/api/web?mode=browse&url=" + encodeURIComponent(target);
          return;
        }

        if (chosenEngine === "gas") {
          viewport.removeAttribute("src");
          viewport.srcdoc = `<body style="background:#09090b;color:#a1a1aa;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">Loading...</body>`;
          const res = await fetchViaDocsReader(target);
          const rewritten = rewriteHtmlForClientSrcdoc(res.body, res.finalUrl || target);
          viewport.srcdoc = rewritten;
          setLoading(false);
          return;
        }
      } catch (err) {
        setLoading(false);
        viewport.removeAttribute("src");
        viewport.srcdoc = `<!DOCTYPE html><html><body style="background:#09090b;color:#fafafa;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;"><div style="background:#18181b;border:1px solid #27272a;padding:28px;border-radius:18px;max-width:460px;text-align:center;"><h3 style="color:#ef4444;margin:0 0 10px;">Connection Error</h3><p style="color:#a1a1aa;font-size:14px;line-height:1.5;margin:0;">${err.message || "Failed to load target URL."}</p></div></body></html>`;
      }
    }

    function launchUrl(u) {
      navigateWeb(u, true);
    }

    function showNewTab() {
      viewport.style.display = "none";
      viewport.removeAttribute("src");
      viewport.removeAttribute("srcdoc");
      newtabScreen.style.display = "flex";
      currentTargetUrl = "";
      omniboxInput.value = "";
      setLoading(false);
    }

    function goBack() {
      if (navIndex > 0) {
        navIndex--;
        updateNavButtons();
        navigateWeb(navHistory[navIndex], false);
      }
    }

    function goForward() {
      if (navIndex < navHistory.length - 1) {
        navIndex++;
        updateNavButtons();
        navigateWeb(navHistory[navIndex], false);
      }
    }

    function reloadPage() {
      if (currentTargetUrl) {
        navigateWeb(currentTargetUrl, false);
      }
    }

    function popOutCurrent() {
      const target = currentTargetUrl || normalizeTargetUrl(omniboxInput.value) || "https://duckduckgo.com";
      const win = window.open("about:blank", "_blank");
      if (!win) return;
      const chosenEngine = getAutoEngine();
      const iframeUrl = chosenEngine === "ohio"
        ? (OHIO_DOMAIN + "/api/web?mode=browse&url=" + encodeURIComponent(target))
        : (EDGE_DOMAIN + "/browse?url=" + encodeURIComponent(target));
      win.document.open();
      win.document.write(
        `<!DOCTYPE html><html><head><title>Home - Classroom</title><link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png"><style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0;background:#09090b;overflow:hidden;}</style></head><body><iframe src="${iframeUrl}" allow="fullscreen; autoplay; clipboard-read; clipboard-write"></iframe></body></html>`
      );
      win.document.close();
    }

    viewport.addEventListener("load", () => {
      setLoading(false);
    });

    document.getElementById("omniboxForm").addEventListener("submit", (e) => {
      e.preventDefault();
      navigateWeb(omniboxInput.value, true);
    });

    document.getElementById("heroSearchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      navigateWeb(heroSearchInput.value, true);
    });

    window.addEventListener("message", (event) => {
      const d = event.data;
      if (!d || typeof d !== "object") return;
      if (d.type === "TB_WEB_URL_CHANGE" && d.url) {
        currentTargetUrl = d.url;
        omniboxInput.value = d.url;
        setLoading(false);
      } else if (d.type === "TB_CLIENT_NAV" && d.url) {
        navigateWeb(d.url, true);
      }
    });

    probeNodes();
    const urlParam = new URLSearchParams(window.location.search).get("url");
    if (urlParam) {
      navigateWeb(urlParam, true);
    }
  </script>
</body>
</html>
