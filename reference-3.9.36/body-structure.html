// IndexedDB + CacheStorage for Offline Games (Supports single-file & multi-part/asset games)
const GAME_DB_NAME = 'TrashbinGamesDB';
const GAME_DB_VERSION = 1;
const GAME_STORE_NAME = 'games';
const GAME_CACHE_NAME = 'trashbin-game-cache';
const RECOMMENDED_LIMIT_BYTES = 100 * 1024 * 1024; // 100 MB

const CDN_MIRRORS = [
    'https://cdn.jsdelivr.net',
    'https://fastly.jsdelivr.net',
    'https://quantil.jsdelivr.net',
    'https://testingcf.jsdelivr.net',
    'https://originfastly.jsdelivr.net',
    'https://gcore.jsdelivr.net'
];
let activeMirror = CDN_MIRRORS[0];

async function autoSelectMirror() {
    for (const mirror of CDN_MIRRORS) {
        try {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), 3500);
            const res = await fetch(mirror + '/gh/pinpoint-edu/assets@main/textbooks/2048.html', {
                method: 'HEAD',
                signal: ctrl.signal
            });
            clearTimeout(to);
            if (res.ok) {
                activeMirror = mirror;
                console.log('[Trashbin] Connected to CDN mirror:', activeMirror);
                return;
            }
        } catch (e) {}
    }
}

// Open IndexedDB
const gameDbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(GAME_DB_NAME, GAME_DB_VERSION);
    req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(GAME_STORE_NAME)) {
            const store = db.createObjectStore(GAME_STORE_NAME, { keyPath: 'id' });
            store.createIndex('title', 'title', { unique: false });
            store.createIndex('downloadedAt', 'downloadedAt', { unique: false });
        }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => reject(req.error);
});

const activeControllers = new Map();
const activeInFlightDownloads = new Map();

// Periodic storage quota check
if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.estimate) {
    setInterval(async () => {
        try {
            const est = await navigator.storage.estimate();
            if (est.quota && est.usage && (est.quota - est.usage < 15 * 1024 * 1024)) {
                const all = await PinpointGameStorage.getAllGames();
                all.sort((a, b) => new Date(a.downloadedAt) - new Date(b.downloadedAt));
                if (all.length > 0) {
                    const item = all[0];
                    await PinpointGameStorage.deleteGame(item.id, item.fileUrl);
                }
            }
        } catch(e) {}
    }, 20000);
}

const PinpointGameStorage = {
    RECOMMENDED_LIMIT_BYTES,

    getManifest(fileUrl) {
        if (GAME_MANIFESTS[fileUrl]) return GAME_MANIFESTS[fileUrl];
        const norm = fileUrl.replace(/^\/+/, '');
        if (GAME_MANIFESTS[norm]) return GAME_MANIFESTS[norm];
        if (norm.endsWith('/index.html') && GAME_MANIFESTS[norm.replace('/index.html', '/')]) {
            return GAME_MANIFESTS[norm.replace('/index.html', '/')];
        }
        if (norm.endsWith('/') && GAME_MANIFESTS[norm + 'index.html']) {
            return GAME_MANIFESTS[norm + 'index.html'];
        }
        if (!norm.endsWith('/') && !norm.endsWith('.html') && GAME_MANIFESTS[norm + '/index.html']) {
            return GAME_MANIFESTS[norm + '/index.html'];
        }
        if (/^https?:\/\//i.test(fileUrl)) return [fileUrl];
        return ['/' + norm];
    },

    async isDownloaded(id) {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(!!req.result);
                req.onerror = () => resolve(false);
            });
        } catch(e) { return false; }
    },

    async getGame(id) {
        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readonly');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    },

    async getAllGames() {
        try {
            const db = await gameDbPromise;
            return new Promise((resolve) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readonly');
                const store = tx.objectStore(GAME_STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result || []);
                req.onerror = () => resolve([]);
            });
        } catch(e) { return []; }
    },

    async downloadGame(id, title, fileUrl, onProgress) {
        if (activeControllers.has(id)) {
            throw new Error('Download already in progress');
        }

        const controller = new AbortController();
        activeControllers.set(id, controller);
        activeInFlightDownloads.set(id, fileUrl);

        const assets = this.getManifest(fileUrl);
        let cache = null;
        if (typeof caches !== 'undefined') {
            try {
                cache = await caches.open(GAME_CACHE_NAME);
            } catch(e) {
                console.warn('CacheStorage not accessible:', e);
            }
        }

        let totalBytes = 0;
        let mainContent = '';
        let completedAssets = 0;

        try {
            for (let i = 0; i < assets.length; i++) {
                const assetUrl = assets[i];
                if (controller.signal.aborted) {
                    const err = new Error('Download cancelled');
                    err.name = 'AbortError';
                    throw err;
                }

                const clean = assetUrl.replace(/^\/+/, '');
                // Skip directories and ad/tracker domains
                if (!clean || clean.endsWith('/') || /google\.com|googletagmanager|google-analytics|gamedistribution|poki\.com|crazygames|gameanalytics/i.test(assetUrl)) {
                    completedAssets++;
                    continue;
                }

                let candidateUrls = [];
                if (/^https?:\/\//i.test(assetUrl)) {
                    let mirrorUrl = assetUrl;
                    if (mirrorUrl.includes('matheveryday25/math/truck')) {
                        mirrorUrl = mirrorUrl.replace('/math/truck', '/math@main/truck');
                    }
                    if (mirrorUrl.includes('jsdelivr.net')) {
                        mirrorUrl = mirrorUrl.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//i, activeMirror + '/');
                    }
                    candidateUrls = [mirrorUrl, assetUrl];
                    if (assetUrl.includes('jsdelivr.net/gh/')) {
                        const rawGh = assetUrl.replace(/https?:\/\/[^/]*\.jsdelivr\.net\/gh\/([^/@]+)\/([^/@]+)(?:@[^/]+)?\//, 'https://raw.githubusercontent.com/$1/$2/main/').replace('/math/truck', '/math/main/truck');
                        candidateUrls.push(rawGh);
                    }
                } else {
                    const isMini = clean.startsWith('yolk/') || clean.startsWith('movies/') || clean === 'ai.html' || clean === 'web.html' || clean.startsWith('pages/') || clean.includes('superhot') || clean.includes('tetrominoes') || clean.includes('tetris');
                    const primaryRepo = isMini ? 'pinpoint-edu/pinpoint-mini@main/' : 'pinpoint-edu/assets@main/';
                    const fallbackRepo = isMini ? 'pinpoint-edu/assets@main/' : 'pinpoint-edu/pinpoint-mini@main/';
                    const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];
                    candidateUrls = [
                        ...mirrors.map(m => m + '/gh/' + primaryRepo + clean),
                        'https://cdn.statically.io/gh/' + primaryRepo + clean,
                        'https://raw.githubusercontent.com/' + primaryRepo.replace('@main/', '/main/') + clean,
                        ...mirrors.map(m => m + '/gh/' + fallbackRepo + clean),
                        'https://raw.githubusercontent.com/' + fallbackRepo.replace('@main/', '/main/') + clean
                    ];
                }

                let res = null;
                for (const url of candidateUrls) {
                    try {
                        const r = await fetch(url, { signal: controller.signal });
                        if (r.ok) {
                            const checkCl = r.headers.get('content-length');
                            if (checkCl && parseInt(checkCl, 10) < 300 && clean.endsWith('.html')) {
                                const previewText = await r.clone().text();
                                if (previewText.includes('Package size exceeded') || previewText.includes('limit of 20 MB')) continue;
                            }
                            res = r;
                            for (const m of CDN_MIRRORS) {
                                if (url.startsWith(m)) {
                                    activeMirror = m;
                                    break;
                                }
                            }
                            break;
                        }
                    } catch(e) {}
                }

                if (!res) {
                    if (i === 0) {
                        throw new Error(`Failed to download ${clean} from CDN mirrors.`);
                    }
                    console.warn(`Optional asset ${clean} not found, continuing download...`);
                    completedAssets++;
                    continue;
                }

                const contentLength = parseInt(res.headers.get('content-length') || '0', 10);
                let assetBlob;

                if (res.body && typeof res.body.getReader === 'function' && contentLength > 0) {
                    const reader = res.body.getReader();
                    const chunks = [];
                    let receivedBytes = 0;

                    while (true) {
                        if (controller.signal.aborted) {
                            reader.cancel().catch(() => {});
                            const err = new Error('Download cancelled');
                            err.name = 'AbortError';
                            throw err;
                        }
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        receivedBytes += value.length;
                        totalBytes += value.length;

                        if (typeof onProgress === 'function') {
                            const assetPart = (receivedBytes / contentLength) / assets.length;
                            const overallPercent = Math.min(99, Math.round(((completedAssets / assets.length) + assetPart) * 100));
                            onProgress({
                                percent: overallPercent,
                                loaded: receivedBytes,
                                total: contentLength,
                                assetIndex: i + 1,
                                assetTotal: assets.length
                            });
                        }
                    }

                    assetBlob = new Blob(chunks, { type: res.headers.get('content-type') || 'application/octet-stream' });
                } else {
                    assetBlob = await res.blob();
                    totalBytes += assetBlob.size;
                }

                if (i === 0 && (clean.endsWith('.html') || clean.endsWith('/'))) {
                    mainContent = await assetBlob.text();
                }

                if (cache) {
                    const cacheUrls = [
                        assetUrl,
                        new URL(assetUrl, window.location.href).href,
                        clean,
                        '/' + clean
                    ];
                    for (const cu of cacheUrls) {
                        try {
                            await cache.put(cu, new Response(assetBlob.slice(), {
                                headers: {
                                    'Content-Type': res.headers.get('content-type') || 'application/octet-stream',
                                    'Content-Length': assetBlob.size.toString()
                                }
                            }));
                        } catch(ce) {}
                    }
                }

                completedAssets++;
                if (typeof onProgress === 'function') {
                    const overallPercent = Math.min(99, Math.round((completedAssets / assets.length) * 100));
                    onProgress({
                        percent: overallPercent,
                        assetIndex: completedAssets,
                        assetTotal: assets.length
                    });
                }
            }

            if (typeof onProgress === 'function') {
                onProgress({ percent: 100, assetIndex: assets.length, assetTotal: assets.length });
            }

            const db = await gameDbPromise;
            const record = await new Promise((resolve, reject) => {
                const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
                const store = tx.objectStore(GAME_STORE_NAME);
                const gameRecord = {
                    id: id,
                    title: title,
                    fileUrl: fileUrl,
                    content: mainContent,
                    assets: assets,
                    sizeBytes: totalBytes,
                    downloadedAt: new Date().toISOString()
                };
                const req = store.put(gameRecord);
                req.onsuccess = () => resolve(gameRecord);
                req.onerror = () => reject(req.error);
            });

            return record;

        } catch (downloadErr) {
            try {
                await this.deleteGame(id, fileUrl);
            } catch (cleanupErr) {
                console.warn('Cleanup error after failed download:', cleanupErr);
            }
            throw downloadErr;
        } finally {
            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
        }
    },

    async deleteGame(id, fileUrl) {
        if (typeof caches !== 'undefined') {
            try {
                const cache = await caches.open(GAME_CACHE_NAME);
                const assets = fileUrl ? this.getManifest(fileUrl) : [];
                for (const assetUrl of assets) {
                    const delKeys = [
                        assetUrl,
                        new URL(assetUrl, window.location.href).href,
                        assetUrl.replace(/^\/+/, ''),
                        decodeURIComponent(assetUrl),
                        encodeURI(assetUrl)
                    ];
                    if (assetUrl.endsWith('/index.html')) {
                        const dirPath = assetUrl.replace(/index\.html$/, '');
                        delKeys.push(dirPath, '/' + dirPath.replace(/^\/+/, ''));
                    }
                    for (const k of delKeys) {
                        await cache.delete(k);
                    }
                }
            } catch(e) {}
        }

        const db = await gameDbPromise;
        return new Promise((resolve, reject) => {
            const tx = db.transaction([GAME_STORE_NAME], 'readwrite');
            const store = tx.objectStore(GAME_STORE_NAME);
            const req = store.delete(id);
            req.onsuccess = () => resolve(true);
            req.onerror = () => reject(req.error);
        });
    },

    cancelDownload(id) {
        if (activeControllers.has(id)) {
            activeControllers.get(id).abort();
            activeControllers.delete(id);
            activeInFlightDownloads.delete(id);
        }
    },

    isDownloading(id) {
        return activeControllers.has(id);
    }
};

let games = [...DEFAULT_GAMES];
let downloadedGameIds = new Set();
let currentTab = 'all'; // 'all' or 'downloaded'
let currentPlayingFile = null;
let currentPlayingTitle = null;
let activeProgressMap = new Map();
let searchDebounceTimer = null;

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function getGameId(file) {
  return file.replace(/[^a-zA-Z0-9_-]/g, '_');
}

async function syncDownloadedStatus() {
  if (typeof PinpointGameStorage !== 'undefined') {
    try {
      const records = await PinpointGameStorage.getAllGames();
      downloadedGameIds = new Set(records.map(r => r.id));
    } catch(e) {
      console.warn('Could not read offline games from storage:', e);
    }
  }
  updateCounts();
  if (document.body.classList.contains('is-searching')) {
    renderGames();
  }
}

function updateCounts() {
  const allCount = games.length;
  const dlCount = downloadedGameIds.size;

  const bAll = document.getElementById('allCountBadge');
  const bDl = document.getElementById('dlCountBadge');
  const lDl = document.getElementById('downloadCountLabel');

  if (bAll) bAll.textContent = allCount;
  if (bDl) bDl.textContent = dlCount;
  if (lDl) lDl.textContent = dlCount;
}

function selectChip(tab) {
  currentTab = tab;
  document.getElementById('chipAll').classList.toggle('active', tab === 'all');
  document.getElementById('chipDownloaded').classList.toggle('active', tab === 'downloaded');
  document.getElementById('resultsCategoryLabel').textContent = tab === 'downloaded' ? 'Downloaded Games' : 'All Games';
  activateSearchState();
  renderGames();
}

function focusSearch() {
  document.getElementById('searchInput').focus();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  resetToCenterHome();
}

function updateResultsPosition() {
  const sb = document.getElementById('search-block');
  const rc = document.getElementById('results-container');
  if (sb && rc && document.body.classList.contains('is-searching')) {
    const bottom = sb.getBoundingClientRect().bottom;
    rc.style.top = Math.max(134, Math.round(bottom + 12)) + 'px';
  }
}

function activateSearchState() {
  document.body.classList.add('is-searching');
  setTimeout(updateResultsPosition, 40);
  setTimeout(updateResultsPosition, 250);
  setTimeout(updateResultsPosition, 650);
}

function resetToCenterHome() {
  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  document.body.classList.remove('is-searching');
  const rc = document.getElementById('results-container');
  if (rc) rc.style.top = '';
  currentTab = null;
  const chipAll = document.getElementById('chipAll');
  const chipDl = document.getElementById('chipDownloaded');
  if (chipAll) chipAll.classList.remove('active');
  if (chipDl) chipDl.classList.remove('active');
  const catLabel = document.getElementById('resultsCategoryLabel');
  if (catLabel) catLabel.textContent = 'All Games';
}

function triggerBrowseAll() {
  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
  const searchInput = document.getElementById('searchInput');
  if (searchInput) searchInput.value = '';
  document.getElementById('clearSearchBtn').style.display = 'none';
  activateSearchState();
  renderGames();
}

// Instant typing handler (0ms delay for seamless instant search)
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const val = searchInput.value;
  document.getElementById('clearSearchBtn').style.display = val ? 'flex' : 'none';

  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);

  if (!val.trim()) {
    resetToCenterHome();
    return;
  }

  activateSearchState();
  renderGames();
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
    activateSearchState();
    renderGames();
  }
});

// Render results
function renderGames() {
  const listContainer = document.getElementById('gameList');
  const emptyState = document.getElementById('emptyState');
  const emptyDesc = document.getElementById('emptyStateDesc');
  const summaryLabel = document.getElementById('resultsSummaryLabel');
  const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = games.filter(g => {
    const id = getGameId(g.file);
    if (currentTab === 'downloaded' && !downloadedGameIds.has(id)) {
      return false;
    }
    if (query && !g.title.toLowerCase().includes(query)) {
      return false;
    }
    return true;
  });

  const showPinnedTop = localStorage.getItem('trashbin_show_pinned_top') !== 'false';
  if (showPinnedTop) {
    filtered.sort((a, b) => {
      const aPinned = isGamePinned(a.title) ? 1 : 0;
      const bPinned = isGamePinned(b.title) ? 1 : 0;
      return bPinned - aPinned;
    });
  }

  if (summaryLabel) {
    summaryLabel.textContent = `${filtered.length} games`;
  }

  if (filtered.length === 0) {
    listContainer.innerHTML = '';
    emptyState.style.display = 'block';
    if (currentTab === 'downloaded') {
      emptyDesc.textContent = query
        ? 'No downloaded games match your search.'
        : 'No offline games yet. Click "Download" on any game to save it.';
    } else {
      emptyDesc.textContent = 'No games match your search query.';
    }
    return;
  }

  emptyState.style.display = 'none';

  let html = '';
  filtered.forEach(game => {
    const id = getGameId(game.file);
    const isDownloaded = downloadedGameIds.has(id);
    const isDownloading = typeof PinpointGameStorage !== 'undefined' && PinpointGameStorage.isDownloading(id);
    const progress = activeProgressMap.get(id);
    const isPinned = isGamePinned(game.title);
    const isMossGame = (game.file && game.file.startsWith('movies/')) || (game.title && game.title.includes('Moss'));

    html += `
      <div class="game-card" id="card-${id}" onclick="playGame('${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')">
        <div class="game-left">
          <div class="game-details">
            <span class="game-title ${isMossGame ? 'moss-title-tag' : ''}">${game.title}</span>
            <div class="game-meta">
              <span>${game.isApp ? 'Web App' : formatBytes(game.sizeBytes)}</span>
              ${isPinned ? `
                <span class="badge-pinned">
                  <span class="material-symbols-sharp" style="font-size: 13px;">keep</span>
                  Pinned
                </span>
              ` : ''}
              ${isDownloaded ? `
                <span class="badge-dl">
                  <span class="material-symbols-sharp" style="font-size: 14px;">check_circle</span>
                  Downloaded
                </span>
              ` : ''}
              ${isDownloading ? `
                <span class="badge-progress">
                  <span class="material-symbols-sharp" style="font-size: 14px; animation: spin 1s linear infinite;">sync</span>
                  ${progress !== undefined ? progress + '%' : 'Downloading...'}
                </span>
              ` : ''}
            </div>
            ${isDownloading ? `
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width: ${progress || 5}%;"></div>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="game-actions">
          <button class="btn-icon-sharp btn-pin-toggle ${isPinned ? 'pinned-active' : ''}" onclick="event.stopPropagation(); togglePinGame('${encodeURIComponent(game.title)}')" title="${isPinned ? 'Unpin game' : 'Pin to top'}">
            <span class="material-symbols-sharp" style="font-size: 16px;">${isPinned ? 'keep' : 'keep_public'}</span>
          </button>

          <button class="btn-sharp btn-primary-sharp" onclick="event.stopPropagation(); playGame('${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')">
            <span class="material-symbols-sharp">${game.isApp ? 'open_in_new' : 'play_arrow'}</span>
            <span>${game.isApp ? 'Open' : 'Play'}</span>
          </button>

          ${isGameDownloadable(game.file, game.isApp) ? (isDownloaded ? `
            <button class="btn-icon-sharp" onclick="event.stopPropagation(); deleteGame('${id}', '${encodeURIComponent(game.file)}', '${encodeURIComponent(game.title)}')" title="Remove">
              <span class="material-symbols-sharp">delete</span>
            </button>
          ` : isDownloading ? `
            <button class="btn-sharp" onclick="event.stopPropagation(); cancelDownload('${id}')" title="Cancel">
              <span class="material-symbols-sharp">close</span>
              <span>Cancel</span>
            </button>
          ` : `
            <button class="btn-icon-sharp" onclick="event.stopPropagation(); startDownload('${id}', '${encodeURIComponent(game.title)}', '${encodeURIComponent(game.file)}')" title="Download for offline">
              <span class="material-symbols-sharp">download</span>
            </button>
          `) : ''}
        </div>
      </div>
    `;
  });

  listContainer.innerHTML = html;
}

function prepareGameHtml(html, fileUrl) {
  let base = fileUrl.replace(/[^/]*$/, '');
  if (!base.endsWith('/')) base += '/';

  // CRITICAL: raw.githubusercontent.com serves CSS/JS as text/plain with X-Content-Type-Options: nosniff
  // which causes browsers to block stylesheets and scripts! Always convert raw.githubusercontent.com base to CDN mirror!
  if (base.includes('raw.githubusercontent.com/')) {
    base = base.replace('https://raw.githubusercontent.com/', activeMirror + '/gh/').replace('/main/', '@main/');
  }

  let repoBase = base;
  const mRepo = base.match(/^(https?:\/\/[^/]+\/(?:gh\/[^/]+\/[^/@]+@[^/]+\/|[^/]+\/[^/]+\/[^/]+\/))/i);
  if (mRepo) {
    repoBase = mRepo[1];
  }
  if (fileUrl.includes('movies/')) {
    repoBase = base;
  }

  // Strip dead preceding HTML shell if concatenated (e.g., Minecraft PE duplicate shells)
  const docTypeRegex = /<!DOCTYPE\s+html>/gi;
  const matches = [...html.matchAll(docTypeRegex)];
  if (matches.length > 1) {
    const lastIdx = matches[matches.length - 1].index;
    const prevText = html.substring(0, lastIdx);
    if (/<\/html>\s*$/i.test(prevText.trim())) {
      html = html.substring(lastIdx);
    }
  }

  // Strip Google Gadget / Module XML wrappers if outer shell (e.g. Russia, Google Sites games)
  if (html.includes('<module') || html.includes('<Module') || html.includes('<![CDATA[') || html.includes('[CDATA[')) {
    const cdataMatch = html.match(/(?:<!(?:--)?\[CDATA\[|<!--\[CDATA\[)([\s\S]*?)(?:\]\](?:-->)?|\]\]&gt;|\]\]>)/i);
    if (cdataMatch && cdataMatch[1] && cdataMatch[1].trim().length > 50) {
      const modStart = html.search(/<module/i);
      const modEnd = html.search(/<\/module>/i);
      if (modStart !== -1 && modEnd !== -1) {
        const beforeMod = html.substring(0, modStart);
        const afterMod = html.substring(modEnd + 9);
        html = beforeMod + cdataMatch[1] + afterMod;
      }
    }
    html = html.replace(/<module[^>]*>[\s\S]*?<content[^>]*>(?:<!--|<!(?:--)?)?\[CDATA\[/gi, '')
               .replace(/(?:\]\](?:-->)?|\]\]&gt;|\]\]>)\s*<\/content>\s*<\/moduleprefs>\s*<\/module>/gi, '')
               .replace(/<\/?(?:module|moduleprefs|content)\b[^>]*>/gi, '');
  }

  // Strip dead blob scripts
  html = html.replace(/<script[^>]*src=["']blob:https?:[^"']*["'][^>]*>\s*<\/script>/gi, '');

  // Strip broken wrapper scripts that fail with 404 / ERR_FILE_NOT_FOUND
  html = html.replace(/<script[^>]*src=["'][^"']*(?:all\.js|settings\/js\/index\.js)[^"']*["'][^>]*>\s*<\/script>/gi, '');

  // Protect car-soccer asset matcher from throwing if map is undefined
  html = html.replace(/function matchAsset\s*\(([^)]*)\)\s*\{/g, 'function matchAsset($1){ if(!map)return null;');

  // Neutralize baseOrigin script override in Flash HTML games so they never target googleusercontent.com
  html = html.replace(/let\s+baseOrigin\s*=\s*[^;]+;/g, 'let baseOrigin = ' + JSON.stringify(repoBase.replace(/\/+$/, '')) + ';');
  html = html.replace(/var\s+baseOrigin\s*=\s*[^;]+;/g, 'var baseOrigin = ' + JSON.stringify(repoBase.replace(/\/+$/, '')) + ';');

  // If the game already has an explicit absolute <base href="..."> (like Minecraft Pocket Edition, Gorilla Tag, Flying Gorilla)
  // use that base URL instead of the container page URL!
  const mBase = html.match(/(<base\b[^>]*\bhref\s*=\s*)(['"])(.*?)\2/i);
  if (mBase) {
    const existingHref = mBase[3];
    if (/^https?:\/\//i.test(existingHref)) {
      base = existingHref;
      if (!base.endsWith('/')) base += '/';
      repoBase = base;
      const mR = base.match(/^(https?:\/\/[^/]+\/(?:gh\/[^/]+\/[^/@]+@[^/]+\/|[^/]+\/[^/]+\/[^/]+\/))/i);
      if (mR) repoBase = mR[1];
    } else {
      let resolvedBase = base;
      if (existingHref.startsWith('/')) {
        resolvedBase = repoBase + existingHref.replace(/^\/+/, '');
      } else {
        try {
          resolvedBase = new URL(existingHref, base).href;
        } catch(e) {
          resolvedBase = base + existingHref;
        }
      }
      if (!resolvedBase.endsWith('/')) resolvedBase += '/';
      base = resolvedBase;
      html = html.replace(/(<base\b[^>]*\bhref\s*=\s*)(['"])(.*?)\2/i, (m, p1, p2) => p1 + p2 + resolvedBase + p2);
    }
  } else {
    const isMoviesApp = fileUrl.includes('movies/');
    if (!isMoviesApp) {
      const lower = html.toLowerCase();
      const firstScript = lower.indexOf('<script');
      const firstHead = lower.indexOf('<head');
      const hasRealHead = firstHead !== -1 && (firstScript === -1 || firstHead < firstScript);
      if (hasRealHead) {
        html = html.replace(/<head([^>]*)>/i, (m, p1) => '<head' + p1 + '><base href="' + base + '">');
      } else {

    '          var blob = new Blob([blobCode], { type: "application/javascript" });',
    '          var blobUrl = URL.createObjectURL(blob);',
    '          return new OrigWorker(blobUrl, options);',
    '        } catch(e){}',
    '      }',
    '      return new OrigWorker(resolved, options);',
    '    };',
    '    window.Worker.prototype = OrigWorker.prototype;',
    '  }',
    '} catch(e){}',
    'try {',
    '  var origScriptSrc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, "src");',
    '  if(origScriptSrc && origScriptSrc.set){',
    '    Object.defineProperty(HTMLScriptElement.prototype, "src", {',
    '      set: function(v){ if(typeof v==="string"){ if(v.indexOf("all.js")!==-1 || v.indexOf("settings/js")!==-1) return origScriptSrc.set.call(this, "data:application/javascript,"); v = fix(v); } return origScriptSrc.set.call(this, v); },',
    '      get: function(){ return origScriptSrc.get.call(this); }',
    '    });',
    '  }',
    '} catch(e){}',
    'if(typeof window.fetch!=="undefined"){',
    '  var _f=window.fetch;',
    '  window.fetch=function(inp,init){',
    '    var u = typeof inp==="string" ? inp : (inp && inp.href ? inp.href : (inp && inp.url ? inp.url : ""));',
     '    if(typeof inp!=="string" && inp && inp.href && !inp.url){ inp = u; }',
    '    if(u.indexOf("all.js")!==-1 || u.indexOf("settings/js")!==-1){ return Promise.resolve(new Response("", {status: 200, headers: {"Content-Type": "application/javascript"}})); }',
    '    var targetUrl=fix(u);',
    '    if(targetUrl.endsWith("/textbooks/basket-random/") || targetUrl.endsWith("/textbooks/basket-random")){',
    '      return Promise.resolve(new Response("<!DOCTYPE html><html></html>", {status: 200, headers: {"Content-Type": "text/html"}}));',
    '    }',
    '    var req = (typeof inp==="string" || !inp) ? targetUrl : new Request(targetUrl, inp);',
    '    return _f.call(this,req,init).then(function(res){',
    '      if(!res.ok && (res.status===403 || res.status===404) && typeof targetUrl==="string" && targetUrl.indexOf("cdn.jsdelivr.net/gh/")!==-1){',
    '        if(!targetUrl.endsWith("/")){',
    '          try {',
    '            var parts = targetUrl.split("cdn.jsdelivr.net/gh/")[1].split("/");',
    '            var user = parts[0];',
    '            var repo = parts[1].split("@")[0];',
    '            var rest = parts.slice(2).join("/");',
    '            var rawUrl = "https://raw.githubusercontent.com/" + user + "/" + repo + "/main/" + rest;',
    '            if(rawUrl!==targetUrl){',
    '              var fbReq=(typeof inp==="string" || !inp) ? rawUrl : new Request(rawUrl, inp);',
    '              return _f.call(window, fbReq, init);',
    '            }',
    '          } catch(e){}',
    '        }',
    '      }',
    '      return res;',
    '    });',
    '  };',
    '}',
    'if(typeof XMLHttpRequest!=="undefined"){',
    '  var _o=XMLHttpRequest.prototype.open;',
    '  XMLHttpRequest.prototype.open=function(method,url,async,user,pass){',
    '    var targetUrl=fix(url);',
    '    return _o.call(this,method,targetUrl,async!==false,user,pass);',
    '  };',
    '}'
  ].join('\n');

  const interceptScript = '<scr' + 'ipt>(function(){\n' + innerScriptBody + '\n})()</scr' + 'ipt>';

  const lowerHtml = html.toLowerCase();
  const earlyScript = lowerHtml.indexOf('<script');
  const earlyHead = lowerHtml.indexOf('<head');
  const hasRealHeadTag = earlyHead !== -1 && (earlyScript === -1 || earlyHead < earlyScript);

  if (hasRealHeadTag) {
    html = html.replace(/<head([^>]*)>/i, (m, p1) => '<head' + p1 + '>' + interceptScript + frameStyle);
  } else {
    html = interceptScript + frameStyle + html;
  }

  // 3. Resolve root-relative paths in HTML attributes
  html = html.replace(/(\s(?:src|href))=(['"])\/(?!\/)/gi, (m, p1, p2) => p1 + '=' + p2 + repoBase);

  // 3b. Rewrite dynamic module imports and modulepreloads for movies
  if (fileUrl.includes('movies/')) {
    html = html.replace(/import\((['"])\/?_app\//g, (m, q) => 'import(' + q + repoBase + '_app/');
    html = html.replace(/(<link[^>]*\bhref\s*=\s*)(['"])(\/?_app\/[^'"]*)\2/gi, (m, p1, q, p2) => p1 + q + repoBase + p2.replace(/^\/+/, '') + q);
    html = html.replace(/(<link[^>]*\bhref\s*=\s*)(['"])assets\//gi, '$1$2' + repoBase + 'assets/');
    html = html.replace(/(<script[^>]*\bsrc\s*=\s*)(['"])assets\//gi, '$1$2' + repoBase + 'assets/');
  }

  // 3c. Rewrite ruffle script tags to self-hosted pinpoint-mini bundle
  html = html.replace(/(<script[^>]*\bsrc\s*=\s*)(['"])[^'"]*ruffle(?:\.min)?\.js\2/gi, '$1$2' + repoBase + 'textbooks/ruffle/ruffle.js$2');

  // 4. Normalize jsdelivr mirror domains to current active mirror
  html = html.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//g, activeMirror + '/');

  return html;
}


// Push the active tint into themable embedded apps (Moss, Soundboard, AI). Yolk is intentionally never themed.
function themeCssForTint(tint) {
  if (!tint) return "";
  let css = `:root{--accent:${tint.color} !important;--accent-hover:${tint.light || tint.color} !important;--accent-light:${tint.light || tint.color} !important;--accent-glow:${tint.glow || tint.color + "66"} !important;--accent-subtle:${tint.subtle || tint.color + "22"} !important;--accent-badge-bg:${tint.badgeBg || tint.color + "33"} !important;--accent-border:${tint.border || tint.color + "55"} !important;--border-focus:${tint.color} !important;`;
  if (tint.color2) {
    const c2 = tint.color2;
    css += `--bg-base:color-mix(in srgb, ${c2} 7%, #09090b) !important;--bg-surface:color-mix(in srgb, ${c2} 10%, #121215) !important;--bg-card:color-mix(in srgb, ${c2} 14%, #18181b) !important;--bg-card-hover:color-mix(in srgb, ${c2} 20%, #222226) !important;--border:color-mix(in srgb, ${c2} 35%, #27272a) !important;--border-subtle:color-mix(in srgb, ${c2} 35%, #27272a) !important;`;
  }
  return css + "}";
}

function pushThemeToFrames() {
  const frame = document.getElementById("gameIframe");
  if (!frame) return;
  try {
    const f = (typeof lastPlayingGame !== "undefined" && lastPlayingGame && lastPlayingGame.file) || "";
    if (!(f.startsWith("movies/") || f === "ai.html" || f === "web.html" || f.includes("Soundboard.html"))) return;
    const doc = frame.contentDocument;
    if (!doc || !doc.head) return;
    let st = doc.getElementById("trashbin-theme-style");
    if (!st) { st = doc.createElement("style"); st.id = "trashbin-theme-style"; doc.head.appendChild(st); }
    st.textContent = themeCssForTint(window.__currentTint);
  } catch (e) {}
}

function writeGameIntoFrame(iframe, rawHtml, fileUrl) {
  const preparedHtml = prepareGameHtml(rawHtml, fileUrl);
  try {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(preparedHtml);
    doc.close();
    if (/movies\/|ai\.html|web\.html|Soundboard\.html/.test(fileUrl) && !/yolk\//.test(fileUrl)) {
      try {
        const st = doc.createElement("style");
        st.id = "trashbin-theme-style";
        st.textContent = themeCssForTint(window.__currentTint);
        (doc.head || doc.documentElement).appendChild(st);
      } catch(e2) {}
    }
  } catch(e) {
    console.warn("doc.write failed, falling back to srcdoc:", e);
    iframe.srcdoc = preparedHtml;
  }
  try {
    iframe.contentWindow.focus();
  } catch(e) {}
  setTimeout(checkAndApplyStretchedRes, 250);
  setTimeout(checkAndApplyStretchedRes, 1000);
}

async function fetchGameHtml(file) {
  if (/^https?:\/\//i.test(file)) {
    let mirrorUrl = file;
    if (file.includes('jsdelivr.net')) {
      mirrorUrl = file.replace(/https?:\/\/[^/]*\.jsdelivr\.net\//i, activeMirror + '/');
    }
    try {
      const res = await fetch(mirrorUrl);
      if (res.ok) {
        const text = await res.text();
        if (!text.includes('Package size exceeded') && !text.includes('limit of 20 MB') && !text.includes('404: Not Found')) {
          return { html: text, resolvedUrl: mirrorUrl };
        }
      }
    } catch(e) {}
    try {
      const res2 = await fetch(file);
      if (res2.ok) {
        const text = await res2.text();
        if (!text.includes('Package size exceeded') && !text.includes('limit of 20 MB') && !text.includes('404: Not Found')) {
          return { html: text, resolvedUrl: file };
        }
      }
    } catch(e) {}
    if (file.includes('jsdelivr.net/gh/')) {
      const rawUrl = file.replace(/https?:\/\/[^/]*\.jsdelivr\.net\/gh\/([^/@]+)\/([^/@]+)(?:@[^/]+)?\//i, 'https://raw.githubusercontent.com/$1/$2/main/');
      try {
        const res3 = await fetch(rawUrl);
        if (res3.ok) {
          const text = await res3.text();
          return { html: text, resolvedUrl: rawUrl };
        }
      } catch(e) {}
    }
    throw new Error('Could not fetch game from ' + file);
  }

  const cleanPath = file.replace(/^\/+/, '');
  let fetchFile = cleanPath;
  if (fetchFile.endsWith('/')) {
    fetchFile += 'index.html';
  }

  // First try direct local / relative fetch (only when running on local dev: file://, localhost, or Vercel)
  const isLocalDev = typeof location !== 'undefined' && (location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.endsWith('.vercel.app') || location.hostname.endsWith('.broshan.com.np'));
  if (isLocalDev) {
    try {
      const localRes = await fetch(fetchFile);
      if (localRes.ok) {
        const text = await localRes.text();
        if (!text.includes('Package size exceeded') && !text.includes('limit of 20 MB') && !text.includes('404: Not Found') && !text.trim().startsWith('{"status": 4')) {
          let localResolved = fetchFile;
          try {
            localResolved = new URL(fetchFile, window.location.href).href;
          } catch(e) {}
          return { html: text, resolvedUrl: localResolved };
        }
      }
    } catch(e) {}
  }

  const mirrors = [activeMirror, ...CDN_MIRRORS.filter(m => m !== activeMirror)];

  // Apps live in pinpoint-mini, game textbooks live in assets
  const isMiniRepo = fetchFile.startsWith('yolk/') || fetchFile.startsWith('movies/') || fetchFile === 'ai.html' || fetchFile === 'web.html' || fetchFile.startsWith('pages/') || fetchFile.includes('Soundboard.html') || fetchFile.includes('happy-wheels') || fetchFile.includes('superhot') || fetchFile.includes('tetrominoes') || fetchFile.includes('tetris') || fetchFile.includes('retro-bowl');
  const primaryRepo = isMiniRepo ? 'pinpoint-edu/pinpoint-mini@main/' : 'pinpoint-edu/assets@main/';
  const fallbackRepo = isMiniRepo ? 'pinpoint-edu/assets@main/' : 'pinpoint-edu/pinpoint-mini@main/';

  const isLargeGame = fetchFile.includes('happy-wheels') || fetchFile.includes('retro-bowl') || fetchFile.includes('gladihoppers') || fetchFile.includes('highway-traffic') || fetchFile.includes('drivemad') || fetchFile.includes('bloonsTD5') || fetchFile.includes('bloonsTD4') || (typeof allGames !== 'undefined' && allGames.some(g => g.file && g.file.includes(fetchFile) && g.sizeBytes > 19000000));

  const urlsToTry = (isLargeGame || isMiniRepo) ? [
    'https://raw.githubusercontent.com/' + primaryRepo.replace(/@[^/]+\//, '/main/') + fetchFile,
    'https://cdn.statically.io/gh/' + primaryRepo + fetchFile,
    ...mirrors.map(m => m + '/gh/' + primaryRepo + fetchFile),
    'https://raw.githubusercontent.com/' + fallbackRepo.replace(/@[^/]+\//, '/main/') + fetchFile,
    'https://cdn.statically.io/gh/' + fallbackRepo + fetchFile,
    ...mirrors.map(m => m + '/gh/' + fallbackRepo + fetchFile)
  ] : [
    ...mirrors.map(m => m + '/gh/' + primaryRepo + fetchFile),
    'https://cdn.statically.io/gh/' + primaryRepo + fetchFile,
    'https://raw.githubusercontent.com/' + primaryRepo.replace(/@[^/]+\//, '/main/') + fetchFile,
    ...mirrors.map(m => m + '/gh/' + fallbackRepo + fetchFile),
    'https://cdn.statically.io/gh/' + fallbackRepo + fetchFile,
    'https://raw.githubusercontent.com/' + fallbackRepo.replace(/@[^/]+\//, '/main/') + fetchFile
  ];

  for (const url of urlsToTry) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const text = await res.text();
      if (text.includes('Package size exceeded') || text.includes('limit of 20 MB') || text.includes('404: Not Found') || text.trim().startsWith('{"status": 4')) {
        continue;
      }
      for (const m of CDN_MIRRORS) {
        if (url.startsWith(m)) {
          activeMirror = m;
          break;
        }
      }
      return { html: text, resolvedUrl: url };
    } catch(e) {
      continue;
    }
  }
  throw new Error('Could not fetch game from any CDN mirror.');
}

// Play Game in the In-Page Player
async function playGame(encodedFile, encodedTitle) {
  const file = decodeURIComponent(encodedFile);
  const title = decodeURIComponent(encodedTitle);
  const id = getGameId(file);

  currentPlayingFile = file;
  currentPlayingTitle = title;
  const playerTitleEl = document.getElementById('currentPlayerTitle');
  playerTitleEl.textContent = title;
  if (file.startsWith('movies/') || title.includes('Moss')) {
    playerTitleEl.classList.add('is-moss-title');
  } else {
    playerTitleEl.classList.remove('is-moss-title');
  }
  
  const isApp = file.startsWith('yolk/') || file.startsWith('movies/') || file === 'ai.html' || file === 'web.html' || file.includes('Soundboard.html') || file.startsWith('pages/');
  const playerView = document.getElementById('player-view');
  if (isApp) {
    playerView.classList.add('is-web-app');
  } else {
    playerView.classList.remove('is-web-app');
  }
  playerView.style.display = 'flex';

  if (window.PinpointSaveManager) {
    PinpointSaveManager.updateUI(file, title);
  }
  updatePlayerDownloadBtn();

  const iframe = document.getElementById('gameIframe');

  // Direct same-origin iframe navigation for web.html when hosted on custom domain / localhost
  if (file === 'web.html' && typeof location !== 'undefined' && (location.protocol === 'https:' || location.protocol === 'http:') && location.origin !== 'null' && !location.hostname.includes('jsdelivr.net') && !location.hostname.includes('googleusercontent.com')) {
    iframe.removeAttribute('srcdoc');
    iframe.src = 'web.html';
    try { iframe.contentWindow.focus(); } catch(e) {}
    return;
  }

  // Direct iframe navigation for external embeds
  if (file.startsWith('http') && file.includes('scratch.mit.edu')) {
    iframe.removeAttribute('srcdoc');
    iframe.src = file;
    try { iframe.contentWindow.focus(); } catch(e) {}
    return;
  }

  // 1. Check if game is saved offline in IndexedDB (apps and textbooks always load latest live code)
  const isMiniApp = file.startsWith('yolk/') || file.startsWith('movies/') || file === 'ai.html' || file === 'web.html' || file.includes('Soundboard.html') || file.includes('happy-wheels');
  if (!isMiniApp && typeof PinpointGameStorage !== 'undefined') {
    try {
      const record = await PinpointGameStorage.getGame(id);
      if (record && record.content && record.content.length > 50) {
        const isMiniRepo = file.startsWith('yolk/') || file.startsWith('movies/') || file === 'ai.html' || file === 'web.html' || file.startsWith('pages/') || file.includes('Soundboard.html') || file.includes('happy-wheels') || file.includes('superhot') || file.includes('tetrominoes') || file.includes('tetris');
        const primaryRepo = isMiniRepo ? 'pinpoint-edu/pinpoint-mini@main/' : 'pinpoint-edu/assets@main/';
        const offlineBase = (/^https?:\/\//i.test(file)) ? file : (activeMirror + '/gh/' + primaryRepo + file);
        writeGameIntoFrame(iframe, record.content, offlineBase);
        return;
      }
    } catch(e) {}
  }

  // 2. Show loading spinner while fetching
  iframe.removeAttribute('src');
  iframe.srcdoc = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .spinner { width: 36px; height: 36px; border: 3px solid #333; border-top: 3px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </head>
    <body>
      <div class="spinner"></div>
      <div style="font-size: 14px; letter-spacing: 0.5px;">Loading ${title}...</div>
