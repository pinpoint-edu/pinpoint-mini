<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Classroom</title>
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --surface: #18181b;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Top-Right Disguised Launcher Bar */
    .top-launcher-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 999999;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Libre Baskerville', serif;
      font-size: 14px;
      font-weight: 700;
      user-select: none;
      letter-spacing: -0.2px;
    }

    .brand-icon-svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    /* Center Hero Container */
    .hero-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }

    .hero-logo-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .hero-title {
      font-family: 'Libre Baskerville', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Mirror Selector Card */
    .mirror-form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      margin-bottom: 20px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .select-wrapper {
      position: relative;
      width: 100%;
    }

    select#mirrorSelect {
      width: 100%;
      height: 48px;
      padding: 0 42px 0 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: all 0.2s ease;
    }

    select#mirrorSelect:hover, select#mirrorSelect:focus {
      border-color: #ffffff;
      background: #202024;
    }

    .select-arrow-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      font-size: 20px;
    }

    /* Launch Button */
    .launch-btn {
      width: 100%;
      height: 48px;
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .launch-btn:hover {
      background: #e4e4e7;
      border-color: #e4e4e7;
      transform: translateY(-1px);
    }

    .launch-btn:active {
      transform: scale(0.98);
    }

    .launch-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Footer Meta */
    .meta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp' !important;
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>

  <!-- Disguised Top Launcher Bar -->
  <div class="top-launcher-bar">
    <div class="brand-pill">
      <svg class="brand-icon-svg" viewBox="0 0 24 24">
        <path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zm2-8h6v8H5v-8zm5-6H6L5 5H2v2h12V5h-3z"/>
      </svg>
      <span>Trashbin</span>
    </div>
  </div>

  <!-- Center Card -->
  <div class="hero-container">
    <div class="hero-logo-box">
      <svg viewBox="0 0 24 24" fill="#ffffff" width="36" height="36">
        <path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zm2-8h6v8H5v-8zm5-6H6L5 5H2v2h12V5h-3z"/>
      </svg>
    </div>

    <h1 class="hero-title">Trashbin</h1>
    <p class="hero-subtitle">Fast, unblocked browser games & minimalist music disguised cleanly inside Google Classroom.</p>

    <div class="mirror-form-group">
      <label class="form-label" for="mirrorSelect">
        <span class="material-symbols-sharp" style="font-size: 15px;">dns</span>
        <span>CDN Mirror Network</span>
      </label>
      <div class="select-wrapper">
        <select id="mirrorSelect">
          <option value="https://cdn.jsdelivr.net">cdn.jsdelivr.net (Default Anycast)</option>
          <option value="https://fastly.jsdelivr.net">fastly.jsdelivr.net (Fastly Edge)</option>
          <option value="https://testingcf.jsdelivr.net">testingcf.jsdelivr.net (Cloudflare Edge)</option>
          <option value="https://gcore.jsdelivr.net">gcore.jsdelivr.net (GCore Edge)</option>
          <option value="https://quantil.jsdelivr.net">quantil.jsdelivr.net (Quantil Edge)</option>
          <option value="https://originfastly.jsdelivr.net">originfastly.jsdelivr.net (Origin Fastly)</option>
        </select>
        <span class="material-symbols-sharp select-arrow-icon">expand_more</span>
      </div>
    </div>

    <button id="launchBtn" class="launch-btn" onclick="launchTrashbin()">
      <span class="material-symbols-sharp" style="font-size: 20px;">open_in_new</span>
      <span>Launch in Cloaked Tab</span>
    </button>

    <div class="meta-row">
      <span class="status-dot"></span>
      <span>Release v3.4 • Disguised in Classroom about:blank</span>
    </div>
  </div>

  <script>
    const TARGET_PATH = "/gh/pinpoint-edu/pinpoint-mini@v3.4/index.html";

    async function launchTrashbin() {
      const select = document.getElementById("mirrorSelect");
      const btn = document.getElementById("launchBtn");
      const selectedMirror = select.value || "https://cdn.jsdelivr.net";

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 20px;">hourglass_top</span><span>Opening Cloaked Tab...</span>';

      // 1. Open new cloaked about:blank tab immediately
      const newTab = window.open("about:blank", "_blank");

      try {
        // 2. Fetch the clean Trashbin HTML directly from chosen jsdelivr mirror
        const response = await fetch(selectedMirror + TARGET_PATH + "?t=" + Date.now());
        if (!response.ok) throw new Error("HTTP " + response.status);

        let htmlContent = await response.text();

        // 3. Inject base href so all games, assets, and mirrors resolve correctly
        const basePath = TARGET_PATH.substring(0, TARGET_PATH.lastIndexOf('/') + 1);
        const baseTag = '<base href="' + selectedMirror + basePath + '">';
        htmlContent = htmlContent.includes('<head>')
          ? htmlContent.replace('<head>', '<head>' + baseTag)
          : baseTag + htmlContent;

        // 4. Inject document into about:blank
        newTab.document.open();
        newTab.document.write(htmlContent);
        newTab.document.close();
      } catch (err) {
        if (newTab) {
          newTab.document.open();
          newTab.document.write(
            '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Error - Classroom</title>' +
            '<style>' +
            'body{background:#09090b;color:#fafafa;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}' +
            '.box{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:32px;max-width:440px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.6);}' +
            'h3{font-size:18px;margin-bottom:8px;color:#ef4444;}' +
            'p{font-size:14px;color:#a1a1aa;line-height:1.5;margin-bottom:20px;}' +
            'button{padding:10px 20px;background:#ffffff;color:#000000;border:none;border-radius:10px;font-weight:700;cursor:pointer;}' +
            '</style></head><body>' +
            '<div class="box">' +
            '<h3>Mirror Connection Error</h3>' +
            '<p>Could not connect to <code>' + selectedMirror + '</code> (' + (err.message || 'Network Error') + '). Please choose another jsdelivr mirror.</p>' +
            '<button onclick="window.close()">Close Tab</button>' +
            '</div>' +
            '</body></html>'
          );
          newTab.document.close();
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 20px;">open_in_new</span><span>Launch in Cloaked Tab</span>';
      }
    }
  </script>
</body>
</html>
