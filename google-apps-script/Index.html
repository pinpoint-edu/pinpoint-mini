<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home - Classroom</title>
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .launcher-container {
      position: fixed;
      top: 14px;
      right: 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 999999;
    }
    select#mirrorSelect {
      font-size: 14px;
      padding: 6px 10px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #ffffff;
      color: #000000;
      outline: none;
    }
    .brand-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-top: 5px;
      user-select: none;
    }
    .brand-text .black-text {
      color: #000000;
    }
    .brand-text .orange-text {
      color: #ff4500;
    }
  </style>
</head>
<body>

  <div class="launcher-container">
    <select id="mirrorSelect">
      <option value="" disabled selected>Select Mirror</option>
      <option value="https://cdn.jsdelivr.net">cdn.jsdelivr.net</option>
      <option value="https://fastly.jsdelivr.net">fastly.jsdelivr.net</option>
      <option value="https://gcore.jsdelivr.net">gcore.jsdelivr.net</option>
      <option value="https://testingcf.jsdelivr.net">testingcf.jsdelivr.net</option>
      <option value="https://jsd.onmicrosoft.cn">jsd.onmicrosoft.cn</option>
    </select>
    <div class="brand-text">
      <span class="black-text">Lava</span><span class="orange-text">games</span>
    </div>
  </div>

  <script>
    const targetPath = "/gh/pinpoint-edu/pinpoint-mini@v2.0/index.html";
    const mirrorSelect = document.getElementById("mirrorSelect");

    mirrorSelect.addEventListener("change", async (event) => {
      const selectedMirror = event.target.value;
      if (!selectedMirror) return;

      // 1. Open a new blank tab
      const newTab = window.open("about:blank", "_blank");

      try {
        // 2. Fetch the game website HTML from the chosen CDN mirror
        const response = await fetch(selectedMirror + targetPath + "?t=" + Date.now());
        if (!response.ok) throw new Error(response.status);

        let htmlContent = await response.text();

        // 3. Inject base href so games & assets resolve via chosen mirror
        const basePath = targetPath.substring(0, targetPath.lastIndexOf('/') + 1);
        const baseTag = '<base href="' + selectedMirror + basePath + '">';
        htmlContent = htmlContent.includes('<head>')
          ? htmlContent.replace('<head>', '<head>' + baseTag)
          : baseTag + htmlContent;

        // 4. Inject directly into about:blank (no classroom overlay)
        newTab.document.open();
        newTab.document.write(htmlContent);
        newTab.document.close();
      } catch (error) {
        if (newTab) {
          newTab.document.open();
          newTab.document.write(
            '<div style="color: black; font-family: sans-serif; padding: 20px;">' +
            'Failed to load from ' + selectedMirror + '. Try another mirror.' +
            '</div>'
          );
          newTab.document.close();
        }
      }

      // Reset dropdown menu
      event.target.value = "";
    });
  </script>

</body>
</html>
