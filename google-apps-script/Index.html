<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home - Classroom</title>
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #09090b;
      color: #fafafa;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .launcher-container {
      position: fixed;
      top: 16px;
      right: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 999999;
      gap: 6px;
    }
    select#mirrorSelect {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      border: 1px solid #27272a;
      border-radius: 4px;
      background: #18181b;
      color: #fafafa;
      outline: none;
      transition: all 0.2s ease;
    }
    select#mirrorSelect:hover, select#mirrorSelect:focus {
      border-color: #ffffff;
      background: #222226;
    }
    .brand-text {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #ffffff;
      user-select: none;
    }
    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp' !important;
      font-weight: normal;
      font-size: 18px;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body>

  <div class="launcher-container">
    <select id="mirrorSelect">
      <option value="" disabled selected>Select Mirror</option>
      <option value="https://cdn.jsdelivr.net">cdn.jsdelivr.net</option>
      <option value="https://fastly.jsdelivr.net">fastly.jsdelivr.net</option>
      <option value="https://quantil.jsdelivr.net">quantil.jsdelivr.net</option>
      <option value="https://testingcf.jsdelivr.net">testingcf.jsdelivr.net</option>
      <option value="https://originfastly.jsdelivr.net">originfastly.jsdelivr.net</option>
      <option value="https://gcore.jsdelivr.net">gcore.jsdelivr.net</option>
    </select>
    <div class="brand-text">
      <span class="material-symbols-sharp">delete_sweep</span>
      <span>Trashbin</span>
    </div>
  </div>

  <script>
    const targetPath = "/gh/pinpoint-edu/pinpoint-mini@v3.1/index.html";
    const mirrorSelect = document.getElementById("mirrorSelect");

    mirrorSelect.addEventListener("change", async (event) => {
      const selectedMirror = event.target.value;
      if (!selectedMirror) return;

      // 1. Open a new blank tab
      const newTab = window.open("about:blank", "_blank");

      try {
        // 2. Fetch the clean Trashbin HTML directly from chosen CDN mirror
        const response = await fetch(selectedMirror + targetPath + "?t=" + Date.now());
        if (!response.ok) throw new Error(response.status);

        let htmlContent = await response.text();

        // 3. Inject base href so games & assets resolve via chosen mirror
        const basePath = targetPath.substring(0, targetPath.lastIndexOf('/') + 1);
        const baseTag = '<base href="' + selectedMirror + basePath + '">';
        htmlContent = htmlContent.includes('<head>')
          ? htmlContent.replace('<head>', '<head>' + baseTag)
          : baseTag + htmlContent;

        // 4. Inject directly into about:blank
        newTab.document.open();
        newTab.document.write(htmlContent);
        newTab.document.close();
      } catch (error) {
        if (newTab) {
          newTab.document.open();
          newTab.document.write(
            '<div style="color: white; background: #09090b; font-family: sans-serif; padding: 24px; min-height: 100vh;">' +
            '<h3>Failed to load from ' + selectedMirror + '</h3>' +
            '<p style="color: #a1a1aa;">Please select another mirror from the dropdown.</p>' +
            '</div>'
          );
          newTab.document.close();
        }
      }
    });
  </script>
</body>
</html>
