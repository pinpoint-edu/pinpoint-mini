<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Classroom</title>
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --surface: #18181b;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Top-Right Disguised Launcher Bar */
    .top-launcher-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 999999;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Libre Baskerville', serif;
      font-size: 14px;
      font-weight: 700;
      user-select: none;
      letter-spacing: -0.2px;
    }

    .brand-icon-svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    /* Center Hero Container */
    .hero-container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
    }

    .hero-logo-box {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .hero-title {
      font-family: 'Libre Baskerville', serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* Update Notification Banner */
    .update-banner {
      width: 100%;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      text-align: left;
      box-sizing: border-box;
      animation: fadeIn 0.3s ease;
    }

    .update-banner-icon {
      font-size: 20px;
      color: #10b981;
      flex-shrink: 0;
    }

    .update-banner-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .update-banner-title {
      font-size: 13px;
      font-weight: 700;
      color: #fafafa;
    }

    .update-banner-sub {
      font-size: 12px;
      color: #a1a1aa;
    }

    .update-action-btn {
      padding: 6px 12px;
      background: #10b981;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .update-action-btn:hover {
      background: #34d399;
      transform: scale(1.03);
    }

    .version-badge-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
      margin-left: auto;
    }

    /* Form Fields */
    .mirror-form-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .select-wrapper {
      position: relative;
      width: 100%;
    }

    select.launcher-select {
      width: 100%;
      height: 48px;
      padding: 0 42px 0 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: #ffffff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: all 0.2s ease;
    }

    select.launcher-select:hover, select.launcher-select:focus {
      border-color: #ffffff;
      background: #202024;
    }

    .select-arrow-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      font-size: 20px;
    }

    /* Launch Button */
    .launch-btn {
      width: 100%;
      height: 48px;
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 6px;
      margin-bottom: 22px;
      transition: all 0.2s var(--parabola-ease);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .launch-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(255, 255, 255, 0.25);
      background: #f4f4f5;
    }

    .launch-btn:active {
      transform: scale(0.98);
    }

    .launch-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Meta Info */
    .meta-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .material-symbols-sharp {
      font-family: 'Material Symbols Sharp' !important;
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Disguised Top Launcher Bar -->
  <div class="top-launcher-bar">
    <div class="brand-pill">
      <svg class="brand-icon-svg" viewBox="0 0 24 24">
        <path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zm2-8h6v8H5v-8zm5-6H6L5 5H2v2h12V5h-3z"/>
      </svg>
      <span>Trashbin</span>
    </div>
  </div>

  <!-- Center Card -->
  <div class="hero-container">
    <div class="hero-logo-box">
      <svg viewBox="0 0 24 24" fill="#ffffff" width="36" height="36">
        <path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zm2-8h6v8H5v-8zm5-6H6L5 5H2v2h12V5h-3z"/>
      </svg>
    </div>

    <h1 class="hero-title">Trashbin</h1>
    <p class="hero-subtitle">Fast, unblocked browser games & minimalist music disguised cleanly inside Google Classroom.</p>

    <!-- Dynamic Update Banner (shows when newer release is found) -->
    <div id="updateBanner" class="update-banner" style="display: none;">
      <span class="material-symbols-sharp update-banner-icon">auto_awesome</span>
      <div class="update-banner-text">
        <span class="update-banner-title">New Version Available!</span>
        <span id="updateBannerDesc" class="update-banner-sub">A newer version is ready to launch.</span>
      </div>
      <button class="update-action-btn" onclick="applyLatestVersion()">Switch to Latest</button>
    </div>

    <!-- Release Version Selector -->
    <div class="mirror-form-group">
      <label class="form-label" for="versionSelect">
        <span class="material-symbols-sharp" style="font-size: 15px;">sell</span>
        <span>Version</span>
        <span id="versionStatusBadge" class="version-badge-pill" style="display: none;">Update Available</span>
      </label>
      <div class="select-wrapper">
        <select id="versionSelect" class="launcher-select" onchange="onVersionSelectChange()">
          <option value="latest" selected>Latest (Auto-detecting...)</option>
        </select>
        <span class="material-symbols-sharp select-arrow-icon">expand_more</span>
      </div>
    </div>

    <!-- CDN Mirror Selector -->
    <div class="mirror-form-group">
      <label class="form-label" for="mirrorSelect">
        <span class="material-symbols-sharp" style="font-size: 15px;">dns</span>
        <span>CDN Mirror Network</span>
      </label>
      <div class="select-wrapper">
        <select id="mirrorSelect" class="launcher-select">
          <option value="https://cdn.jsdelivr.net">cdn.jsdelivr.net (Default Anycast)</option>
          <option value="https://ohio-notes.broshan.com.np">ohio-notes.broshan.com.np (Direct Domain + Web)</option>
          <option value="https://fastly.jsdelivr.net">fastly.jsdelivr.net (Fastly Edge)</option>
          <option value="https://testingcf.jsdelivr.net">testingcf.jsdelivr.net (Cloudflare Edge)</option>
          <option value="https://gcore.jsdelivr.net">gcore.jsdelivr.net (GCore Edge)</option>
          <option value="https://quantil.jsdelivr.net">quantil.jsdelivr.net (Quantil Edge)</option>
          <option value="https://originfastly.jsdelivr.net">originfastly.jsdelivr.net (Origin Fastly)</option>
        </select>
        <span class="material-symbols-sharp select-arrow-icon">expand_more</span>
      </div>
    </div>

    <button id="launchBtn" class="launch-btn" onclick="launchTrashbin()">
      <span class="material-symbols-sharp" style="font-size: 20px;">open_in_new</span>
      <span>Launch in Cloaked Tab</span>
    </button>

    <div class="meta-row">
      <span class="status-dot"></span>
      <span id="versionMetaLabel">Release v3.8.1 • Disguised in Classroom about:blank</span>
    </div>
  </div>

  <script>
    const MIN_SUPPORTED_VERSION = "2.7";

    function parseSemVer(vStr) {
      if (!vStr) return null;
      const clean = vStr.replace(/^v/i, '').trim();
      const parts = clean.split('.').map(p => parseInt(p, 10));
      if (parts.some(n => isNaN(n))) return null;
      return parts;
    }

    function compareVersions(v1, v2) {
      const p1 = parseSemVer(v1);
      const p2 = parseSemVer(v2);
      if (!p1 || !p2) return 0;
      const maxLen = Math.max(p1.length, p2.length);
      for (let i = 0; i < maxLen; i++) {
        const num1 = p1[i] || 0;
        const num2 = p2[i] || 0;
        if (num1 > num2) return 1;
        if (num1 < num2) return -1;
      }
      return 0;
    }

    function isVersionAllowed(vStr) {
      if (!vStr) return false;
      if (vStr === "main" || vStr === "latest") return true;
      return compareVersions(vStr, MIN_SUPPORTED_VERSION) >= 0;
    }

    let baselineVersion = "v4.0.3";
    let activeVersion = "v4.0.3";
    let latestDetectedVersion = "v4.0.3";
    let availableVersions = [
      "v4.0.3",
      "v4.0.2",
      "v4.0.1",
      "v4.0.0",
      "v3.9.49",
      "v3.9.48",
      "v3.9.47",
      "v3.9.46",
      "v3.9.45",
      "v3.9.44",
      "v3.9.43",
      "v3.9.42",
      "v3.9.41",
      "v3.9.40",
      "v3.9.8",
      "v3.9.7",
      "v3.9.6",
      "v3.9.5",
      "v3.9.4",
      "v3.9.3",
      "v3.9.2",
      "v3.9.1",
      "v3.9",
      "v3.8.1",
      "v3.8",
      "v3.7",
      "v3.6",
      "v3.5",
      "v3.4",
      "v3.3",
      "v3.2",
      "v3.1",
      "v3.0",
      "v2.9",
      "v2.8",
      "v2.7",
      "main"
    ];

    function updateVersionUI() {
      const meta = document.getElementById("versionMetaLabel");
      if (meta) {
        meta.textContent = `Release ${activeVersion} • Disguised in Classroom about:blank`;
      }
    }

    async function checkLatestVersion() {
      try {
        const res = await fetch("https://data.jsdelivr.com/v1/packages/gh/pinpoint-edu/pinpoint-mini?t=" + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.versions) && data.versions.length > 0) {
            let fetchedList = data.versions
              .map(v => "v" + v.version.replace(/^v/, ''))
              .filter(isVersionAllowed);
            
            // Check version.json from raw github as well for newer commits
            try {
              const rawVerRes = await fetch("https://raw.githubusercontent.com/pinpoint-edu/pinpoint-mini/main/version.json?t=" + Date.now());
              if (rawVerRes.ok) {
                const verInfo = await rawVerRes.json();
                if (verInfo && verInfo.version) {
                  const tag = "v" + verInfo.version.replace(/^v/, '');
                  if (isVersionAllowed(tag) && !fetchedList.includes(tag)) fetchedList.unshift(tag);
                }
              }
            } catch(e) {}

            availableVersions = [...new Set([...fetchedList, "main"])];
            latestDetectedVersion = fetchedList[0] || "v3.5";

            let pinned = localStorage.getItem("trashbin_pinned_version");
            if (pinned && pinned !== "latest" && !isVersionAllowed(pinned)) {
              localStorage.removeItem("trashbin_pinned_version");
              pinned = "latest";
            }

            const select = document.getElementById("versionSelect");

            if (!pinned || pinned === "latest") {
              activeVersion = latestDetectedVersion;
            } else {
              activeVersion = pinned;
              if (pinned !== latestDetectedVersion) {
                const banner = document.getElementById("updateBanner");
                const desc = document.getElementById("updateBannerDesc");
                if (banner && desc) {
                  desc.textContent = `You are running ${pinned}. ${latestDetectedVersion} is now available!`;
                  banner.style.display = "flex";
                }
                const badge = document.getElementById("versionStatusBadge");
                if (badge) badge.style.display = "inline-block";
              }
            }

            renderVersionOptions();
          }
        }
      } catch (err) {
        console.log("[Launcher] Version check error:", err);
      }
      updateVersionUI();
    }

    function renderVersionOptions() {
      const select = document.getElementById("versionSelect");
      if (!select) return;
      let pinned = localStorage.getItem("trashbin_pinned_version") || "latest";
      if (pinned !== "latest" && !isVersionAllowed(pinned)) {
        pinned = "latest";
      }

      let optionsHtml = `<option value="latest">Latest (${latestDetectedVersion}) - Recommended</option>`;
      for (const ver of availableVersions) {
        if (!isVersionAllowed(ver)) continue;
        optionsHtml += `<option value="${ver}">${ver}${ver === latestDetectedVersion ? " (Newest)" : ""}</option>`;
      }
      select.innerHTML = optionsHtml;
      select.value = pinned;
    }

    function onVersionSelectChange() {
      const select = document.getElementById("versionSelect");
      const val = select.value;
      if (val === "latest" || !isVersionAllowed(val)) {
        activeVersion = latestDetectedVersion;
        localStorage.removeItem("trashbin_pinned_version");
        if (select.value !== "latest") select.value = "latest";
        const banner = document.getElementById("updateBanner");
        if (banner) banner.style.display = "none";
        const badge = document.getElementById("versionStatusBadge");
        if (badge) badge.style.display = "none";
      } else {
        activeVersion = val;
        localStorage.setItem("trashbin_pinned_version", val);
        if (val !== latestDetectedVersion) {
          const banner = document.getElementById("updateBanner");
          const desc = document.getElementById("updateBannerDesc");
          if (banner && desc) {
            desc.textContent = `Selected: ${val}. Newer version ${latestDetectedVersion} available.`;
            banner.style.display = "flex";
          }
        } else {
          const banner = document.getElementById("updateBanner");
          if (banner) banner.style.display = "none";
        }
      }
      updateVersionUI();
    }

    function applyLatestVersion() {
      const select = document.getElementById("versionSelect");
      if (select) select.value = "latest";
      onVersionSelectChange();
    }

    function getTargetPath(mirror) {
      if (mirror && mirror.includes("ohio-notes.broshan.com.np")) {
        return `/index.html`;
      }
      const v = (activeVersion === "latest" ? latestDetectedVersion : activeVersion).replace(/^@+/, "");
      return `/gh/pinpoint-edu/pinpoint-mini@${v}/index.html`;
    }

    // Relay web reader requests from the tab to Google Apps Script UrlFetchApp
    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data) return;

      if (data.type === "updateVersion") {
        if (typeof applyLatestVersion === "function") {
          applyLatestVersion();
        }
        return;
      }

      if (data.type !== "TB_WEB_FETCH" || !data.reqId || !data.url) return;
      const reply = (payload) => {
        try {
          if (event.source) {
            event.source.postMessage({ type: "TB_WEB_RESULT", reqId: data.reqId, result: payload }, "*");
          }
        } catch (e) {}
      };
      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => reply(res))
          .withFailureHandler((err) => reply({ ok: false, status: 502, error: err && err.message ? err.message : String(err) }))
          .fetchWebResource(data.url);
      } else {
        fetch("https://ohio-notes.broshan.com.np/api/web?format=json&url=" + encodeURIComponent(data.url))
          .then((r) => r.json())
          .then((res) => reply(res))
          .catch((err) => reply({ ok: false, status: 502, error: err.message || "Reader unavailable" }));
      }
    });

    async function launchTrashbin() {
      const select = document.getElementById("mirrorSelect");
      const btn = document.getElementById("launchBtn");
      const selectedMirror = select.value || "https://cdn.jsdelivr.net";
      const targetPath = getTargetPath(selectedMirror);

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 20px;">hourglass_top</span><span>Opening Cloaked Tab...</span>';

      // 1. Open new cloaked about:blank tab immediately
      const newTab = window.open("about:blank", "_blank");

      try {
        // 2. Fetch the clean Trashbin HTML directly from chosen mirror
        const response = await fetch(selectedMirror + targetPath + "?t=" + Date.now());
        if (!response.ok) throw new Error("HTTP " + response.status);

        let htmlContent = await response.text();

        // 3. Inject base href and launcher marker so all games, assets, and reader resolve correctly
        const basePath = targetPath.substring(0, targetPath.lastIndexOf('/') + 1);
        const baseTag = '<base href="' + selectedMirror + basePath + '"><script>window.__TRASHBIN_GAS_LAUNCHER__=true;</' + 'script>';
        htmlContent = htmlContent.includes('<head>')
          ? htmlContent.replace('<head>', '<head>' + baseTag)
          : baseTag + htmlContent;

        // 4. Inject document into about:blank
        newTab.document.open();
        newTab.document.write(htmlContent);
        newTab.document.close();
      } catch (err) {
        if (newTab) {
          newTab.document.open();
          newTab.document.write(
            '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Error - Classroom</title>' +
            '<style>' +
            'body{background:#09090b;color:#fafafa;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}' +
            '.box{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:32px;max-width:440px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.6);}' +
            'h3{font-size:18px;margin-bottom:8px;color:#ef4444;}' +
            'p{font-size:14px;color:#a1a1aa;line-height:1.5;margin-bottom:20px;}' +
            'button{padding:10px 20px;background:#ffffff;color:#000000;border:none;border-radius:10px;font-weight:700;cursor:pointer;}' +
            '</style></head><body>' +
            '<div class="box">' +
            '<h3>Mirror Connection Error</h3>' +
            '<p>Could not connect to <code>' + selectedMirror + '</code> (' + (err.message || 'Network Error') + '). Please choose another jsdelivr mirror.</p>' +
            '<button onclick="window.close()">Close Tab</button>' +
            '</div>' +
            '</body></html>'
          );
          newTab.document.close();
        }
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-sharp" style="font-size: 20px;">open_in_new</span><span>Launch in Cloaked Tab</span>';
      }
    }

    // Auto-detect version on page load
    renderVersionOptions();
    checkLatestVersion();
  </script>
</body>
</html>
